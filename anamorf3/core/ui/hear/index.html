<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слух</title>
<style>
/* ═══ Начальный экран по макету владельца из Blender (07.09.2026).
   Размеры сняты с макета 1920×1080 через камеру: рейка 79 px (x 8), квадраты
   67×66, борд 1815×1063 (x 99), плашка ввода 637×47 по центру снизу.
   Сцена 1920×1080 масштабируется в окно целиком — пропорции макета держатся. ═══ */
@font-face{font-family:"Aquire";src:url("fonts/Aquire.otf") format("opentype");font-display:block}
@font-face{font-family:"Gilroy";src:url("fonts/Gilroy-Light.ttf") format("truetype");font-weight:300;font-display:swap}
@font-face{font-family:"Gilroy";src:url("fonts/Gilroy-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Gilroy";src:url("fonts/Gilroy-Medium.ttf") format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Gilroy";src:url("fonts/Gilroy-Semibold.ttf") format("truetype");font-weight:600;font-display:swap}
:root{
  /* инверсия макета (владелец, 07.09 15:58): тёмные плоскости, светлые кубики */
  --bg:#0f0f0f; --rail:#2a2a2a; --rail2:#333333; --dark:#d9d9d9; --dark2:#e8e8e8;
  --board-a:#232323; --board-b:#343434; --rim:#161616; --ink:#e8e8e8; --dim:#9a9a9a; --dim2:#7a7a7a;
  --m0:#5a5a5a; --m1:#2e2e2e; --m2:#171717;                 /* сталь иконок на светлом кубике */
  --sw-off:rgba(255,255,255,.14); --sw-on:#d9d9d9; --knob:#e8e8e8; --knob-on:#1c1c1c; --rule:rgba(255,255,255,.06);
  --glow:#5fbf7a; --glow-k:1;                              /* свечение элементов: цвет и сила */
  --grid:rgba(255,255,255,.065); --wire:rgba(255,255,255,.18);
  --card-a:#2f2f2f; --card-b:#272727; --card-line:rgba(255,255,255,.08);
  --font:"Gilroy","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font:15px/1.5 var(--font);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* мягкая выпуклость всех светлых плоскостей — как у рендера */
.slab{position:absolute;border-radius:16px;background:linear-gradient(160deg,var(--rail2),var(--rail));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 8px rgba(0,0,0,.6)}
.sq{position:absolute;width:50px;height:50px;aspect-ratio:1;padding:0;border-radius:11px;background:linear-gradient(180deg,var(--dark2),var(--dark));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 5px rgba(0,0,0,.4);color:#2a2a2a;display:grid;place-items:center;border:0;outline:0;cursor:pointer;line-height:0}
.sq svg{width:32px;height:32px;display:block;filter:drop-shadow(0 1px 0 var(--eng-lo,rgba(255,255,255,.6))) drop-shadow(0 -1px 0 var(--eng-hi,rgba(0,0,0,.35)))}
/* язычок под плашкой — часть борда, выезжает вместе с ней */
#tab{position:absolute;left:calc(78px + (100% - 86px) / 2 - 342px);width:684px;bottom:8px;height:96px;border-radius:0 0 24px 24px;background:var(--rim);box-shadow:0 3px 12px rgba(0,0,0,.6);z-index:2;transform:translateY(-100%);opacity:0;transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .2s}
#tab{pointer-events:none}body.settings #tab{pointer-events:auto}   /* спрятанный язычок не должен ловить клики над плашкой */
#tab .in{position:absolute;inset:0 5px 5px;border-radius:0 0 20px 20px;background:var(--board-b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
#tab .bridge{position:absolute;left:5px;right:5px;top:-30px;height:34px;background:var(--board-b)}
body.settings #board{background:linear-gradient(180deg,var(--board-a),var(--board-b));--rimw:0px}
body.settings #board .in{box-shadow:none}
body.settings #tab{background:var(--board-b)}body.settings #tab .in{box-shadow:none}
#board{transition:bottom .38s cubic-bezier(.4,0,.2,1),background .3s,box-shadow .3s}
#feed{transition:opacity .12s}
#board.drop .in{box-shadow:inset 0 0 0 2px var(--glow),inset 0 1px 0 rgba(255,255,255,.07)}
body.settings #feed{opacity:0;pointer-events:none}
/* настройки интерфейса — проявляются на месте ленты */
/* ═══ ДОСКА — редактор: клетка, элементы, связи, панели ═══ */
#flow{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s .06s;overflow:hidden;cursor:default;
  --cell:26px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:calc(var(--cell) * var(--z,1)) calc(var(--cell) * var(--z,1));
  background-position:calc(var(--px,0px)) calc(var(--py,0px))}
body.flow #flow{opacity:1;pointer-events:auto}
#flow,#flow *{user-select:none}#flow [contenteditable="true"]{user-select:text;-webkit-user-select:text}
body.flow #feed{opacity:0;pointer-events:none}
#flow[data-tool="h"]{cursor:grab}#flow.drag{cursor:grabbing}
#flow[data-tool="n"],#flow[data-tool="t"],#flow[data-tool="s"],#flow[data-tool="f"],#flow[data-tool="c"],#flow[data-tool="k"]{cursor:copy}
#flow[data-tool="p"]{cursor:crosshair}#flow[data-tool="l"] .el{cursor:crosshair}
#port{position:absolute;left:0;top:0;width:1px;height:1px;transform:translate(var(--px,0px),var(--py,0px)) scale(var(--z,1));transform-origin:0 0}
#cards,#groups{position:absolute;left:0;top:0}
#wires,#guides{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#wires path{fill:none;pointer-events:none}
#wires path.ln{stroke:var(--wire);stroke-width:1.6}
#wires path.sel{filter:drop-shadow(0 0 4px var(--glow));stroke-width:2.6!important}
#wires path.hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#wires path.temp{stroke:var(--glow);stroke-width:2;stroke-dasharray:5 4}
#wires .lbl{cursor:pointer;pointer-events:all}#wires .lbl rect{fill:var(--card-a);stroke:var(--card-line)}#wires .lbl text{fill:var(--dim);font:11px var(--mono)}
#guides{pointer-events:none}#guides line{stroke:#ff5f8f;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
/* элементы */
.el{position:absolute;user-select:none;box-sizing:border-box}
.el .body{width:100%;height:100%;box-sizing:border-box}
.el.locked{opacity:.75}.el.locked::after{content:"🔒";position:absolute;right:6px;top:4px;font-size:10px;opacity:.6}
.el .pin{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--card-b);border:1.5px solid var(--wire);opacity:0;transition:opacity .12s,transform .12s;cursor:crosshair;z-index:3}
.el:hover .pin,.el.sel .pin{opacity:1}.el .pin:hover{transform:scale(1.5);background:var(--glow);border-color:var(--glow)}
.el .pin.l{left:-6px;top:calc(50% - 5px)}.el .pin.r{right:-6px;top:calc(50% - 5px)}.el .pin.t{top:-6px;left:calc(50% - 5px)}.el .pin.b{bottom:-6px;left:calc(50% - 5px)}
.el.frame .pin,.el.pen .pin{display:none}
.el.edit{cursor:text}.el.edit [contenteditable]{outline:0;background:rgba(128,128,128,.14);border-radius:5px;min-height:1em}
.el.edit .none{display:block}
/* карточка цепочки */
.el.card{width:240px;padding:11px 13px 12px;border-radius:13px;cursor:grab;background:linear-gradient(180deg,var(--card-a),var(--card-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.45);border:1px solid var(--card-line);transition:box-shadow .15s}
.el.card:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 8px 20px rgba(0,0,0,.55)}
.el.card h4{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:.005em;display:flex;align-items:baseline;gap:7px}
.el.card h4 .t{flex:1;min-width:0;line-height:1.25}
.el.card h4 s{width:7px;height:7px;border-radius:50%;flex:none;align-self:center;background:var(--dim2);text-decoration:none;cursor:pointer}
.el.card.ok h4 s{background:var(--glow);box-shadow:0 0 6px var(--glow)}
.el.card p{margin:0;font-size:12.5px;line-height:1.4;color:var(--dim)}
.el.card p.why{margin-top:6px;padding-top:6px;border-top:1px solid var(--card-line);color:var(--dim2);font-size:12px}
.el.card p.none{display:none}
.el.card em{flex:none;white-space:nowrap;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim2);margin-left:auto;letter-spacing:.04em}
/* стикер */
.el.note{border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);color:#222;cursor:grab;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.el.note .body{display:flex;align-items:center;justify-content:center}
.el.note .txt{font-weight:500;line-height:1.2;word-break:break-word;white-space:pre-wrap;max-width:100%}
.el.note.edit .txt{background:rgba(0,0,0,.06);min-width:60%}
/* текст */
.el.text{cursor:grab;padding:4px 6px;border-radius:6px;color:var(--ink)}
.el.text .txt{white-space:pre-wrap;word-break:break-word;line-height:1.35;min-height:1.2em}
.el.text:hover{outline:1px dashed var(--card-line)}
/* фигура */
.el.shape{cursor:grab}
.el.shape .body{position:relative}
.el.shape svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.el.shape .txt{position:absolute;inset:10%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-size:14px;line-height:1.3;white-space:pre-wrap;word-break:break-word;overflow:hidden}
.el.shape.edit .txt{display:block}
/* рамка */
.el.frame{border:1.5px solid var(--wire);border-radius:10px;cursor:grab;background:rgba(128,128,128,.04)}
.el.frame .ttl{position:absolute;left:0;top:-24px;font-size:12px;font-weight:600;color:var(--dim);padding:2px 8px;border-radius:6px;background:var(--card-a);border:1px solid var(--card-line);white-space:nowrap;cursor:text;outline:0}
/* картинка */
.el.image{cursor:grab;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4)}.el.image img{width:100%;height:100%;object-fit:fill;display:block}
/* код */
.el.code{cursor:grab;border-radius:10px;background:#141414;border:1px solid var(--card-line);box-shadow:0 4px 12px rgba(0,0,0,.4);overflow:hidden;color:#d7d7d7}
.el.code .cap{font:10px var(--mono);letter-spacing:.06em;color:var(--dim2);padding:5px 10px;border-bottom:1px solid var(--card-line);background:rgba(255,255,255,.03)}
.el.code pre{margin:0;padding:8px 10px;font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto;height:calc(100% - 24px);box-sizing:border-box;outline:0}
body.light .el.code{background:#f6f6f6;color:#222}
/* карандаш */
.el.pen{pointer-events:auto;cursor:grab}.el.pen svg{width:100%;height:100%;overflow:visible;display:block}
/* выделение и ручки */
.el.sel{outline:1.5px solid var(--glow);outline-offset:1px}
#selbox{position:absolute;display:none;pointer-events:none;border:1px solid transparent;z-index:50}
#selbox .hd{display:none;position:absolute;width:9px;height:9px;background:var(--knob);border:1.5px solid var(--glow);border-radius:2px;pointer-events:auto;transform:scale(calc(1 / var(--z,1)))}
#selbox.one .hd{display:block}
#selbox .hd[data-h="nw"]{left:-5px;top:-5px;cursor:nwse-resize}#selbox .hd[data-h="n"]{left:calc(50% - 5px);top:-5px;cursor:ns-resize}
#selbox .hd[data-h="ne"]{right:-5px;top:-5px;cursor:nesw-resize}#selbox .hd[data-h="e"]{right:-5px;top:calc(50% - 5px);cursor:ew-resize}
#selbox .hd[data-h="se"]{right:-5px;bottom:-5px;cursor:nwse-resize}#selbox .hd[data-h="s"]{left:calc(50% - 5px);bottom:-5px;cursor:ns-resize}
#selbox .hd[data-h="sw"]{left:-5px;bottom:-5px;cursor:nesw-resize}#selbox .hd[data-h="w"]{left:-5px;top:calc(50% - 5px);cursor:ew-resize}
#lasso{position:absolute;display:none;border:1px solid var(--glow);background:rgba(128,128,128,.10);border-radius:3px;pointer-events:none;z-index:8}
/* группы */
.grp{position:absolute;border:1.5px dashed var(--wire);border-radius:16px;pointer-events:none}
.grp b{position:absolute;left:12px;top:-9px;padding:1px 8px;border-radius:6px;background:var(--card-a);border:1px solid var(--card-line);font-size:11px;font-weight:500;color:var(--dim);pointer-events:auto;outline:0;cursor:text}
/* панели: инструменты слева, имя доски сверху, зум справа-снизу, свойства над выделением */
#btools{position:absolute;left:14px;top:0;bottom:0;margin:auto 0;height:max-content;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:13px;background:var(--panel-bg,rgba(70,70,70,.72));box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:60}
#btools .ic,#bzoom button{width:34px;height:34px;padding:0;border:0;border-radius:9px;background:transparent;color:var(--ic,#dedede);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s;font:14px var(--font)}
#btools .ic svg{width:21px;height:21px;display:block;shape-rendering:geometricPrecision}
#btools .ic:hover,#bzoom button:hover{background:rgba(255,255,255,.10);color:var(--ink)}
#btools .ic.on{background:var(--glow);color:#111;box-shadow:0 0 10px var(--glow)}
#btools .sep{height:1px;margin:3px 6px;background:rgba(128,128,128,.3)}
#shapes{position:absolute;left:46px;top:calc(50% - 130px);display:none;grid-template-columns:repeat(4,34px);gap:2px;padding:5px;border-radius:11px;background:var(--card-a);border:1px solid var(--card-line);box-shadow:0 8px 20px rgba(0,0,0,.4)}
#shapes.open{display:grid}
#shapes b{width:34px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--dim);cursor:pointer}#shapes b:hover{background:rgba(128,128,128,.2);color:var(--ink)}#shapes b.on{color:var(--glow)}
#shapes svg{width:26px;height:18px}
#bhead{position:absolute;left:14px;top:14px;z-index:61}
#bname{border:0;border-radius:10px;padding:7px 14px;background:var(--panel-bg,rgba(70,70,70,.72));box-shadow:0 4px 14px rgba(0,0,0,.35);color:var(--ink);font:600 13px var(--font);cursor:pointer}
#bname:hover{background:rgba(128,128,128,.28)}
#blist{display:none;position:absolute;left:0;top:38px;min-width:240px;padding:5px;border-radius:11px;background:var(--card-a);border:1px solid var(--card-line);box-shadow:0 8px 20px rgba(0,0,0,.4)}
#blist.open{display:block}
#blist b{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 10px;border-radius:7px;font-weight:400;font-size:13px;color:var(--ink);cursor:pointer}
#blist b:hover{background:rgba(128,128,128,.18)}#blist b.on{box-shadow:inset 2px 0 0 var(--glow)}#blist b em{font-style:normal;color:var(--dim2);padding:0 4px}#blist b em:hover{color:#ff5f8f}
#bzoom{position:absolute;right:16px;bottom:14px;display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--panel-bg,rgba(70,70,70,.72));box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:60}
#bzoom #zoomv{width:auto;padding:0 8px;font:12px var(--mono)}
#props{position:absolute;display:none;transform:translateX(-50%);gap:6px;padding:4px;border-radius:11px;background:var(--card-a);border:1px solid var(--card-line);box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:62;white-space:nowrap}
#props .grp1{display:flex;gap:1px;padding:0 3px;border-right:1px solid var(--card-line)}#props .grp1:last-child{border:0}
#props b{min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;border-radius:6px;font-weight:500;font-size:13px;color:var(--dim);cursor:pointer;line-height:1}
#props b:hover{background:rgba(128,128,128,.2);color:var(--ink)}#props b.on{color:var(--glow)}#props b.v{cursor:default;font-family:var(--mono);font-size:11px}
#props b svg{width:22px;height:14px}
#props .cols{align-items:center}#props .sw{width:16px;height:16px;border-radius:50%;margin:0 2px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(128,128,128,.5);cursor:pointer}
#props .sw.on{box-shadow:0 0 0 2px var(--card-a),0 0 0 3.5px var(--glow)}#props .sw[data-v="none"]{background:linear-gradient(135deg,transparent 45%,#ff5f8f 45%,#ff5f8f 55%,transparent 55%)}
#ctxmenu{position:absolute;display:none;min-width:220px;padding:5px;border-radius:11px;background:var(--card-a);border:1px solid var(--card-line);box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:70}
#ctxmenu b{display:flex;justify-content:space-between;gap:16px;padding:6px 10px;border-radius:7px;font-weight:400;font-size:13px;color:var(--ink);cursor:pointer}
#ctxmenu b:hover{background:rgba(128,128,128,.18)}#ctxmenu b em{font:10px var(--mono);color:var(--dim2)}
body.light #btools,body.light #bzoom,body.light #bname{background:rgba(255,255,255,.78);box-shadow:0 4px 14px rgba(0,0,0,.12)}body.light #btools .ic,body.light #bzoom button{color:#5f5f5f}
body.light #btools .ic:hover,body.light #bzoom button:hover{background:rgba(0,0,0,.08);color:#1f1f1f}
body.light .el.text{color:#222}body.light .el.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(0,0,0,.14)}
#prefs{position:absolute;inset:0;padding:40px 48px;opacity:0;pointer-events:none;transition:opacity .15s .06s;display:grid;grid-template-columns:repeat(3,minmax(220px,300px)) minmax(300px,420px);gap:32px 44px;align-content:start}
body.settings #prefs{opacity:1;pointer-events:auto}
#prefs h3{margin:0 0 12px;font-size:calc(12px * var(--ui,1));font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
#prefs label{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(9px * var(--ui,1)) 0;border-bottom:1px solid var(--rule);font-size:calc(15px * var(--ui,1));color:var(--ink)}
#prefs input[type=range]{width:120px;accent-color:var(--sw-on)}
#prefs .sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--sw-off);transition:background .2s;flex:none}
#prefs .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .2s}
#prefs input[type=checkbox]{display:none}
/* палитра: раскрывается под строкой «Цвет» */
#prefs .pal{max-height:0;overflow:hidden;opacity:0;margin:0 -6px;padding:0 6px;transition:max-height .22s cubic-bezier(.4,0,.2,1),opacity .18s}
#prefs .pal.open{max-height:160px;opacity:1;padding-top:14px;padding-bottom:6px}
#prefs .sw6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#prefs .sw6 b{position:relative;height:22px;border-radius:7px;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
#prefs .sw6 b:hover{transform:translateY(-1px)}
#prefs .sw6 b.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 2px var(--board-b),0 0 0 3px var(--c),0 0 12px var(--c)}
/* выбор шрифта: список того, что реально стоит в системе */
#prefs .pickbtn{border:0;border-radius:8px;padding:5px 12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:inherit;font-size:calc(13px * var(--ui,1));color:var(--ink);background:var(--sw-off);cursor:pointer;transition:background .15s}
#prefs .pickbtn:hover{background:rgba(128,128,128,.32)}
#prefs .fonts{max-height:0;overflow:hidden;opacity:0;margin:0 -6px;padding:0 6px;transition:max-height .22s cubic-bezier(.4,0,.2,1),opacity .18s}
#prefs .fonts.open{max-height:276px;opacity:1;padding-top:10px}
#prefs .fonts .list{max-height:236px;overflow-y:auto;scrollbar-width:thin}
#prefs .fonts b{display:block;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:400;font-size:calc(15px * var(--ui,1));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prefs .fonts b:hover{background:rgba(128,128,128,.18)}
#prefs .fonts b.on{background:rgba(128,128,128,.26);box-shadow:inset 2px 0 0 var(--glow)}
#prefs .fonts b i{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--dim2);margin-left:8px}
#prefs .fonts .sep{margin:8px 10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
#prefs .fonts .where{margin:8px 10px 0;font-family:var(--mono);font-size:10px;line-height:1.5;color:var(--dim2);white-space:normal;word-break:break-all}
/* горячие клавиши: клавиши как кнопки, действие слева */
#prefs .keys label{justify-content:space-between}#prefs .keys .kk{display:inline-flex;gap:0;flex:none}
#prefs .keys h3+h3,#prefs .keys label+h3{margin-top:22px}
#prefs .keys kbd{display:inline-block;min-width:22px;padding:2px 6px;margin-left:4px;border-radius:5px;text-align:center;font:500 11px/14px var(--mono);color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4)}
#prefs .keys .k{font:11px var(--mono);color:var(--dim2);margin-left:6px}
body.light #prefs .keys kbd{background:linear-gradient(180deg,#fff,#e6e6e6);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.15);color:#222}
/* подсказка при наведении — своя, не браузерная */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,4px);padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;
  font:11.5px var(--font);color:var(--ink);background:var(--card-a,#2f2f2f);border:1px solid var(--card-line,rgba(255,255,255,.08));box-shadow:0 6px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .15s,transform .15s;z-index:20}
[data-tip]:hover::after{opacity:1;transform:translate(-50%,0)}
#prefs #reset{border:0;border-radius:8px;padding:5px 14px;font:inherit;font-size:calc(13px * var(--ui,1));color:var(--ink);background:var(--sw-off);cursor:pointer;transition:background .15s}
#prefs #reset:hover{background:var(--sw-on);color:var(--knob-on)}
#prefs .hue{margin-top:12px}
#prefs .hue input{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(0 95% 55%),hsl(45 95% 55%),hsl(90 95% 55%),hsl(150 95% 55%),hsl(195 95% 55%),hsl(240 95% 55%),hsl(285 95% 55%),hsl(330 95% 55%),hsl(360 95% 55%));outline:0;cursor:pointer}
#prefs .hue input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.5)}
#prefs .wheel{position:relative;width:22px;height:22px;border-radius:50%;cursor:crosshair;flex:none;
  background:conic-gradient(hsl(0 70% 55%),hsl(60 70% 55%),hsl(120 70% 55%),hsl(180 70% 55%),hsl(240 70% 55%),hsl(300 70% 55%),hsl(360 70% 55%));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
#prefs .wheel::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--board-b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#prefs .wheel i{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(0,0,0,.5);z-index:2}
#prefs input[type=checkbox]:checked + .sw{background:var(--sw-on)}
#prefs input[type=checkbox]:checked + .sw::after{left:19px;background:var(--knob-on)}
body.settings .say.parked{bottom:-16px}                 /* в настройках — вниз; на доске стоит на месте, по центру, 637 */
body.settings .say:not(.parked),body.flow .say:not(.parked){opacity:0;pointer-events:none;transition:opacity .2s}
#chat svg{width:36px;height:36px}
#gear svg{width:38px;height:38px;filter:none;transform:translateY(0.5px)}
#up svg{width:38px;height:38px}
.sq:hover{background:linear-gradient(180deg,#f2f2f2,#e0e0e0)}
.sq{transition:width .28s cubic-bezier(.4,0,.2,1),border-radius .28s,background .2s,box-shadow .2s}
.sq.act{width:72px;border-radius:12px 0 0 12px;z-index:3;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 5px rgba(0,0,0,.4)}


/* ── рейка: верхний блок с кубиком «вверх», нижний — настройки ── */
#rail-top{left:8px;top:8px;width:62px;height:calc(100% - 8px * 3 - var(--rb,279px))}
#rail-bot{left:8px;bottom:8px;width:62px;height:var(--rb,279px)}
/* палочка между панелями рейки — тянуть границу, панели не меньше квадрата 62 */
#grip{position:absolute;left:8px;width:62px;height:14px;bottom:calc(var(--rb,279px) + 5px);z-index:4;cursor:ns-resize;display:grid;place-items:center;overflow:hidden;border-radius:8px}
#grip::after{content:"";width:22px;height:1px;border-radius:1px;opacity:.22;background:var(--ink);transition:opacity .15s,box-shadow .15s,background .15s}
#grip:hover::after,body.dragging #grip::after{opacity:1;box-shadow:var(--glow-shadow);background:linear-gradient(90deg,var(--glow) 0%,var(--glow-core) 22%,var(--glow-hot) 50%,var(--glow-core) 78%,var(--glow) 100%)}
body.noglow #grip:hover::after,body.noglow.dragging #grip::after{opacity:.45;background:var(--ink);box-shadow:none}
body.noglow #grip::before{display:none}
/* лучи вбок — как блик анаморфной оптики */
#grip::before{content:"";position:absolute;left:50%;top:50%;width:0;height:2px;transform:translate(-50%,-50%);border-radius:2px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--glow) 20%,var(--glow-core) 50%,var(--glow) 80%,transparent);
  filter:blur(1.2px);transition:width .18s cubic-bezier(.2,.8,.3,1),opacity .18s}
#grip:hover::before,body.dragging #grip::before{width:min(var(--ray,120px), 62px);opacity:var(--ray-o,.9)}
body.dragging{cursor:ns-resize;user-select:none}
#up{left:14px;top:14px}
#chat{left:14px;top:72px}
#gear{left:14px;bottom:14px}
/* ── борд: область текстов ── */
#board{position:absolute;left:78px;right:8px;top:8px;bottom:8px;z-index:4;border-radius:20px;padding:5px;box-shadow:10px 6px 14px -6px rgba(0,0,0,.5);transition:bottom .38s cubic-bezier(.4,0,.2,1);background:linear-gradient(180deg,#454545,#2a2a2a)}
#board .in{position:absolute;inset:var(--rimw,5px);border-radius:16px;transition:inset .38s cubic-bezier(.4,0,.2,1),box-shadow .3s;background:linear-gradient(180deg,var(--board-a),var(--board-b));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(0,0,0,.35);overflow:hidden}
#feed{position:absolute;top:14px;bottom:78px;left:14px;right:14px;overflow:auto;display:flex;flex-direction:column;gap:0;scrollbar-width:none;transition:right .3s cubic-bezier(.4,0,.2,1);
  --gl:calc(50% - 320.5px);--gr:calc(50% - 316.5px)}   /* по умолчанию границы = края плашки ввода */

/* ── ПОЛОСЫ ──
   Когда звучит несколько источников, лента делится на равные полосы: каждая
   прижата к бару снизу и растёт вверх своим текстом. Так речь друга, ролика и
   твоя идут одновременно и не перебивают друг друга в одном столбце. */
#feed.lanes{flex-direction:row;align-items:stretch;gap:18px;overflow:hidden}
#feed.lanes .lane{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
/* распорка сверху держит текст у бара, пока строк мало */
#feed.lanes .lane::before{content:"";flex:1 0 auto}

#feed.lanes > .ln,#feed.lanes > .day{display:none}
#feed.lanes .lane::-webkit-scrollbar{display:none}
/* Полоса — замкнутый столбец: строка не вылезает за её ширину ни при каком
   форматировании (длинное слово, ссылка, абзацы), поэтому колонки не наезжают
   друг на друга. Отступы внутри полосы сняты: текст стоит плотно от бара. */
#feed.lanes .lane .ln{margin-left:0 !important;width:100% !important;max-width:100% !important;
  box-sizing:border-box;padding-right:2px}
#feed.lanes .lane .ln.col{margin-left:0 !important;width:100% !important}
#feed.lanes .lane .ln .cap{max-width:100%;box-sizing:border-box}
#feed.lanes .lane .ln .x{overflow-wrap:anywhere;word-break:break-word}
#feed.lanes .lane .ln .foot{white-space:normal}
#feed.lanes .lane + .lane{border-left:1px solid var(--rule);padding-left:18px}
#feed::-webkit-scrollbar{display:none}
#feed::-webkit-scrollbar{width:6px}#feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
/* поиск по журналу — выезжает сверху по Ctrl+F */
#find{position:absolute;left:14px;right:24px;top:-46px;height:38px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-radius:10px;background:var(--panel,rgba(255,255,255,.06));background:rgba(128,128,128,.14);backdrop-filter:blur(6px);opacity:0;transition:top .2s cubic-bezier(.4,0,.2,1),opacity .16s;z-index:3}
body.finding #find{top:10px;opacity:1}
#find input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:calc(15px * var(--ui,1)) var(--font)}
#find input::placeholder{color:var(--dim2)}
#find .n{font-family:var(--mono);font-size:12px;color:var(--dim2);white-space:nowrap}
#find button{border:0;background:transparent;color:var(--dim);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:6px}
#find button:hover{background:rgba(128,128,128,.2);color:var(--ink)}
body.finding #feed{top:60px}
/* кнопка «вниз» со счётчиком новых */
#down{position:absolute;right:26px;bottom:96px;height:30px;padding:0 12px;border:0;border-radius:15px;background:rgba(128,128,128,.22);backdrop-filter:blur(6px);color:var(--ink);font:calc(13px * var(--ui,1)) var(--font);cursor:pointer;display:none;align-items:center;gap:8px;z-index:3}
#down.on{display:flex}
#down:hover{background:rgba(128,128,128,.34)}
#down span{font-family:var(--mono);font-size:12px;color:var(--glow)}
/* разделитель дня */
.day{display:flex;align-items:center;gap:12px;margin:16px 10px 8px;width:auto;color:var(--dim2);font-family:var(--mono);font-size:11px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.day:first-child{margin-top:2px}
/* подсветка найденного */
.ln mark{background:transparent;color:var(--glow-core);font-weight:600}
.ln.hit .cap::before{box-shadow:0 0 0 2px var(--glow)}
/* строка диалога: время · откуда · текст */
/* реплика = капсула: чужие источники слева, свои (микрофон, клавиатура, голосовое, файл) справа */
/* дорожки: каждый поток — своя полоса по горизонтали, время — общее сверху вниз, свои — справа */
/* центр — основной поток, границы центра = ползунки; боковые потоки делят своё поле поровну */
.ln{display:flex;flex-direction:column;align-items:flex-start;box-sizing:border-box;
  margin-left:calc(var(--gl) + 10px);width:calc(100% - var(--gl) - var(--gr) - 20px);
  padding:var(--pad,2px) 0;font-size:var(--fs,17px);font-weight:500;line-height:1.35;letter-spacing:.005em;border-radius:0;
  animation:appear .26s cubic-bezier(.2,.7,.2,1)}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ln.col{margin-left:var(--x);width:var(--w)}
/* ползунки по краям центра — как палочка на рейке, только вертикальные */
.vgrip{position:absolute;bottom:9px;height:47px;width:14px;margin-left:-7px;z-index:4;cursor:ew-resize;display:grid;place-items:center;overflow:hidden;border-radius:8px}
.vgrip.edge{cursor:pointer}
.vgrip::after{content:"";width:1px;height:22px;border-radius:1px;opacity:.22;background:var(--ink);transition:opacity .15s,box-shadow .15s,background .15s,height .2s}
.vgrip:hover::after,.vgrip.drag::after{opacity:1;height:30px;box-shadow:var(--glow-shadow);background:linear-gradient(180deg,var(--glow) 0%,var(--glow-core) 22%,var(--glow-hot) 50%,var(--glow-core) 78%,var(--glow) 100%)}
body.noglow .vgrip:hover::after,body.noglow .vgrip.drag::after{opacity:.45;background:var(--ink);box-shadow:none}
body.settings .vgrip,body.flow .vgrip,body.settings #heads,body.flow #heads,body.settings #srcmenu,body.flow #srcmenu{display:none!important}
/* заголовки боковых потоков над лентой */
#heads{position:absolute;left:14px;right:14px;top:10px;height:22px;pointer-events:none;display:none}
body.heads #heads{display:block}
#heads b{position:absolute;top:0;height:22px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:500;color:var(--dim);
  background:rgba(128,128,128,.14);pointer-events:auto;cursor:pointer;white-space:nowrap;max-width:200px}
#heads b i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 45% 55%);flex:none}
#heads b span{overflow:hidden;text-overflow:ellipsis}#heads b em{font-style:normal;color:var(--dim2);margin-left:4px}#heads b em:hover{color:#ff5f8f}
#heads b:hover{background:rgba(128,128,128,.24);color:var(--ink)}#heads b.empty{border:1px dashed rgba(128,128,128,.4);background:transparent}#heads b.main{cursor:default}
#srcmenu{position:absolute;display:none;min-width:220px;padding:5px;border-radius:11px;background:var(--card-a);border:1px solid var(--card-line);box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:12}
#srcmenu.open{display:block}#srcmenu h5{margin:4px 10px 6px;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
#srcmenu b{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-weight:400;font-size:13px;color:var(--ink);cursor:pointer}
#srcmenu b i{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 45% 55%);flex:none}#srcmenu b em{font:9px var(--mono);color:var(--glow);font-style:normal;margin-left:auto}#srcmenu{max-height:420px;overflow:auto;scrollbar-width:thin}#srcmenu b:hover{background:rgba(128,128,128,.18)}#srcmenu .none{padding:6px 10px;font-size:12px;color:var(--dim2)}
.ln .s{display:inline-flex;align-items:center;gap:6px;margin:6px 0 1px 16px;font-size:11px;color:var(--dim);white-space:nowrap;max-width:60%;overflow:hidden}
.ln .s span{overflow:hidden;text-overflow:ellipsis}
.ln .s i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 40% 52%)}
.ln.me .s{display:none}.ln.cont .s{display:none}body.no-src .ln .s{display:none}
.ln .cap{position:relative;max-width:calc(100% - 8px);padding:2px 0 2px 16px;display:block;line-height:1.56}
/* источник — точка слева от строки: цвет источника, у своих — твой цвет */
.ln .cap::before{content:"";position:absolute;left:0;top:.72em;width:3px;height:3px;border-radius:50%;background:hsl(var(--h) 45% 55%)}
.ln.me .cap::before{background:var(--glow);box-shadow:0 0 1px var(--glow)}
.ln .x{min-width:0;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;-webkit-hyphens:auto}
/* КНИЖНАЯ ПОЛОСА: между абзацами нет отбивки — новый отмечает только красная
   строка; висячие строки запрещены; главу диктор объявляет сам, она заголовок */
.ln .x p{margin:0;text-indent:1.3em;orphans:2;widows:2;text-wrap:pretty}
.ln .x p:first-child{text-indent:0}
.ln .x p.ch{text-indent:0;margin:.7em 0 .3em;font-weight:600;letter-spacing:.03em}
.ln .x p.ch:first-child{margin-top:0}
.ln .x p.ch::after{content:"";display:block;width:54px;height:1px;margin-top:.4em;
  background:linear-gradient(90deg,var(--glow),transparent);opacity:.5}
.ln .x .g{color:var(--dim2)}
.ln .foot{display:inline-flex;align-items:baseline;gap:7px;margin-left:10px;font-family:var(--mono);font-size:10.5px;color:var(--dim2);line-height:1.2;white-space:nowrap;vertical-align:baseline}
.ln .foot .w b{font-weight:400;color:var(--dim)}
/* фраза ещё идёт — счётчик бежит; когда речь встанет, он зафиксируется */
.ln .foot .w .live{color:var(--glow);opacity:.75}
.ln .foot .w .live::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--glow);margin-right:5px;vertical-align:1px;animation:tick 1.1s ease-in-out infinite}
@keyframes tick{0%,100%{opacity:.25}50%{opacity:1}}
/* текст переписан набело — короткая вспышка, чтобы глаз заметил правку */
.ln .x.polished{animation:polished .7s ease-out}
@keyframes polished{0%{background:rgba(120,220,160,.16)}100%{background:transparent}}
.ln .t{font-family:var(--mono)}
body.no-time .ln .t{display:none}
.ln .w{font-family:var(--mono)}
body.no-ghost .ln .x .g{display:none}body.no-lag .ln .w{display:none}
/* светлая тема — исходный макет */
body.light{--bg:#6e6e6e;--rail:#d5d5d5;--rail2:#dcdcdc;--dark:#2f2f2f;--dark2:#3a3a3a;--board-a:#e6e6e6;--board-b:#c9c9c9;--rim:#f2f2f2;--ink:#2a2a2a;--dim:#7a7a7a;--dim2:#9c9c9c;--m0:#f4f4f4;--m1:#c4c4c4;--m2:#909090;--sw-off:rgba(0,0,0,.18);--sw-on:#2f2f2f;--knob:#ffffff;--knob-on:#f2f2f2;--rule:rgba(0,0,0,.08);--eng-lo:rgba(0,0,0,.7);--eng-hi:rgba(255,255,255,.18);--sq-on-a:#585858;--sq-on-b:#454545;--sq-ring:rgba(0,0,0,.45)}
body.light .sq{color:#e0e0e0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 5px rgba(0,0,0,.35)}body.light .sq:hover{background:linear-gradient(180deg,#444,#333)}body.light #board{background:linear-gradient(180deg,var(--rim),#dadada)}body.light.settings #board{background:linear-gradient(180deg,var(--board-a),var(--board-b))}body.light .say{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.25));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.14)}body.light .say textarea{color:#2a2a2a}body.light .say textarea::placeholder{color:rgba(0,0,0,.28)}body.light .ln:hover .x{color:#000}body.light .ln.live .x::after{background:#3d3d3d}body.light{--grid:rgba(0,0,0,.06);--wire:rgba(0,0,0,.22);--card-a:#f4f4f4;--card-b:#e9e9e9;--card-line:rgba(0,0,0,.10)}
body.light .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(0,0,0,.14)}
body.light .slab{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.25)}
/* на светлом фоне светлые иконки не видны — своя пара цветов */
body.light .say .ic{color:#5f5f5f}body.light .say .ic:hover{background:rgba(0,0,0,.07);color:#1f1f1f}
body.light .say .bar{background:rgba(0,0,0,.16)}
body.light .say textarea::placeholder{color:rgba(0,0,0,.34)}
body.light.typing .say.typing{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),0 8px 18px rgba(0,0,0,.16)}
body.light #down{background:rgba(0,0,0,.10);color:#2a2a2a}body.light #down:hover{background:rgba(0,0,0,.16)}
body.light #find{background:rgba(0,0,0,.06)}body.light #find button:hover{background:rgba(0,0,0,.10)}
body.light #prefs .fonts b:hover{background:rgba(0,0,0,.06)}body.light #prefs .fonts b.on{background:rgba(0,0,0,.09)}
body.light #prefs .pickbtn:hover{background:rgba(0,0,0,.26)}
.ln:hover .x{color:#fff}
.ln.live .x::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#d0d0d0;margin-left:10px;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}
.ln.low .x{opacity:.65}
/* ── плашка ввода: стекло по центру снизу ── */
.say{position:absolute;left:calc(78px + (100% - 86px) / 2 - 318px);bottom:22px;z-index:6;transition:bottom .38s cubic-bezier(.4,0,.2,1),background .2s,box-shadow .2s;width:637px;height:47px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.055));
  backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.10),0 8px 20px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3)}
body.typing .say.typing{background:linear-gradient(180deg,rgba(255,255,255,.19),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 0 0 1px rgba(255,255,255,.14),0 10px 24px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3)}
.say{display:flex;align-items:center;height:auto;min-height:47px;padding:7.5px 9px}
.say textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 9px;margin:0;resize:none;overflow-y:auto;max-height:58px;
  font:500 calc(16px * var(--ui,1))/1.5 var(--font);letter-spacing:.005em;color:var(--ink);scrollbar-width:none}
.say textarea::-webkit-scrollbar{display:none}
.say textarea::placeholder{color:rgba(255,255,255,.3)}
.say .ic{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:9px;background:transparent;color:var(--ic,#c9c9c9);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.say .ic svg{width:20px;height:20px;display:block;filter:none;shape-rendering:geometricPrecision}
.say .ic:hover{background:rgba(255,255,255,.09);color:var(--ink)}
.say .ic.on{color:var(--glow)}
/* запись голосового: кружок горит красным, рядом бежит время */
.say #rec.rec{color:#ff5f6d;animation:recpulse 1.1s ease-in-out infinite}
@keyframes recpulse{0%,100%{filter:drop-shadow(0 0 2px #ff5f6d)}50%{filter:drop-shadow(0 0 8px #ff5f6d)}}
.say .rect{display:none;align-items:center;gap:6px;margin:0 6px 0 2px;font:12px var(--mono);color:#ff8a94}
.say .rect i{width:7px;height:7px;border-radius:50%;background:#ff5f6d;box-shadow:0 0 6px #ff5f6d;animation:recpulse 1.1s ease-in-out infinite}
body.rec .say .rect{display:inline-flex;order:-1;margin:0 4px 0 8px}
#eq{display:none;flex:1;min-width:0;height:32px;align-items:center;gap:12px;padding:0 6px}
body.rec #eq{display:flex}body.rec #say textarea,body.rec #say #plus{display:none}
#eq .bars{display:flex;align-items:center;gap:3px;height:100%;flex:1;min-width:0}
#eq .bars i{flex:1;max-width:6px;height:3px;border-radius:2px;background:var(--glow);box-shadow:0 0 4px var(--glow);transition:height .06s linear;opacity:.9}
body.rec.cancel #eq .bars i{background:#ff5f6d;box-shadow:0 0 4px #ff5f6d}body.rec.cancel .say .rect i{background:#888;box-shadow:none}
body.rec .say textarea::placeholder{color:rgba(255,255,255,.18)}
/* меню устройств микрофона — над плашкой */
#mics{position:absolute;display:none;width:360px;max-height:420px;overflow:auto;scrollbar-width:thin;padding:5px;border-radius:12px;background:var(--card-a);border:1px solid var(--card-line);box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:9;transition:bottom .38s cubic-bezier(.4,0,.2,1)}
#mics.open{display:block}
#mics h5{margin:4px 10px 6px;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
#mics b{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;font-weight:400;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden}
#mics b span{flex:1;overflow:hidden;text-overflow:ellipsis}#mics b em{font:9px var(--mono);color:var(--dim2);font-style:normal}
#mics b:hover{background:rgba(128,128,128,.18)}#mics b.on{box-shadow:inset 2px 0 0 var(--glow)}#mics b.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 5px var(--glow)}
#mics .none{padding:8px 10px;font-size:12px;color:var(--dim2)}
body.light #mics b:hover{background:rgba(0,0,0,.06)}
/* голосовое и вложения в ленте */
.ln .x .pl{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border:0;border-radius:50%;background:rgba(128,128,128,.22);color:var(--ink);cursor:pointer;vertical-align:middle;font-size:10px;padding:0 0 0 1px}
.ln .x .pl:hover{background:var(--glow);color:#111}.ln .x .pl.play{background:var(--glow);color:#111}
.ln .x a.fl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim2)}.ln .x a.fl:hover{border-bottom-color:var(--glow)}
.say #micb.on{color:var(--glow)}.say #micb.off{color:var(--dim2)}
.say #micb.off svg{opacity:.55}
.say #micb.talk{filter:drop-shadow(0 0 5px var(--glow));animation:micpulse 1s ease-in-out infinite}
@keyframes micpulse{0%,100%{filter:drop-shadow(0 0 2px var(--glow))}50%{filter:drop-shadow(0 0 8px var(--glow))}}
.say .chev{width:18px}.say .chev svg{width:15px;height:15px}
.say .bar{flex:none;width:1px;height:18px;margin:0 5px 0 3px;border-radius:1px;background:rgba(255,255,255,.13)}
.say #plus{margin-right:1px}
/* уголки плашки — зоны: навёл на скруглённый угол верхней грани — участок грани светится
   твоим цветом, из-под грани выезжает кнопка с подписью. В покое ничего не торчит. */
.say .edge{position:absolute;inset-block:0;height:auto;width:8%;z-index:4;pointer-events:none}
.say .edge.l{left:0}.say .edge.r{right:0}
.say .edge::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .22s;
  --c:var(--glow);--cc:var(--glow-core,#fff);
  border:1px solid var(--c);
  box-shadow:0 0 1.5px -1px var(--c),0 0 3px -3px var(--c),inset 0 0 3px -9px var(--c)}
.say .edge::after{content:"";position:absolute;inset:0;pointer-events:auto;cursor:pointer}
.say .edge.l::after{clip-path:polygon(0 0,100% 0,100% 9px,9px 9px,9px calc(100% - 9px),100% calc(100% - 9px),100% 100%,0 100%)}
.say .edge.r::after{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 calc(100% - 9px),calc(100% - 9px) calc(100% - 9px),calc(100% - 9px) 9px,0 9px)}
.say .edge.l::before{border-right:0;border-radius:16px 0 0 16px}
.say .edge.r::before{border-left:0;border-radius:0 16px 16px 0}
/* свечение сплошное от угла, затухает к центру плашки */
.say .edge.l::before,.say .edge.l::after{-webkit-mask:linear-gradient(90deg,#000 55%,transparent);mask:linear-gradient(90deg,#000 55%,transparent)}
.say .edge.r::before,.say .edge.r::after{-webkit-mask:linear-gradient(270deg,#000 55%,transparent);mask:linear-gradient(270deg,#000 55%,transparent)}
.say .edge.r{--c:#ff5f6d;--cc:#ffc2c8}.say .edge.r::before{--c:#ff5f6d;--cc:#ffc2c8}.say .edge.r::after{--cc:#ffc2c8}
/* в покое уголок чуть дышит — намёк, что там кнопка; при наведении разгорается */
.say .edge::before{opacity:.22;animation:edgebreath 3.2s ease-in-out infinite}
@keyframes edgebreath{0%,100%{opacity:.14}50%{opacity:.32}}
.say .edge:hover::before{opacity:1;animation:none}.say .edge:hover::after{opacity:1}
body.noglow .say .edge::before{opacity:0;animation:none}body.noglow .say .edge:hover::before{opacity:.6}
/* основная плашка: угол «микрофон» живёт только пока микрофон пишет; снят — серый, без свечения */
body.micoff #edgeL::before{--c:var(--dim2);--cc:var(--dim2);animation:none;opacity:0}body.micoff #edgeL:hover::before{opacity:.5}
body.micoff #edgeL::after{display:none}
body.micoff #bumpL i{background:var(--dim2)!important;box-shadow:none}body.micoff #bumpL{color:var(--dim2)}
body.noglow .say .edge::before{box-shadow:none}
/* сама кнопка — теперь отдельный слой .strm-tab, а не потомок .say: у .say свой стек (z-index:6),
   и всё внутри нег, даже z-index:-1, всё равно рисуется ПОВЕРХ ленты — потому и бамп всплывал
   впереди строки. .strm-tab живёт как сосед .say с z-index НИЖЕ плашки (5 < 6) — теперь бамп
   реально выезжает ИЗ-ЗА неё, как #tab выезжает из-под #board. Уголок-хотспот (.edge) остаётся
   внутри .say.extra — ему нужно ловить наведение в границах самой плашки. */
.strm-tab{position:absolute;bottom:22px;height:47px;z-index:5;pointer-events:none}
.strm-tab .bump{position:absolute;top:2px;height:20px;width:88px;border-bottom:1.5px solid rgba(255,255,255,.12);padding:0 0 1px;border:0;border-radius:10px 10px 0 0;cursor:pointer;opacity:0;pointer-events:none;
  box-sizing:border-box;text-align:center;font:500 11px/19px var(--font);letter-spacing:.02em;color:var(--dim);white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 0 0 1px rgba(255,255,255,.09),0 -3px 10px rgba(0,0,0,.28);
  transition:top .32s cubic-bezier(.34,1.45,.5,1),opacity .18s,color .15s,background .15s}
.strm-tab .bump.show{top:-20px;opacity:1;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.09));pointer-events:auto}
.strm-tab .bump.l{left:16px}.strm-tab .bump.r{right:16px;color:#ff7a86}
.strm-tab .bump.r.show{color:#ff9aa3}
.strm-tab .bump.l i{display:inline-block;width:3px;height:3px;border-radius:50%;margin:0 6px 0 0;vertical-align:1px;background:hsl(var(--h,0) 45% 55%);box-shadow:0 0 1px hsl(var(--h,0) 45% 55%)}
.strm-tab .bump.l.none i{background:var(--dim2);box-shadow:none}
#say .edge,#say .bump{display:none}                     /* на основной плашке источник и так виден через шеврон */
body.light .strm-tab .bump{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.45));color:#555}body.light .strm-tab .bump.show{color:#111}
</style>
</head>

<script>
/* ═══ БЛОК 1: сцена 1920×1080 вписывается в окно целиком ═══ */
const stage = document.getElementById('stage');
/* масштаб — по высоте, ширина сцены тянется под окно: полей по бокам нет */
function fit(){ const k = innerHeight / 1080; stage.style.width = Math.round(innerWidth / k) + 'px'; stage.style.transform = 'scale(' + k + ')'; }
addEventListener('resize', fit); fit();
/* ═══ БЛОК 2: связь со сценой слуха ═══ */
function hue(name){ let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const NAME = {mic: 'микрофон', typed: 'клавиатура'};
const feed = document.getElementById('feed');
const ROWS = new Map(); const LAGS = [];
const CONT = new Map();   // ch -> строка, которая ещё дописывается (речь не встала)
const UTT = new Map();    // ch -> {t0, seg} — когда началась текущая фраза
/* Слова строки считаем не из вёрстки, а по запомненному числу: на строке в
   тысячу слов чтение textContent при каждом черновике съедало кадр, и вкладка
   вставала колом при двух говорящих сразу. */
function словСтроки(r){
  if (!r) return 0;
  const t = (r.dataset.base || '') + ' ' + ((r.querySelector('.x .g') || {}).textContent || '');
  if (r._ткст === t) return r._слов || 0;
  r._ткст = t; r._слов = t.trim().split(/\s+/).filter(Boolean).length;
  return r._слов;
}
function liveRate(ch, el){
  const u = UTT.get(ch); if (!u || !el) return '';
  if (u.row && u.row !== el) return '';
  /* Живой замер идущей речи: время — от начала ЗВУКА фразы (первый кусок приходит,
     когда человек говорил уже секунд двенадцать, отсчёт от его прихода завышал
     скорость). Показания те же, что у готовой строки, но текут вместе с текстом. */
  const слов = словСтроки(el);
  const сек = Math.max(0.1, (Date.now() - (+el.dataset.t0 || u.t0)) / 1000);
  const f1 = v => String(Math.round(v * 10) / 10).replace('.', ',');
  const мин = Math.floor(сек / 60), идёт = мин ? мин + ':' + String(Math.floor(сек % 60)).padStart(2, '0') : f1(сек) + ' с';
  const p = ['<i class="live">' + f1(слов / сек) + ' сл/с</i>', идёт, String(слов) + ' сл.'];
  const кто = NAME[ch] || ch; if (кто) p.push(кто);
  if (u.eng) p.push(u.eng);
  if (u.lag != null) p.push('<b>' + u.lag + ' мс</b>');
  return p.join(' · ');
}
/* Речь ушла из строки — замер по ней закончен, метка застывает НАВСЕГДА: скорость
   считается по всей строке и времени, которое она писалась. Без этого живой
   счётчик оставался на каждой строке, через которую прошёл текст. */
function застыть(row, u){
  if (!row || !u) return;
  const w = row.querySelector('.foot .w'); if (!w) return;
  const слов = словСтроки(row);
  /* время строки — по звуку: от начала её первого куска до конца последнего.
     Замер мог пересоздаться по дороге, и тогда выходило «0,1 с · 300 сл/с». */
  const a = +row.dataset.t0 || u.t0, b = +row.dataset.t1 || u.at || Date.now();
  const сек = Math.max(0.1, (b - a) / 1000);
  const f1 = v => String(Math.round(v * 10) / 10).replace('.', ',');
  const p = [];
  /* Строка из истории не несёт границ звука — выдумывать по ней скорость нельзя:
     раньше в метке стояло «0,1 с» и «300 сл/с», чего в природе не было. */
  const честно = сек > 0.5;
  if (слов && честно) p.push(f1(слов / сек) + ' сл/с');
  if (честно) p.push(сек >= 60 ? Math.floor(сек/60) + ':' + String(Math.floor(сек%60)).padStart(2,'0') : f1(сек) + ' с');
  if (слов) p.push(слов + ' сл.');
  const кто = NAME[u.ch] || u.ch; if (кто) p.push(кто);
  if (u.eng) p.push(u.eng);
  if (u.lag != null) p.push('<b>' + u.lag + ' мс</b>');
  w.innerHTML = p.join(' · ');
}
const NAMES = new Set();  // имена собственные: их нельзя писать со строчной при склейке
setInterval(async () => { try { const d = await (await fetch('/api/scribe?limit=1')).json();
  (d.names || []).forEach(n => NAMES.add(n)); } catch (e){} }, 30000);
let ws;
let ПОСЛЕДНЕЕ = Date.now();
function connect(){
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onerror = () => { try { ws.close(); } catch (e){} };
  ws.onmessage = e => { ПОСЛЕДНЕЕ = Date.now(); handle(JSON.parse(e.data)); };
}
/* Сторож связи: оборванный сокет не всегда сообщает о себе — он просто молчит,
   и вкладка висит с картинкой, пока сервер пишет. Молчание дольше 12 секунд
   (уровни каналов идут 20 раз в секунду, тишины тут не бывает) — рвём и
   переподключаемся сами. */
setInterval(() => {
  if (Date.now() - ПОСЛЕДНЕЕ < 12000) return;
  ПОСЛЕДНЕЕ = Date.now();
  try { if (ws && ws.readyState === 1) ws.close(); else connect(); } catch (e){ connect(); }
}, 5000);
function handle(m){
  /* снимок приходит и при обрыве связи — уже показанное не сносим */
  if (m.type === 'snapshot'){ start().then(() => { (m.events || []).forEach(event); toBottom(); }); }
  else if (m.type === 'levels'){ micState(m.ch && m.ch.mic); }
  else if (m.type === 'ui_reload') location.replace(location.pathname + '?v=' + Date.now());
  else if (m.type === 'eq') eqFeed(m.b || []);
  else event(m);
}
/* ═══ БЛОК 3: лента на борде ═══
   Лента живёт дольше вкладки: при открытии подтягиваем журнал с диска,
   вверх — порциями по мере прокрутки, вниз — живыми событиями. Строка
   одна и та же для журнала, эфира и поиска: rowFrom() лепит, paint() наполняет.
*/
function fmt(t){ return new Date(t * 1000).toTimeString().slice(0, 8); }
const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
function dayOf(t){ const d = new Date(t * 1000); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dayName(t){
  const now = new Date(), d = new Date(t * 1000);
  if (dayOf(t) === dayOf(now / 1000)) return 'сегодня';
  if (dayOf(t) === dayOf(now / 1000 - 86400)) return 'вчера';
  return d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
}
function daySep(t){ const d = document.createElement('div'); d.className = 'day'; d.textContent = dayName(t); return d; }
/* ═══ ПОТОКИ ═══
   Поток = колонка ленты + своя плашка внизу. Основной поток («main») — свои реплики
   и всё, что не забрали другие. Дополнительный поток слушает один источник
   (выбирается шевроном в его плашке). До десяти потоков.
   Один поток — колонка по плашке в центре, границы — два ползунка по краям.
   Больше одного — колонки делят борд по долям; ползунки между колонками тянут
   границы, двойной щелчок по ползунку — новый поток рядом. Всё помнится в браузере.
*/
let LAY = {s: [{id: 'main', src: null}], b: [0, 1], dl: 0, dr: 0};
try { const o = JSON.parse(localStorage.getItem('hear.streams') || 'null'); if (o && o.s && o.b && o.b.length === o.s.length + 1){ delete o.gl; delete o.gr; LAY = o; } } catch (e){}
function saveLay(){ try { localStorage.setItem('hear.streams', JSON.stringify(LAY)); } catch (e){} }
const MINE = ch => ch === 'mic' || ch === 'typed' || ch === 'файл';
const MAINI = () => Math.max(0, LAY.s.findIndex(x => x.id === 'main'));
function laneOf(ev){
  if (ev.stream){ const i = LAY.s.findIndex(x => x.id === ev.stream); if (i >= 0) return i; }
  { const i = LAY.s.findIndex(x => x.src && базовый(x.src) === базовый(ev.ch)); if (i >= 0) return i; }
  if (!MINE(ev.ch)){
    const i = LAY.s.findIndex(x => x.src === ev.ch);
    if (i >= 0) return i;
    const j = LAY.s.findIndex(x => x.src && базовый(x.src) === базовый(ev.ch));
    if (j >= 0) return j;                      // тот же процесс под новым именем
  }
  return MAINI();
}
/* геометрия колонки i в координатах ленты: плашка и текст — одно и то же поле */
function colGeom(i){
  const W = feed.clientWidth, n = LAY.s.length;
  if (n === 1){ const [gl, gr] = edges(); return {x: gl, w: W - gl - gr}; }
  const cx = LAY.b[i] * W, cw = (LAY.b[i + 1] - LAY.b[i]) * W;
  const w = Math.max(160, cw - 28);                        // плашка во всю колонку, зазор под ползунки
  return {x: cx + (cw - w) / 2, w};
}
/* Полосы: контейнер на каждый поток. Строка живёт в полосе своего источника,
   полоса прижата к низу — новый текст всегда у бара, старый уезжает вверх. */
function полосы(){
  const n = LAY.s.length;
  feed.classList.toggle('lanes', n > 1);
  if (n <= 1){
    for (const l of [...feed.querySelectorAll('.lane')]){
      while (l.firstChild) feed.appendChild(l.firstChild);
      l.remove();
    }
    return;
  }
  const было = feed.classList.contains('lanes');
  LAY.s.forEach(st => {
    if (!feed.querySelector('.lane[data-s="' + st.id + '"]')){
      const l = document.createElement('div'); l.className = 'lane'; l.dataset.s = st.id;
      feed.appendChild(l);
    }
  });
  for (const l of [...feed.querySelectorAll('.lane')])
    if (!LAY.s.some(st => st.id === l.dataset.s)){
      while (l.firstChild) (feed.querySelector('.lane') || feed).appendChild(l.firstChild);
      l.remove();
    }
  // порядок полос — как в раскладке
  LAY.s.forEach(st => { const l = feed.querySelector('.lane[data-s="' + st.id + '"]'); if (l) feed.appendChild(l); });
  /* Строки, показанные до появления полос, раскладываем по своим — иначе они
     висят поверх, как будто лента раздвоилась. Порядок по времени сохраняем. */
  const сироты = [...feed.children].filter(r => r.classList && r.classList.contains('ln'));
  сироты.sort((a, b) => (+a.dataset.t || 0) - (+b.dataset.t || 0));
  for (const r of сироты) place(r, ROWEV.get(r.dataset.seg) || {ch: r.dataset.ch || '', stream: r.dataset.stream || ''});
  for (const l of feed.querySelectorAll('.lane')) l.scrollTop = l.scrollHeight;
}
function place(r, ev){
  /* История может не иметь живого события в ROWEV. В этом случае маршрут
     восстанавливается по сохранённому источнику, а не по устаревшему индексу колонки. */
  const saved = ev || {ch: r.dataset.ch || '', stream: r.dataset.stream || ''};
  const n = LAY.s.length, i = laneOf(saved);
  r.dataset.si = i;
  if (n === 1){ r.classList.remove('col'); r.style.removeProperty('--x'); r.style.removeProperty('--w'); return; }
  const l = feed.querySelector('.lane[data-s="' + (LAY.s[i] || {}).id + '"]');
  if (l){                                        // полосы: строка живёт внутри своей
    r.classList.remove('col'); r.style.removeProperty('--x'); r.style.removeProperty('--w');
    if (r.parentElement !== l) l.appendChild(r);
    return;
  }
  const g = colGeom(i);
  r.classList.add('col'); r.style.setProperty('--x', g.x + 'px'); r.style.setProperty('--w', g.w + 'px');
}
const ROWEV = new Map();                                   // seg → событие (для перераскладки)
function relayout(){ полосы(); for (const r of feed.querySelectorAll('.ln')) place(r, ROWEV.get(r.dataset.seg)); bars(); grips(); heads(); }
/* геометрия: центр при одном потоке — по плашке */
/* границы центра при одном потоке — смещение от краёв плашки (dl, dr), а не пиксели от края ленты:
   плашка всегда по центру, и при любом размере окна палочки стоят у её краёв */
function edges(){
  const W = feed.clientWidth, bl = Math.round(W / 2 - 320.5), br = Math.round(W / 2 - 316.5);
  return [Math.max(0, bl - (LAY.dl || 0)), Math.max(0, br - (LAY.dr || 0))];
}
function gripsApply(){
  const [gl, gr] = edges();
  feed.style.setProperty('--gl', gl + 'px'); feed.style.setProperty('--gr', gr + 'px');
  grips(); heads(); bars();
}
/* ползунки: при одном потоке — по краям центра, иначе — на границах колонок */
const gripsBox = document.getElementById('grips');
function grips(){
  if (LAY.s.some(s => s.авто)){                // полосы слуха — без ручных границ
    gripsBox.innerHTML = '';
    return;
  }
  const W = feed.clientWidth, n = LAY.s.length; gripsBox.innerHTML = '';
  const [gl, gr] = edges();
  /* один поток: по краям плашки. Несколько: между плашками, плюс крайние — только для нового потока */
  /* по два ползунка на плашку — у её левого и правого края; соседние тянут одну и ту же границу */
  const xs = [], bnd = [];
  const GAP = 4;                                             // как на рейке: линия в 4 px от панели
  if (n === 1){ xs.push(gl - GAP, W - gr + GAP); bnd.push(0, 1); }
  else LAY.s.forEach((_, i) => { const gm = colGeom(i); xs.push(gm.x - GAP, gm.x + gm.w + GAP); bnd.push(i, i + 1); });
  xs.forEach((x, j) => {
    const g = document.createElement('div'); g.className = 'vgrip'; g.style.left = (14 + x) + 'px';
    const k2 = bnd[j], edge = n > 1 && (k2 === 0 || k2 === n);
    if (edge) g.classList.add('edge');
    g.title = edge ? 'двойной щелчок — новый поток' : 'тянуть — граница · двойной щелчок — новый поток';
    g.addEventListener('mousedown', e => {
      if (edge) return;
      e.preventDefault(); g.classList.add('drag');
      const k = innerHeight / 1080, sx = e.clientX, b0 = LAY.b.slice(), gl0 = gl, gr0 = gr;
      const move = ev => {
        const d = (ev.clientX - sx) / k;
        if (n === 1){
          const bl = Math.round(W / 2 - 320.5), br = Math.round(W / 2 - 316.5);
          if (j === 0) LAY.dl = bl - Math.round(Math.max(0, Math.min(W - gr0 - 320, gl0 + d)));
          else LAY.dr = br - Math.round(Math.max(0, Math.min(W - gl0 - 320, gr0 - d)));
          gripsApply(); return; }
        const lo = b0[k2 - 1] + 190 / W, hi = b0[k2 + 1] - 190 / W;      // граница k2 между колонками k2-1 и k2
        LAY.b[k2] = Math.max(lo, Math.min(hi, b0[k2] + d / W));
        for (const r of feed.querySelectorAll('.ln.col')) place(r); bars(); heads(); grips(); gripsBox.querySelectorAll('.vgrip')[j].classList.add('drag');
      };
      const up = () => { for (const q of gripsBox.querySelectorAll('.vgrip')) q.classList.remove('drag'); saveLay(); removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    });
    g.addEventListener('dblclick', () => addStream(k2));
    gripsBox.appendChild(g);
  });
}
/* новый поток на позиции at (индекс колонки): колонки делят ширину поровну */
function addStream(at){
  if (LAY.s.length >= 10 || feed.clientWidth / (LAY.s.length + 1) < 200) return;
  LAY.s.splice(at, 0, {id: 's' + Date.now().toString(36), src: null});
  const n = LAY.s.length; LAY.b = Array.from({length: n + 1}, (_, i) => i / n);
  saveLay(); relayout(); pickSrc(at);
}
/* ── АВТОКОЛОНКИ ──
   Пока говорит один источник, лента — одна широкая полоса: так читать удобнее.
   Как только вторых источник тоже заговорил (друг в Discord, ролик, игра), под
   каждого заводится свой столбик, и их речь идёт параллельно, не перебивая
   друг друга. Источник, замолчавший надолго, свой столбик отдаёт обратно. */
/* Процесс, перезапущенный на ходу, приходит под новым именем канала —
   «Discord·32», «mpc-hc64·4». Это тот же источник: полосу ему заводим одну. */
const базовый = ch => String(ch || '').split('\u00b7')[0];
/* Служебные обёртки над микрофоном (шумодав, виртуальные устройства) — это тот
   же твой голос, а не отдельный собеседник: своего столбца они не получают. */
const ОБЁРТКИ = /^(nvidia broadcast|realtek|steam|steamwebhelper|voicemeeter|cable|obs64)/i;
const АКТИВ = new Map();                       // источник -> когда последний раз звучал
const СЛОВ = new Map();                        // источник -> сколько слов он уже дал
function автоколонки(ch){
  if (!ch || ch === 'typed' || ch === 'файл') return;
  ch = базовый(ch);                            // твой микрофон получает полосу наравне с остальными
  if (ОБЁРТКИ.test(ch)) return;                // служебный канал столбца не просит
  АКТИВ.set(ch, Date.now());
  /* Полоса заводится тому, кто реально говорит. Случайный звук на пару слов
     (щелчок в браузере, оповещение) своего столбца не получает. */
  if ((СЛОВ.get(ch) || 0) < 12 && !LAY.s.some(x => x.src && базовый(x.src) === ch)) return;
  for (const [c, t] of [...АКТИВ]) if (Date.now() - t > 90000) АКТИВ.delete(c);
  const живых = [...АКТИВ.keys()];
  // тот же процесс под новым именем полосы себе больше не просит
  if (LAY.s.some(x => x.src && базовый(x.src) === ch)) return;
  /* Пустых столбиков быть не должно. Главная полоса ждёт твой микрофон, но если
     он молчит, а источники говорят — первый из них занимает её, и лента не стоит
     наполовину пустой. Когда заговоришь сам, твоя речь эту полосу вернёт. */
  const главная = LAY.s[MAINI()];
  if (главная && !главная.src && !UTT.has('mic') && !LAY.s.some(x => x.src === ch)){
    главная.src = ch; главная.авто = true; saveLay(); relayout(); return;
  }
  if (живых.length >= 2 && !LAY.s.some(x => x.src === ch)
      && LAY.s.length < 3 && feed.clientWidth / (LAY.s.length + 1) >= 320){
    LAY.s.push({id: 'a' + Date.now().toString(36), src: ch, авто: true});
    /* Пустая главная полоса не занимает место: пока твой микрофон молчит, её
       место отдаём говорящим — иначе четверть ленты стоит серой. */
    const гл = LAY.s[MAINI()];
    if (гл && !гл.src && LAY.s.length > 1 && !UTT.has('mic')) LAY.s.splice(MAINI(), 1);
    const n = LAY.s.length; LAY.b = Array.from({length: n + 1}, (_, i) => i / n);
    saveLay(); relayout();
  }
  // столбик источника, который давно молчит, отдаём обратно ленте
  for (let i = LAY.s.length - 1; i >= 0; i--){
    const src = LAY.s[i].src;
    const пусто = !feed.querySelector('.lane[data-s="' + LAY.s[i].id + '"] .ln');
    if (src && LAY.s[i].id !== 'main' && (!АКТИВ.has(базовый(src)) || пусто) && !String(src).startsWith('mic·'))
      dropStream(i);                             // источник замолчал или вовсе ничего не сказал
  }
}
function dropStream(i){
  if (LAY.s[i].id === 'main' || LAY.s.length === 1) return;
  const src = LAY.s[i].src;
  if (src && src.startsWith('mic·')) fetch('/api/mic_close', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: src})}).catch(() => {});
  LAY.s.splice(i, 1); const n = LAY.s.length; LAY.b = Array.from({length: n + 1}, (_, k) => k / n);
  saveLay(); relayout();
}

function park(){

  const away = document.body.classList.contains('settings') || document.body.classList.contains('flow');

function bars(){

      + '<textarea rows="1" placeholder="' + (s.src ? (NAME[s.src] || s.src) : 'поток без источника') + '…" spellcheck="false"></textarea>'
      + '<span class="edge l"></span><span class="edge r"></span>';
    el.querySelector('.edge.l').addEventListener('click', e => { e.stopPropagation(); pickSrc(i); });
    el.querySelector('.edge.r').addEventListener('click', e => { e.stopPropagation(); dropStream(i); });
    const ta = el.querySelector('textarea');
    const gr = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 58) + 'px'; };
    ta.addEventListener('input', gr); ta.addEventListener('focus', () => el.classList.add('typing')); ta.addEventListener('blur', () => el.classList.remove('typing'));
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); const t = ta.value.trim(); if (!t) return; ta.value = ''; gr();
      fetch('/api/say', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: t, stream: s.id})}).catch(() => {}); } });
    el.querySelector('.ic').addEventListener('click', () => { pick.dataset.stream = s.id; pick.click(); });
    el.addEventListener('mousedown', () => { ACTIVE = s.id; const b = document.body; if (b.classList.contains('settings') || b.classList.contains('flow')){ b.classList.remove('settings', 'flow'); marks(); } });
    document.getElementById('stage').appendChild(el);

    /* бамп — отдельным слоём рядом с .say.extra, чтобы реально всплывать ИЗ-ЗА плашки,
       а не поверх неё (z-index ниже .say, выше ленты) — триггер по-прежнему через наведение на .edge */
    const tab = document.createElement('div'); tab.className = 'strm-tab'; tab.dataset.s = s.id;
    tab.style.left = left + 'px'; tab.style.width = w + 'px';
    tab.innerHTML = '<button class="bump l' + (s.src ? '' : ' none') + '" title="что слушает этот поток"><i></i><span></span></button><button class="bump r" title="убрать поток">✕ закрыть</button>';
    tab.querySelector('.bump.l span').textContent = s.src ? (NAME[s.src] || (s.src.startsWith('mic·') ? 'микрофон · ' + s.src.slice(4) : s.src)) : 'источник';
    if (s.src) tab.style.setProperty('--h', hue(s.src));
    const bl = tab.querySelector('.bump.l'), br = tab.querySelector('.bump.r'), edL = el.querySelector('.edge.l'), edR = el.querySelector('.edge.r');
    const timer = () => { let t = null; return { show: b => { clearTimeout(t); b.classList.add('show'); }, hide: b => { clearTimeout(t); t = setTimeout(() => b.classList.remove('show'), 160); } }; };
    const TL = timer(), TR = timer();
    edL.addEventListener('mouseenter', () => TL.show(bl)); edL.addEventListener('mouseleave', () => TL.hide(bl));
    bl.addEventListener('mouseenter', () => TL.show(bl)); bl.addEventListener('mouseleave', () => TL.hide(bl));
    edR.addEventListener('mouseenter', () => TR.show(br)); edR.addEventListener('mouseleave', () => TR.hide(br));
    br.addEventListener('mouseenter', () => TR.show(br)); br.addEventListener('mouseleave', () => TR.hide(br));
    bl.addEventListener('click', e => { e.stopPropagation(); pickSrc(i); });
    br.addEventListener('click', e => { e.stopPropagation(); dropStream(i); });
    document.getElementById('stage').appendChild(tab);
  });
}

  const take = c => { for (const st of LAY.s) if (st.src === c) st.src = null;   // источник только в одном потоке

      if (r.name){ LANESEEN.add(r.name); take(r.name); } } catch (err){}

}

/* строка метрик: en 92% · 3,2 с · 2,1 сл/с · слова 87% · whisper 120 · задержка 216 мс */
/* Две разные вещи, их нельзя путать.
   Строка, которая ПРЯМО СЕЙЧАС растёт, — живой замер: он течёт вместе с текстом.
   Строка, которая уже написана, — зафиксированная метка: скорость, длительность,
   кто говорил, чем распознано, за сколько догнало звук. Раньше живой счётчик
   писался в любую строку, куда падал кусок, и висел на давно готовых. */
function metrics(ev, r){
  const u = UTT.get(ev.ch);
  const растёт = !!(u && r && (u.row === r || ROWS.get(u.seg) === r));
  if (растёт) return liveRate(ev.ch, r);
  if (!ev.final) return 'черновик';
  /* Фраза закрыта паузой — у неё свои показания: как быстро сыпались слова,
     сколько длилась, кто говорил, чем распознано и за сколько догнало живой звук. */
  if (ev.utt_rate != null){
    const f1 = v => String(Math.round(v * 10) / 10).replace('.', ',');
    const p = [f1(ev.utt_rate) + ' сл/с'];
    if (ev.utt_dur) p.push(f1(ev.utt_dur) + ' с');
    const кто = NAME[ev.ch] || ev.ch; if (кто) p.push(кто);
    if (ev.eng) p.push(ev.eng);
    const отклик = ev.utt_lag != null ? ev.utt_lag : ev.lag_ms;
    if (отклик != null) p.push('<b>' + отклик + ' мс</b>');
    return p.join(' · ');
  }
  const p = [], f1 = v => String(Math.round(v * 10) / 10).replace('.', ',');
  const свой = ev.by !== 'клавиатура' && ev.by !== 'вложение';
  if (ev.lang && ev.lang !== 'ru') p.push(ev.lang + (ev.lang_p ? ' ' + Math.round(ev.lang_p * 100) + '%' : ''));
  const nw = (ev.text || '').trim().split(/\s+/).filter(Boolean).length;
  if (ev.dur && nw > 1) p.push(f1(nw / ev.dur) + ' сл/с');
  if (ev.dur) p.push(f1(ev.dur) + ' с');
  const кто = NAME[ev.ch] || ev.ch; if (кто && свой) p.push(кто);
  if (ev.eng && свой) p.push(ev.eng);
  if (ev.lag_ms != null && свой) p.push('<b>' + ev.lag_ms + ' мс</b>');
  return p.join(' · ');
}
/* Текст с абзацами рисуем абзацами: пустая строка между ними — граница красной
   строки, а строка «Глава пятая» — заголовок, его диктор объявил голосом. */
/* Слова выходят по одному. Карта отдаёт черновик пачками — пока она думает,
   человек успевает сказать пять-шесть слов, и текст прыгал рывками. Здесь пачка
   становится целью, а на экран слова добавляются по одному: речь видно потоком.
   Если карта отстала сильно, догоняем быстрее, чтобы очередь не копилась. */
/* ПЕЧАТЬ: слова выходят по одному. Один общий кадровый цикл на всю ленту —
   таймер на каждую строку при трёх потоках сразу вешал вкладку намертво.
   Счёт показанного живёт на строке и переживает перерисовку; хвост постоянно
   уточняется («котён» → «котёнок»), поэтому при укорочении не гасим в ноль. */
const ПЕЧАТЬ = new Map();
/* Один таймер на всю ленту. Кадры анимации тут не годятся: в неактивной вкладке
   браузер их замораживает, и проявление вставало на нуле, пока смотришь в другое
   окно, — а слух должен писать всегда, хоть ты и отвернулся. */
setInterval(() => {
  for (const [row, c] of [...ПЕЧАТЬ]){
    if (!c.sp || !c.sp.isConnected){ ПЕЧАТЬ.delete(row); continue; }
    const отстаём = c.слова.length - c.пок;
    if (отстаём <= 0) continue;
    c.пок += отстаём > 14 ? 3 : 1;
    c.sp.textContent = c.слова.slice(0, c.пок).join(' ');
  }
}, 45);
function печатать(row, sp, цель){
  const st = ПЕЧАТЬ.get(row) || {пок: 0};
  st.слова = String(цель || '').split(/\s+/).filter(Boolean);
  st.sp = sp;
  if (st.пок > st.слова.length) st.пок = st.слова.length;
  ПЕЧАТЬ.set(row, st);
  sp.textContent = st.слова.slice(0, st.пок).join(' ');
}
function ставитьТекст(x, t, серый){
  const части = String(t || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  if (части.length < 2){
    const sp = document.createElement('span'); if (серый) sp.className = 'g';
    sp.textContent = t || ''; x.appendChild(sp); return;
  }
  const box = document.createElement('span'); if (серый) box.className = 'g';
  for (const p of части){
    const el = document.createElement('p');
    if (/^глав[аы]\s/i.test(p) && p.length < 44) el.className = 'ch';
    el.textContent = p; box.appendChild(el);
  }
  x.appendChild(box);
}
/* Живой замер принадлежит той строке канала, куда прямо сейчас идёт речь.
   У КАЖДОГО источника свой замер и своя открытая строка — потоки не мешают друг
   другу: пока друг говорит в Discord, ролик пишется своей строкой параллельно. */
function отметить(r, ev){
  if (!ev.ch || ev.by === 'клавиатура' || ev.by === 'вложение' || ev.file) return;
  if (ev.final && ev.ch){                        // считаем, сколько источник наговорил
    const b = базовый(ev.ch);
    СЛОВ.set(b, (СЛОВ.get(b) || 0) + String(ev.text || '').trim().split(/\s+/).filter(Boolean).length);
  }
  автоколонки(ev.ch);                            // полоса нужна сразу, а не через кусок
  const u0 = UTT.get(ev.ch);
  if (u0 && u0.row && u0.row !== r) застыть(u0.row, u0);
  if (!u0 || (u0.row && u0.row !== r))
    UTT.set(ev.ch, {t0: (ev.t0 ? ev.t0 * 1000 : Date.now()), seg: ev.seg, row: r, ch: ev.ch,
                    eng: ev.eng, lag: ev.lag_ms, at: Date.now(), last: ev});
  else { u0.row = r; u0.seg = ev.seg; u0.at = Date.now(); u0.last = ev; u0.ch = ev.ch;
         if (ev.eng) u0.eng = ev.eng;
         if (ev.lag_ms != null) u0.lag = ev.lag_ms; }
}
function paint(r, ev){
  const x = r.querySelector('.x'), had = !!x.dataset.final;
  /* Быстрый путь: обычная речь без файлов и абзацев перерисовывается не пересбором
     узлов, а подменой текста в тех же двух кусочках — твёрдом и черновом. При трёх
     потоках сразу пересборка съедала кадр и вкладка вставала колом. */

/* ═══ БЛОК 4б: настройки интерфейса — применяются сразу, помнятся в браузере ═══ */
const DEF = {fs: 17, pad: 2, time: true, src: true, ghost: true, lag: true, light: false, glow: '#5fbf7a', glowk: 100, glowl: 60, hue: 140, rb: 279, font: '', fontId: '', fontW: []};
let PREF = Object.assign({}, DEF);
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a.toFixed(2) + ')';
}
function hsl2hex(h, l, sat){
  const s = (sat === undefined ? 70 : sat) / 100, L = l / 100, a = s * Math.min(L, 1 - L);
  const f = n => { const k = (n + h / 30) % 12, c = L - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
try { Object.assign(PREF, JSON.parse(localStorage.getItem('hear.prefs') || '{}')); } catch (e) {}
function applyPrefs(){
  const r = document.documentElement.style;
  r.setProperty('--rb', PREF.rb + 'px');
  r.setProperty('--fs', PREF.fs + 'px'); r.setProperty('--pad', PREF.pad + 'px'); r.setProperty('--ui', (PREF.fs / 17).toFixed(3));
  useFont(PREF.font, PREF.fontId, PREF.fontW);
  document.body.classList.toggle('no-time', !PREF.time); document.body.classList.toggle('no-src', !PREF.src);
  document.body.classList.toggle('no-ghost', !PREF.ghost); document.body.classList.toggle('no-lag', !PREF.lag);
  document.body.classList.toggle('light', !!PREF.light);
  /* ЦВЕТ И СВЕЧЕНИЕ: яркость поднимает и цвет, и ореол вокруг него */
  const L = PREF.glowl / 100, K = PREF.glowk / 100;
  const base = hsl2hex(PREF.hue, 54, 62 + PREF.glowl * 0.38);  // цвет: ярче = насыщеннее, светлота держится
  const core = hsl2hex(PREF.hue, 62, 74 + PREF.glowl * 0.26);  // ядро линии — тот же цвет, плотнее
  PREF.glow = base;
  r.setProperty('--glow', base); r.setProperty('--glow-core', core);
  document.body.classList.toggle('noglow', K * L === 0);        // на нуле подсветки нет вовсе
  const P = Math.pow(L, 1.6);                                   // ярче — вспышка растёт быстрее
  const Pw = Math.pow(L * Math.min(1, K), 2.2);                 // белое ядро только на сильной вспышке
  r.setProperty('--glow-hot', hsl2hex(PREF.hue, 84 + 16 * Pw, 100 - 95 * Pw));
  r.setProperty('--glow-shadow',
      '0 0 ' + (2 + 4 * K).toFixed(1) + 'px ' + rgba(core, Math.min(1, 1.1 * L)) + ', ' +
      '0 0 ' + (6 + 16 * K * P).toFixed(1) + 'px ' + rgba(core, .9 * L) + ', ' +
      '0 0 ' + (14 + 44 * K * P).toFixed(1) + 'px ' + rgba(base, .7 * L) + ', ' +
      '0 0 ' + (30 + 90 * K * P).toFixed(1) + 'px ' + rgba(base, .45 * L) + ', ' +
      '0 0 ' + (60 + 170 * K * P).toFixed(1) + 'px ' + rgba(base, .22 * L));
  r.setProperty('--ray', Math.round(40 + 150 * K * P) + 'px');
  r.setProperty('--ray-o', (.35 + .6 * P).toFixed(2));
  try { const h = document.getElementById('hue'); if (h && +h.value !== PREF.hue) h.value = PREF.hue;
    for (const b of document.querySelectorAll('#prefs .sw6 b')) b.classList.toggle('on', +b.dataset.h === PREF.hue); } catch (e) {} r.setProperty('--glow-k', (PREF.glowk / 100).toFixed(2));
  const dot = document.getElementById('wdot');
  if (dot){ const a = (PREF.hue - 90) * Math.PI / 180, R = 8.5;
    dot.style.left = (11 + R * Math.cos(a)) + 'px'; dot.style.top = (11 + R * Math.sin(a)) + 'px'; }
  for (const el of document.querySelectorAll('#prefs [data-k]')){ const k = el.dataset.k; if (el.type === 'checkbox') el.checked = !!PREF[k]; else el.value = PREF[k]; }
}

/* ═══ БЛОК 4в: шрифт интерфейса ═══
   Сервер сам находит папки шрифтов Windows и отбирает те, где есть кириллица.
   Файл шрифта отдаётся вкладке по ссылке — ставить его в систему не нужно.

function face(fam, id, ws){
  if (!fam || !id) return;
  const key = 'ff-' + id;
  if (document.getElementById(key)) return;
  const st = document.createElement('style'); st.id = key;
  st.textContent = (ws && ws.length ? ws : ['400']).map(w =>
    '@font-face{font-family:"' + fam + '";src:url("/api/font/' + id + '/' + w + '");font-weight:' + w + ';font-display:swap}').join('');
  document.head.appendChild(st);
}
function useFont(fam, id, ws){
  const base = '"Gilroy","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif';
  if (!fam){ document.documentElement.style.removeProperty('--font'); }
  else { face(fam, id, ws); document.documentElement.style.setProperty('--font', '"' + fam + '",' + base); }
  const btn = document.getElementById('fontbtn'); if (btn) btn.textContent = fam || 'Gilroy';
}
const fontsBox = document.getElementById('fonts'), fontList = document.getElementById('fontlist');
let FONTS = null;
document.getElementById('fontbtn').addEventListener('click', async e => {
  e.stopPropagation();

async function pullFonts(){
  let d; try { d = await (await fetch('/api/fonts')).json(); } catch (err){ return; }
  FONTS = d.fonts || [];
  document.getElementById('fontwhere').textContent = 'найдено ' + FONTS.length + ' с кириллицей: ' + (d.dirs || []).join('  •  ');
  fontList.innerHTML = '';
  const rich = FONTS.filter(f => f.n >= 3), rest = FONTS.filter(f => f.n < 3);
  const put = (title, arr) => {
    if (!arr.length) return;
    const h = document.createElement('div'); h.className = 'sep'; h.textContent = title; fontList.appendChild(h);
    for (const f of arr){
      const b = document.createElement('b'); b.dataset.id = f.id; b.textContent = f.fam;
      const i = document.createElement('i'); i.textContent = f.n + ' нач.'; b.appendChild(i);
      b.classList.toggle('on', PREF.fontId === f.id);
      b.addEventListener('click', () => {
        PREF.font = f.fam; PREF.fontId = f.id; PREF.fontW = f.w;
        try { localStorage.setItem('hear.prefs', JSON.stringify(PREF)); } catch (err){}
        useFont(f.fam, f.id, f.w);
        for (const o of fontList.querySelectorAll('b')) o.classList.toggle('on', o.dataset.id === f.id);
      });
      fontList.appendChild(b);
    }
  };
  put('полные гарнитуры', rich);
  put('остальные', rest);
  show();                                   // образцы подключаем по мере показа
}
/* каждый пункт написан своим шрифтом — но подключаем только видимые */
function show(){
  const io = new IntersectionObserver(es => {
    for (const e of es){
      if (!e.isIntersecting) continue;
      const f = FONTS.find(x => x.id === e.target.dataset.id);
      if (f){ face(f.fam, f.id, [f.w.includes('400') ? '400' : f.w[0]]); e.target.style.fontFamily = '"' + f.fam + '",var(--font)'; }
      io.unobserve(e.target);
    }
  }, {root: fontList, rootMargin: '80px'});
  for (const b of fontList.querySelectorAll('b')) io.observe(b);
}
