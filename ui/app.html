<!doctype html>
<html lang="ru" data-skin="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANAMORF</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   ANAMORF · оболочка v2 (04.09.2026)

   ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ПРАВКА index.html.
   В index.html живут ТРИ оболочки разом (Nocturne, Graphite, режим ядра),
   и новая не заменила старую, а перетаскивает её узлы к себе. Отсюда
   двухфазное открытие панели, перезагрузка встроенных страниц при каждом
   переносе и 30 таймеров опроса. Лечить это правками нельзя — только
   чистой компоновкой. Старый файл остаётся нетронутым: откат = адрес «/».

   ТРИ ПРАВИЛА, КОТОРЫМ ЗДЕСЬ ПОДЧИНЕНО ВСЁ.
   1. Клик открывает раздел МГНОВЕННО. Разметка всех разделов построена
      один раз при загрузке; открытие — смена класса, а не сборка DOM и не
      сетевой запрос. Данные приезжают потом и дописываются на месте.
   2. Один опросчик на всю страницу (`beat`), а не таймер у каждой панели.
      Он тикает раз в секунду и раздаёт результат подписчикам. Закрытые
      разделы не просят ничего.
   3. Состояние подсистемы — первой строкой в разделе, до всех настроек.
      off / поднимаю / готова / сломано — четыре состояния, не два.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#0c0c0e; --bg-2:#111114;
  --panel:rgba(255,255,255,.052); --panel-2:rgba(255,255,255,.078);
  --panel-3:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.14);
  --text:#eceef1; --dim:rgba(236,238,241,.52); --dim-2:rgba(236,238,241,.30);
  --bad:#e0a9a3; --hot:#d8564a;
  --r:12px; --r-lg:18px;
  --ease:cubic-bezier(.2,.85,.25,1);
  --dock-h:132px; --top-h:46px;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font:15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--text);outline-offset:2px;border-radius:6px}
.mono{font-family:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ─── шапка ───────────────────────────────────────────────────────────── */
#top{
  position:fixed;top:0;left:0;right:0;height:var(--top-h);z-index:40;
  display:flex;align-items:center;gap:18px;padding:0 16px;
  border-bottom:0;background:none;pointer-events:none;
  opacity:0;transition:opacity .22s var(--ease);
}
#top > *{pointer-events:none}
/* НА ГЛАВНОМ ЭКРАНЕ СВЕРХУ ПУСТО (04.09.2026, владелец: «ты видишь какие-то
   надписи сверху? давай убирай»). На его макете там ничего нет, и он прав:
   шесть панелей — это и есть экран, любая строка поверх них лишняя.
   Но выбрасывать нагрузку, доску и обновление некуда, поэтому шапка не
   удалена, а спрятана: подвёл мышь к верхней кромке — появилась.
   pointer-events включаем только когда она видна, иначе невидимая полоса
   съедала бы клики по верхним клиньям. */
body.peek #top, body.on-page #top{opacity:1}
body.peek #top > *, body.on-page #top > *{pointer-events:auto}
body.on-page #top{background:rgba(12,12,14,.72);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
#brand{font-weight:600;letter-spacing:.24em;font-size:12px;text-transform:uppercase;
  color:var(--dim);padding:6px 2px;transition:color .16s var(--ease)}
#brand:hover,#brand.live{color:var(--text)}
#crumb{font-size:12px;color:var(--dim-2);letter-spacing:.06em}
#top .gap{flex:1}
.meters{display:flex;gap:14px;align-items:center}
.meter{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.meter .cap{letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--dim-2)}
.meter .val{color:var(--text);font-size:12px}
.bar{width:54px;height:3px;border-radius:2px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--text);
  transition:width .5s var(--ease),background .3s linear}
.bar.hot i{background:var(--hot)}
#tbtn,#rbtn{font-size:11.5px;color:var(--dim);padding:4px 8px;border-radius:7px}
#tbtn:hover,#rbtn:hover{background:var(--panel-2);color:var(--text)}
@media (max-width:820px){.meter.opt,#crumb{display:none}}

/* ─── сцена: как в Graphite — веер секторов до краёв, шар, кольцо ──── */
/* СЦЕНА — ВЕСЬ ЭКРАН, БЕЗ ПОЛЕЙ (04.09.2026, владелец ткнул красным:
   «какие-то ебучие отступы снизу и сверху»). Я обрезал её на высоту
   шапки и бара — сверху и снизу оставались чёрные полосы, и шесть
   панелей переставали быть экраном. На макете они идут от края до края,
   а шапка и бар ЛЕЖАТ ПОВЕРХ них. Поэтому inset:0, а у шапки и бара —
   прозрачный фон. Шар от этого встаёт в настоящий центр экрана. */
#stage{position:fixed;inset:0;z-index:10;overflow:hidden;
  transition:opacity .17s var(--ease),transform .17s var(--ease);
  perspective:1400px;perspective-origin:50% 46%}
body.on-page #stage{opacity:0;transform:scale(.975);pointer-events:none}
#zsvg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
/* КЛИН — ЭТО ПОВЕРХНОСТЬ, А НЕ ПУСТОТА (04.09.2026). Первый заход рисовал
   шесть невидимых зон на общем чёрном фоне: топология была верная, а на
   экране не было ничего, кроме линий. У владельца на макете каждый клин —
   отдельная плоскость со своим тоном, и швы между ними читаются сами.
   Тон задаём градиентом от центра к краю (свет от шара) плюс лёгкий
   постоянный сдвиг у каждого клина, чтобы соседи различались. */
#zsvg .z{cursor:pointer;fill:rgba(255,255,255,.001);transition:fill .28s var(--ease)}
#zsvg .z:hover{fill:rgba(255,255,255,.028)}
#zsvg .zf{pointer-events:none}
#zsvg .cut{stroke:rgba(255,255,255,.055);stroke-width:1;fill:none;pointer-events:none}
/* Разделители сдвоенные: тусклая подложка на всю длину + наливающаяся
   полоска сверху. Цвет — единственное место, где монохром Graphite
   отступает: состояние подсистемы должно читаться, не наводя курсор. */
#zsvg .ln-bg{stroke:rgba(255,255,255,.045);stroke-width:1;pointer-events:none}
#zsvg .ln{stroke-width:1.25;pointer-events:none;stroke-linecap:round;
  transition:stroke .5s var(--ease)}
#zsvg .ln.ok{stroke:rgba(150,206,116,.52)}
#zsvg .ln.busy{stroke:rgba(216,166,74,.62)}
#zsvg .ln.bad{stroke:rgba(224,116,108,.90)}
#zsvg .ln.idle{stroke:rgba(255,255,255,.16)}
#zsvg .ray{stroke:var(--hot);stroke-width:1.6;fill:none;pointer-events:none;opacity:.95}
.zlab{position:absolute;z-index:2;pointer-events:none;white-space:nowrap}
/* Подписи секторов у владельца набраны Arial Black — он есть в Windows,
   тянуть файл незачем; на других системах откатываемся на самый жирный
   доступный гротеск. */
.zlab .zn{display:block;font-family:'Arial Black','Arial Bold',var(--sans);
  font-weight:900;font-size:clamp(15px,3.4vh,26px);line-height:1;letter-spacing:.005em;
  color:rgba(236,238,241,.88);text-shadow:0 2px 10px rgba(0,0,0,.8)}
.zlab .zs{display:block;margin-top:6px;font-weight:400;font-size:11.5px;line-height:1;
  letter-spacing:.02em;color:rgba(236,238,241,.34)}
.zlab.hot .zn{color:#fff}.zlab.hot .zs{color:rgba(236,238,241,.58)}
#orb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(70vh,640px);aspect-ratio:1;z-index:3;transform-style:preserve-3d}
#zring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#zcore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;aspect-ratio:1;
  border-radius:50%;display:grid;place-items:center;text-align:center;cursor:pointer;z-index:5;
  user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.97),rgba(224,227,233,.86) 62%,rgba(202,206,214,.72));
  box-shadow:0 14px 34px -26px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,1),inset 0 -12px 24px -12px rgba(20,24,32,.22);
  transition:transform .45s cubic-bezier(.34,1.4,.5,1),box-shadow .35s var(--ease),filter .3s var(--ease)}
#zcore:hover{transform:translate(-50%,-50%) scale(1.02)}
body.holding #zcore{transform:translate(-50%,-50%) scale(.90);
  box-shadow:0 0 0 3px rgba(216,86,74,.55),0 10px 22px -12px rgba(0,0,0,.95),inset 0 2px 3px rgba(255,255,255,.8);
  transition:transform .9s linear,box-shadow .9s linear}
body.mic-off #zcore{filter:brightness(.42) saturate(.7) contrast(.95)}
/* ТОТ ЖЕ ШРИФТ, ЧТО В МАКЕТЕ. Взят из его же сцены в Blender: текстовый
   объект ANAMORF набран Aquire Regular. Отличается барless «A» — вместо
   перекладины чистый треугольник, — и именно по ней логотип узнаётся.
   Системным гротеском это не подменить. Файл лежит в ui/fonts и
   отдаётся сервером, чтобы сборка и телефон видели то же самое. */
@font-face{font-family:'Aquire';src:url('/fonts/Aquire.otf') format('opentype');
  font-weight:400;font-display:swap}
#zname{font-family:'Aquire',var(--sans);
  font-weight:400;font-size:var(--core-fs,15px);line-height:1;letter-spacing:.16em;text-indent:.16em;
  white-space:nowrap;color:transparent;
  background-image:linear-gradient(180deg,#03040a 0%,#191c24 58%,#343842 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 -1px 1px rgba(18,21,28,.55))}
/* НА ШАРЕ ТОЛЬКО ИМЯ (04.09.2026, владелец: «я просил когда-нибудь надпись
   микрофон включён?»). Не просил. Состояние микрофона несёт сам шар —
   белый включён, тёмный заглушен, — и подпись рядом с ним была вторым
   способом сказать то же самое. Узел оставлен: в него по-прежнему пишут
   короткие сообщения (выгружаю, слушаю), но на экране он не появляется. */
#zsub{display:none}
#holdnote{position:fixed;left:50%;bottom:calc(var(--dock-h) + 26px);transform:translateX(-50%);
  z-index:41;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--hot);
  opacity:0;transition:opacity .2s linear;pointer-events:none}
body.holding #holdnote{opacity:1}

/* ─── раздел ──────────────────────────────────────────────────────────── */
#page{position:fixed;inset:var(--top-h) 0 var(--dock-h) 0;z-index:20;background:var(--bg);
  display:grid;grid-template-columns:210px minmax(0,1fr);
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .17s var(--ease),transform .17s var(--ease)}
body.on-page #page{opacity:1;pointer-events:auto;transform:none}
#toc{border-right:1px solid var(--line);padding:26px 0 26px 20px;overflow:auto;
  display:flex;flex-direction:column;gap:2px}
#toc .back{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
  padding:6px 0;margin-bottom:16px;letter-spacing:.06em}
#toc .back:hover{color:var(--text)}
#toc a{display:block;padding:7px 12px 7px 12px;color:var(--dim-2);text-decoration:none;
  font-size:13.5px;border-left:1.5px solid transparent;
  transition:color .15s var(--ease),border-color .15s var(--ease)}
#toc a:hover{color:var(--dim)}
#toc a{position:relative;cursor:grab;white-space:nowrap}
#toc a.drag{opacity:.35}
#toc a.over-top::before,#toc a.over-bot::after{content:'';position:absolute;left:8px;right:8px;height:2px;background:var(--text);border-radius:1px}
#toc a.over-top::before{top:-1px}
#toc a.over-bot::after{bottom:-1px}
#toc a.cur{color:var(--text);border-left-color:var(--text)}
/* ПОЛОСА ПРОКРУТКИ СПРАВА УБРАНА (05.09). Владелец: «скрол ебанину
   убери справа, жутко раздражает». Прокрутка остаётся — исчезает только
   её видимая полоска: на тёмной сцене она резала правый край светлой
   чертой. Колесом, клавишами и через оглавление слева всё работает. */
/* ═══ ПОЛОСА «ОБНОВЛЯЮСЬ» (06.09) ════════════════════════════════════
   Владелец: «не нужно ждать меня, просто выводи уведомление наверху, что
   обновляется; правки делаем на лету».
   Перезапуск сервера занимает около минуты, и всё это время слух молчит.
   Раньше это выглядело как зависание — человек смотрит на ленту и не
   понимает, сломалось или чинится. Полоса отвечает на этот вопрос
   мгновенно и сама гаснет, когда связь вернулась. */
#upd{position:fixed;left:0;right:0;top:0;z-index:900;display:none;
  padding:6px 14px;font-size:12px;letter-spacing:.06em;text-align:center;
  background:linear-gradient(90deg,#3a2030,#2a1c34);color:#ffb0c8;
  border-bottom:1px solid rgba(255,140,180,.35)}
#upd.on{display:block;animation:updpulse 1.6s ease-in-out infinite}
#upd.ok{display:block;background:#16281c;color:#9fe0b0;
  border-bottom-color:rgba(120,220,150,.3);animation:none}
@keyframes updpulse{0%,100%{opacity:.75}50%{opacity:1}}
#doc{overflow:auto;scrollbar-width:none;-ms-overflow-style:none}
#doc::-webkit-scrollbar{width:0;height:0}
.sheet{min-height:var(--sh,100%);padding:34px 42px 60px;border-bottom:1px solid var(--line)}
.organ > .sheet:last-child{border-bottom:0}
.sheet > h1{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim-2);
  margin:0 0 6px;font-weight:600}
.sheet > h2{font-size:26px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
.sheet > .lede{color:var(--dim);margin:0 0 22px;max-width:64ch}
/* СТРАНИЦА СЛУХА ТЕПЕРЬ ДВУХЭТАЖНАЯ (05.09): первый экран — объёмный
   атлас, ниже — разговор колонками. Значит лист обязан прокручиваться
   сам; раньше вся прокрутка была внутри ленты, и второй этаж просто
   некуда было опустить. */
.sheet.fill{display:flex;flex-direction:column;height:var(--sh,100%);
  max-height:var(--sh,100%);overflow:hidden}

/* ─── цепочка уровней слуха ─────────────────────────────────────────── */
.chain{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.lvl{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);position:relative}
.lvl:last-child{border-bottom:0}
.lvl .ln{width:16px;font-size:11px;color:var(--dim-2);font-variant-numeric:tabular-nums}
.lvl .dot{width:7px;height:7px;border-radius:50%;background:var(--text);
  box-shadow:0 0 10px rgba(236,238,241,.45);flex:0 0 auto;transition:.25s var(--ease)}
.lvl.off .dot{background:var(--dim-2);box-shadow:none}
.lvl.off{opacity:.5}
.lvl .lname{min-width:118px;font-size:13.5px}
.lvl .lhead{min-width:104px;font-size:12.5px;color:var(--dim)}
.lvl .lnote{flex:1;min-width:0;font-size:12.5px;color:var(--dim-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* тонкая линия связи между уровнями — слух это цепь, а не список */
.lvl:not(:last-child)::after{content:'';position:absolute;left:24px;bottom:-4px;
  width:1px;height:8px;background:var(--line)}

/* ─── ответ инструмента в ленте ──────────────────────────────────────── */
.act.res{border-left:2px solid var(--line);padding-left:10px;opacity:.88}
.act.res b{color:var(--text)}
.act.res.bad{border-left-color:var(--hot)}
.act.res.bad b{color:var(--hot)}
.act.res .ms{color:var(--dim-2);font-size:11px}
/* действия хода — одна свёрнутая строка, как у Claude (2026-10-09) */
details.acts{align-self:flex-start;font-size:12px;color:var(--dim);max-width:100%}
details.acts>summary{cursor:pointer;list-style:none;padding:2px 0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;opacity:.8}
details.acts>summary::-webkit-details-marker{display:none}
details.acts>summary:hover{opacity:1;color:var(--text)}
details.acts .acts-body{border-left:2px solid var(--line-2);margin:4px 0 2px 4px;padding-left:10px;
  display:flex;flex-direction:column;gap:6px}
details.acts .acts-it b{color:var(--text);font-weight:600}
details.acts .acts-it.bad b{color:var(--hot)}
details.acts .acts-res{opacity:.85;white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto}
details.acts .acts-res .ms{color:var(--dim-2);font-size:11px}
.act.learn{opacity:.95;border-left:2px dashed var(--line);padding-left:10px}

.state{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 0 22px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel)}
.state .dot{width:8px;height:8px;border-radius:50%;background:var(--text);flex:none}
.state.s-loading .dot{animation:pulse 1.15s ease-in-out infinite}
.state.s-broken .dot{background:var(--bad)}
.state.s-off .dot{background:var(--text);opacity:.18}
.state .word{font-weight:600}
.state .who{color:var(--dim);font-size:13.5px}
.state .why{color:var(--dim-2);font-size:13px;margin-left:auto;text-align:right;max-width:46ch}

/* строительные блоки */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.cols.two{grid-template-columns:1fr 1fr}
@media (max-width:900px){.cols.two{grid-template-columns:1fr}}
/* Карточка — контейнер: строки внутри узкой карточки складываются в
   столбик сами, не глядя на ширину окна. Без этого длинный select в
   двухколоночной раскладке схлопывал подпись в столбик по букве. */
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
  padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;
  container-type:inline-size}
@container (max-width:560px){
  .row{grid-template-columns:1fr}
  .row .c{grid-column:1;grid-row:auto;margin-top:6px;justify-content:flex-start}
  .sl{min-width:0;width:100%}
  select.in,input.in{max-width:100%}
}
.card > h3{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.card > h3 .n{color:var(--dim-2);font-weight:400;font-size:12.5px;margin-left:auto}
.card p{margin:0;color:var(--dim);font-size:13.5px}
.soon{color:var(--dim-2);font-size:13px;border:1px dashed var(--line);border-radius:var(--r);
  padding:14px 16px}
/* Подпись НИКОГДА не схлопывается: у левой колонки есть настоящий
   минимум, а колонка с ручкой умеет ужиматься ниже своей «удобной»
   ширины. С `auto` справа грид отдавал ей всю max-content ширину, и
   подпись рассыпалась в столбик по букве (поймано вживую 04.09). */
.row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,max-content);
  gap:4px 18px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-size:14px}
.row .d{grid-column:1;color:var(--dim-2);font-size:12.5px;line-height:1.4}
.row .c{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:8px;min-width:0;justify-content:flex-end;flex-wrap:wrap}
.row.wide{grid-template-columns:1fr}
.row.wide .c{grid-column:1;grid-row:auto;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.tag.on{color:var(--text);border-color:var(--line-2)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.b{font-size:13px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);transition:background .15s var(--ease),border-color .15s var(--ease);
  white-space:nowrap}
.b:hover{background:var(--panel-2);border-color:var(--line-2)}
.b.pri{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.b.pri:hover{background:#fff}
.b.hot{color:var(--bad);border-color:rgba(224,169,163,.4)}
.b.hot:hover{border-color:var(--bad)}
.b.sm{font-size:12px;padding:4px 9px}
.tg{width:38px;height:22px;border-radius:11px;background:var(--panel-3);position:relative;
  transition:background .18s var(--ease);flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--dim);transition:transform .18s var(--ease),background .18s var(--ease)}
.tg[aria-checked="true"]{background:var(--text)}
.tg[aria-checked="true"]::after{transform:translateX(16px);background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font-size:12.5px;padding:5px 11px;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);font-weight:600}
.sl{display:flex;align-items:center;gap:10px;min-width:220px}
.sl input[type=range]{flex:1;accent-color:var(--text);height:2px}
.sl .v{min-width:4ch;text-align:right;font-size:12.5px;color:var(--dim)}
/* Длинное имя устройства не должно расталкивать строку: у select нет
   переноса, поэтому ограничиваем ширину — иначе колонка с подписью
   схлопывается в столбик по букве (поймано вживую 04.09). */
select.in,input.in{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;
  padding:6px 10px;font-size:13.5px;color:var(--text);max-width:min(320px,42vw);min-width:0}
select.in:focus,input.in:focus{border-color:var(--line-2);outline:none}
input.in::placeholder{color:var(--dim-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel)}
.kv b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kv span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-2)}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--panel);transition:border-color .15s var(--ease)}
.it:hover{border-color:var(--line-2)}
.it.cur{border-color:var(--text);background:var(--panel-2)}
.it .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sub{color:var(--dim-2);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sp{flex:1}
/* ═══ РОВНЫЕ СТОЛБИКИ В СПИСКЕ МОДЕЛЕЙ (06.09) ═══════════════════════
   Владелец: «давай всё выровнять и сделать небольшую кнопку, чтобы не
   ломать аккуратные столбики». Он прав: у активной строки появлялась
   лишняя кнопка, ряд распирало, и выравнивание рассыпалось именно там,
   куда смотришь.
   Лечим слотами: у КАЖДОЙ строки одни и те же места под метку и под
   действие, занятые они или пустые. Тогда ничего не съезжает, что бы в
   строке ни появилось. */
.it .slot-act{flex:0 0 190px;display:flex;justify-content:flex-end;gap:6px}
/* ═══ КНОПКИ ОДНОГО НАЗНАЧЕНИЯ — ОДНОГО РАЗМЕРА (06.09) ══════════════
   Владелец: «сделай кнопки одинаковыми по размеру» и, отдельно, как
   правило: в одном месте интерфейса не должно быть вещей, разных по
   эстетике. «выбрать» и «выгрузить» — разной длины слова, и кнопки
   выходили разной ширины, ломая ровный столбец.
   Ширину задаёт кнопка, а не текст: фиксированная, по самому длинному
   слову. Тогда столбец ровный при любой надписи. */
.it .slot-act .btn{white-space:nowrap;min-width:92px;max-width:92px;overflow:hidden;text-overflow:ellipsis;justify-content:center;
  display:inline-flex;align-items:center}
.it .led{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:.15;flex:none}
.it .led.ok{opacity:1}.it .led.busy{opacity:1;animation:pulse 1.15s ease-in-out infinite}
.it .led.bad{background:var(--bad);opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:14px;
  display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-width:0;
  transition:border-color .15s var(--ease),background .15s var(--ease)}
.tile:hover{border-color:var(--line-2);background:var(--panel-2)}
.tile.cur{border-color:var(--text)}
.tile .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .sub{color:var(--dim-2);font-size:12px}
.tile .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tile .thumb{aspect-ratio:4/3;border-radius:10px;background:var(--bg-2);display:grid;
  place-items:center;color:var(--dim-2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  overflow:hidden}
.tile .thumb img{width:100%;height:100%;object-fit:cover}
.stars{display:inline-flex;gap:2px}
.stars i{width:6px;height:12px;border-radius:2px;background:var(--panel-3);cursor:pointer}
.stars i.on{background:var(--text)}
.note{font-size:12.5px;color:var(--dim-2)}
.hint{font-size:12.5px;color:var(--dim);border-left:2px solid var(--line-2);padding:4px 12px;margin:4px 0}
canvas.viz{width:100%;height:160px;display:block;border-radius:var(--r);background:var(--bg-2);
  border:1px solid var(--line)}

/* чат в разделе «Слух» */
/* У ЧАТА СВОЙ СКРОЛЛ. Иначе каждая новая услышанная фраза дёргала скролл
   всего раздела к низу ленты — прочитать «Движки» под ней было нельзя. */
/* ЧАТ — ОКНО, А НЕ ПОЛОТНО (05.09). Владелец: «не должно быть такого,
   что страница из-за чата просто в полотно превращается». Лента росла
   вниз без предела, и вся страница вместе с ней: топология уезжала за
   край экрана после первой же минуты слуха. Теперь лента — окно со
   своей прокруткой, а страница стоит на месте. */
/* ═══ ЛЕНТА С ОТСТУПАМИ ВМЕСТО СТОЛБЦОВ (06.09) ══════════════════════
   Владелец: «ебаные столбики убери бессмысленные», «облачка просто
   проявляй на разной глубине от левого края от разных людей».

   Столбцы стоили дорого и отдавали мало: четыре колонки делят экран на
   четыре узких полосы, и в каждой висит по две реплики, а под ними
   пустота в полтора экрана — ровно то, что он и увидел. Порядок речи в
   них теряется совсем: кто кому ответил, из соседних колонок не читается.

   Отступ решает ту же задачу дешевле. Речь идёт одной лентой, время
   сверху вниз, а человек различается тем, НА КАКОЙ ГЛУБИНЕ от левого
   края всплыло облачко. Различие видно боковым зрением, как у столбцов,
   а ширина строки и порядок реплик сохраняются. Глубина закрепляется за
   голосом при первой реплике и больше не меняется. */
#chat{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;
  padding:2px 2px 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
/* ═══ ЗВУКИ — УВЕДОМЛЕНИЕ, А НЕ СТРОКИ В ЛЕНТЕ (06.09.2026) ═══════════
   Владелец: «захламляет мне строки… звуки из системы — это метки, которые
   приходят в определённый момент, а не постоянный поток; и что даёт микро,
   не должно захламлять экран: это просто метки, которые уведомляют, что
   она услышала или слышит, не более». Одна полоска над лентой, ОДНО
   место: миг (крик, смех, пик) — вспыхнул и погас через 4 с; фон
   (музыка, клавиатура) — висит, пока звучит, с секундами. Пусто — нет
   полоски. В ленту ничего не пишем. */
#snd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-height:0;padding:2px 2px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2)}
#snd:empty{display:none}
#song{--pulse:0;display:flex;flex-direction:column;align-items:center;gap:0;margin:6px auto 12px;padding:5px 28px 6px;max-width:900px;width:min(900px, 92%);
  border:1px solid rgba(217,164,58,calc(.28 + var(--pulse) * .45));border-radius:999px;
  background:radial-gradient(ellipse at 50% 50%, rgba(217,164,58,calc(.06 + var(--pulse) * .10)), rgba(217,164,58,.015) 75%);backdrop-filter:blur(2px);
  box-shadow:0 0 calc(10px + var(--pulse) * 26px) rgba(217,164,58,calc(.12 + var(--pulse) * .35));
  transition:box-shadow .12s, border-color .12s, opacity .7s;animation:sayin .3s ease-out}
#song[hidden]{display:none}
#song .head{color:#e0b85a;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:.75;line-height:14px}
#song .head:empty{display:none}
#song .trline:empty{display:none}
#song .note{display:none}
#song{position:relative;overflow:hidden;flex:0 0 auto;min-height:0}  /* не сжиматься в колонке листа: строки перевода срезало (07.09) */
#song canvas.eq{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:.7;z-index:0}
#song .head,#song .lyr,#song .trline{position:relative;z-index:1}
#song .lyr.tr2{height:16px;line-height:16px;font-size:12.5px;color:rgba(240,210,138,.55)}
#song .lyr.tr2 .inner span{position:absolute;top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#song .trline{min-height:0;line-height:15px;margin-top:1px;font-size:12.5px;color:rgba(240,210,138,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;transition:opacity .4s;opacity:0}
#song .lyr{width:100%;white-space:nowrap;overflow:hidden;color:#f0d28a;font-size:15px;letter-spacing:.01em;text-align:left;position:relative;height:20px;line-height:20px;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, rgba(0,0,0,.35) 18%, #000 42%, #000 58%, rgba(0,0,0,.35) 82%, transparent 100%);mask-image:linear-gradient(90deg, transparent 0, rgba(0,0,0,.35) 18%, #000 42%, #000 58%, rgba(0,0,0,.35) 82%, transparent 100%)}
#song .lyr .inner{display:inline-block;white-space:nowrap;position:absolute;left:0;top:0;line-height:20px;transition:transform .16s linear;will-change:transform}
#song .lyr .inner .gap{color:rgba(240,210,138,.25)}
#song .lyr .inner span{opacity:1;transition:color .25s, opacity .4s, text-shadow .25s}
#song .lyr .inner .sung{color:rgba(240,210,138,.45)}
#song .lyr .inner .now{color:#fff6d0;text-shadow:0 0 10px rgba(255,220,140,.9);font-weight:600}
#song .lyr .inner .next{color:rgba(240,210,138,.7)}
#song .lyr .inner .after{color:rgba(240,210,138,.35)}
#song.fade{opacity:0}
/* перевод чужого языка — второй строкой под репликой */
.msg .tr{display:block;opacity:.6;font-size:13px;margin:1px 0 2px;color:var(--text)}
/* реплика с переводом — своя строка на всю ширину облачка: фраза, под ней
   перевод; русские реплики между ними текут обычным текстом (владелец, 07.09:
   «какие-то долбанные отступы» — плавающие блоки читались криво) */
.msg .ph.wtr{display:block;margin:0 0 3px}
.msg .ph.wtr .tr{margin:0 0 1px}
#snd .chip{display:inline-flex;align-items:center;gap:6px;animation:sayin .2s ease-out;transition:opacity .6s}
#snd .chip .dot{width:6px;height:6px;border-radius:50%;background:#e0a548;box-shadow:0 0 6px #e0a54888}
#snd .chip.bg .dot{background:#5aa9e6;box-shadow:0 0 6px #5aa9e688}
#snd .chip .lab{color:#e0a548}
#snd .chip.bg .lab{color:#5aa9e6}
#snd .chip .sec,#snd .chip .ch{letter-spacing:.03em;text-transform:none;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--dim-2)}
#snd .chip.fade{opacity:0}
#s-hear-1 .reflist .rl.ear{color:#e0a548;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;cursor:default}
#s-hear-1 .reflist .rl.ear .t{color:#e0a54899}
#s-hear-1 .reflist .rl.ear.ok{color:#7fd08a}
#s-hear-1 .reflist .rl.ear.ok .t{color:#7fd08a99}
#s-hear-1 .reflist .rl .tag{color:#e0a548;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
#chat::-webkit-scrollbar{width:8px}
#chat::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.say{margin-left:calc(var(--d,0) * 34px);max-width:min(104ch, calc(100% - var(--d,0) * 34px));
  border-left:2px solid var(--line-2);padding-left:11px;animation:sayin .22s ease-out}
@keyframes sayin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* ═══ ОБУЧЕНИЕ ВИДНО В САМОЙ ФРАЗЕ (06.09) ═══════════════════════════
   Владелец: «главное — чтобы я видел и слышал, как в проге идёт процесс
   обучения». Раньше исправление приезжало серой строчкой «поправила:
   „X" → „Y"» отдельным сообщением — то есть ровно тем мусором, который
   он просил убрать, и увидеть в нём работу было нельзя.
   Теперь правка происходит НА МЕСТЕ: слово, которое система передумала,
   на секунду загорается и гаснет до обычного. Видно не отчёт о работе,
   а саму работу. */
.msg .fix{font-style:normal;border-radius:3px;padding:0 2px;
  animation:fixflash 1.6s ease-out}
@keyframes fixflash{
  0%{background:rgba(255,190,90,.55);color:#fff}
  35%{background:rgba(255,190,90,.30)}
  100%{background:transparent}}
/* слово, в котором движки не сошлись, — под тонким пунктиром: система
   его слышит, но ещё не уверена. Уверенность приходит вторым проходом,
   и пунктир пропадает сам. */
.msg .doubt{border-bottom:1px dotted rgba(255,190,90,.5);opacity:.6}
/* слово, окрашенное по владельцу голоса: цвет несёт смысл, поэтому
   никакого фона и подчёркиваний — только сам цвет буквы */
.msg .wo{transition:color .2s}
/* ЗАПИКАННОЕ (06.09.2026): «…» на месте пика — заметно; обрывок, который
   движок успел услышать до пика, — серым, еле заметным: это его догадка,
   не слово из ролика */
/* ЗАПИКАННОЕ — ТЁМНЫМ ТЕКСТОМ НА МЕСТЕ (владелец, 06.09.2026: «убирай
   точки — просто пиши тёмным текстом место, где запикали»). Слово, которое
   движок расслышал сквозь пик, остаётся в строке, только гаснет. */
.msg .beep{border-bottom:1px dotted #e0a548aa;cursor:help}
.msg .ph.laugh{font-style:italic;color:#e0a548;opacity:.85}
.msg .beep.none{color:var(--dim-2);opacity:.55}
.msg .beep .gtail{color:var(--dim-2);opacity:.5;font-style:italic}
.say>.who .learn{margin-left:7px;color:var(--dim-2);font-size:10px;
  letter-spacing:.04em;text-transform:none}
.say>.who{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim-2);margin-bottom:1px}
.say>.who .n{color:inherit}
.say .msg{max-width:100%;align-self:stretch;border:0;padding:2px 0;background:none}

/* ── АКУСТИЧЕСКАЯ ТОПОЛОГИЯ: ВЕСЬ ЭКРАН РАЗДЕЛА ──────────────────────
   Сцена занимает высоту окна за вычетом нижней панели ввода. Разговор
   колонками живёт ниже, вторым экраном, по прокрутке.
     • заголовок листа («слух / Чат / что она слышит…») снят — раздел
       уже назван в кольце и в оглавлении слева, второй раз незачем;
     • полоса состояния уехала ПОД сцену: она нужна, но не первой;
      • строка ввода остаётся доступна и на странице разговора. */
body[data-organ="hear"] #page{inset:var(--top-h) 0 var(--dock-h) 0}
/* ДВА РАВНЫХ РАЗДЕЛА (05.09, финал). Сцена — лист 0, разговор — лист 1.
   Оба во весь экран, у обоих снят повторный заголовок: раздел уже
   назван в кольце и в оглавлении слева. */
#s-hear-0,#s-hear-1{padding:0;min-height:var(--sh,100%);max-height:var(--sh,100%)}
#s-hear-0>h1,#s-hear-0>h2,#s-hear-0>.lede,#s-hear-0>.state,
#s-hear-1>h1,#s-hear-1>h2,#s-hear-1>.lede{display:none}
#s-hear-1>.state{margin:14px 18px 8px;flex:0 0 auto}
#live{flex:0 0 auto;margin:0 18px 10px;padding:11px 14px;display:flex;gap:10px;
  align-items:baseline;border:1px solid var(--line);border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
  font-size:15px;line-height:1.45;min-height:44px}
#live .dot{width:7px;height:7px;border-radius:50%;background:#e35;flex:0 0 auto;
  align-self:center;animation:livepulse 1.1s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
/* дорожки частот слева колонкой, живой текст — справа от них (владелец) */
#live{display:grid;grid-template-columns:max-content minmax(0,1fr);grid-auto-rows:min-content;column-gap:16px;row-gap:5px;align-items:start}
#live .trk{grid-column:1;width:auto}
#live .trk .hz{min-width:0}
#live .lt{grid-column:2;grid-row:1 / span 2;align-self:start;margin-top:0}
.trk{display:flex;gap:9px;align-items:baseline;min-width:0;opacity:.55}
.trk.on{opacity:1}
.trk .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;align-self:center;
  background:var(--line-2)}
.trk.on .dot{animation:livepulse 1.1s ease-in-out infinite}
.trk .hz{flex:0 0 auto;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim-2);min-width:96px}
/* ТЕКСТ ЧЕРНОВИКА НАРОЧНО БЛЕДНЫЙ: он появляется через 30 мс и будет
   переписан. Яркость тут врала бы, что это готовый текст. */
.trk .tx{color:var(--dim-2);min-width:0;font-size:14px;line-height:1.45}
/* общая строка живого текста: одна на всех, люди различаются цветом */
#live .lt{margin-top:2px;font-size:14.5px;line-height:1.5;color:var(--dim-2);
  word-break:break-word}
#live .lt span{transition:color .2s}
.trk .tx b{color:var(--dim);font-weight:400}
.trk .tx i{color:var(--text);font-style:normal;opacity:.85;
  animation:livein .22s ease-out}
@keyframes livein{from{opacity:.1}to{opacity:.85}}
#s-hear-1>#chat{padding:4px 18px 18px;box-sizing:border-box}
/* ВКЛАДКА-ШТОРКА СПРАВА В ЧАТЕ (по макету владельца, 2026-09-06): узкий
   язычок у правого края, клик — выезжает панель с медиатекой и плеером;
   левый край панели тянется мышью хоть на весь экран. */
#s-hear-1{position:relative;overflow:hidden}
#s-hear-1 .chat-clear{position:absolute;left:22px;bottom:12px;z-index:4;opacity:.55}
#s-hear-1 .chat-clear:hover{opacity:1}
#s-hear-1 .dtab{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:pointer;border-left:1px solid var(--line);
  background:var(--panel);display:flex;align-items:center;justify-content:center;z-index:5;transition:background .15s}
#s-hear-1 .dtab:hover{background:var(--panel-2)}
#s-hear-1 .dtab span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim-2)}
#s-hear-1 .drawer{position:absolute;right:0;top:0;bottom:0;width:var(--dw,44%);min-width:280px;max-width:100%;background:var(--bg);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s;z-index:6;display:flex;flex-direction:column;box-sizing:border-box}
#s-hear-1 .drawer.open{transform:none}
/* шторка открыта — живая строка, полоска звуков, овал и лента ужимаются влево,
   а не прячутся под ней (владелец, 07.09: «всё перекрывается сверху») */
#s-hear-1.dopen>#live,#s-hear-1.dopen>#snd,#s-hear-1.dopen>#song,#s-hear-1.dopen>#chat{margin-right:calc(var(--dw,44%) + 12px)}
#s-hear-1.dopen>#song{max-width:calc(100% - var(--dw,44%) - 40px)}
#s-hear-1 .drawer .grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize}
#s-hear-1 .drawer .grip:hover{background:var(--line)}
#s-hear-1 .drawer .dbody{padding:14px 16px 16px 20px;overflow:hidden;flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
#s-hear-1 .drawer video{width:100%;display:block;background:#000;border-radius:10px;max-height:60vh}
#s-hear-1 .drawer .close{position:absolute;right:10px;top:8px;z-index:6}   /* выше .dbody — иначе клик уходил в тело шторки (06.09) */
#s-hear-1 .drawer .dbody{position:relative}
#s-hear-1 .drawer .bigplus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* плюс рисуем двумя палочками, а не символом: символ у шрифта сидит не по
   центру глифа, и круг выглядел криво (владелец, 2026-09-06) */
#s-hear-1 .drawer .bigplus button{position:relative;width:88px;height:88px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;transition:all .15s;font-size:0}
#s-hear-1 .drawer .bigplus button::before,#s-hear-1 .drawer .bigplus button::after{content:'';position:absolute;left:50%;top:50%;
  background:var(--dim);border-radius:1px;transform:translate(-50%,-50%);transition:background .15s}
#s-hear-1 .drawer .bigplus button::before{width:34px;height:2px}
#s-hear-1 .drawer .bigplus button::after{width:2px;height:34px}
#s-hear-1 .drawer .bigplus button:hover{background:var(--panel-2);border-color:var(--line-2)}
#s-hear-1 .drawer .bigplus button:hover::before,#s-hear-1 .drawer .bigplus button:hover::after{background:var(--text)}
/* пульт под роликом — в нашем стиле, все кнопки одного размера */
#s-hear-1 .ctl{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#s-hear-1 .ctl input[type=range]{accent-color:var(--text);height:2px}
/* ПОЛОСА ПЕРЕМОТКИ — НА САМОМ РОЛИКЕ, КАК У ВСЕХ ПЛЕЕРОВ (владелец, 2026-09-06) */
#s-hear-1 .stage{position:relative;border-radius:10px;overflow:hidden;background:#000;flex:0 0 auto}
#s-hear-1 .stage video{border-radius:0;max-height:52vh}
#s-hear-1 .stage .seek{position:absolute;left:0;right:0;bottom:0;height:26px;cursor:pointer;z-index:1;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0))}
#s-hear-1 .stage .seek .track{position:absolute;left:48px;right:44px;bottom:8px;height:3px;background:rgba(255,255,255,.22);border-radius:2px;transition:height .12s}
#s-hear-1 .stage .seek:hover .track{height:5px}
#s-hear-1 .stage .seek .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:2px}
#s-hear-1 .stage .seek .knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .12s}
#s-hear-1 .stage .seek:hover .knob{opacity:1}
#s-hear-1 .stage .tm{position:absolute;right:44px;bottom:16px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#fff;
  text-shadow:0 1px 2px #000;opacity:0;transition:opacity .12s;pointer-events:none}
#s-hear-1 .stage:hover .tm{opacity:.9}
/* контекстное меню плеера — правая кнопка на ролике */
#s-hear-1 .cmenu{position:fixed;z-index:50;min-width:190px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;
  padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px}
#s-hear-1 .cmenu .mi{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--dim)}
#s-hear-1 .cmenu .mi:hover{background:var(--panel-2);color:var(--text)}
#s-hear-1 .cmenu .mi .v{color:var(--dim-2);font-size:11px}
#s-hear-1 .cmenu .mi[aria-checked=true]{color:var(--text)}
#s-hear-1 .cmenu .mi[aria-checked=true]::after{content:'✓';font-size:11px}
#s-hear-1 .cmenu .hd{padding:6px 10px 2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2)}
#s-hear-1 .cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#s-hear-1 .ctl .keys{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
/* громкость — слева внутри ролика, как на ютубе: значок, ползунок выезжает на наведении */
#s-hear-1 .stage .volbox{position:absolute;left:12px;bottom:14px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .12s;z-index:2}
#s-hear-1 .stage:hover .volbox{opacity:1}
#s-hear-1 .stage .volbox .ico{width:26px;height:26px;border:0;background:transparent;color:#fff;font-size:15px;cursor:pointer;text-shadow:0 1px 2px #000;padding:0}
#s-hear-1 .stage .volbox input{width:0;opacity:0;transition:width .15s,opacity .15s;accent-color:#fff;height:2px}
#s-hear-1 .stage .volbox:hover input{width:70px;opacity:1}
/* всплывашки как на ютубе: «+10 с» по краям, «2×» при зажатии */
#s-hear-1 .stage .tap{position:absolute;top:50%;transform:translateY(-50%);width:34%;height:70%;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 2px #000;pointer-events:none;
  opacity:0;transition:opacity .35s}
#s-hear-1 .stage .tap.l{left:-8%}  #s-hear-1 .stage .tap.r{right:-8%}
#s-hear-1 .stage .tap.on{opacity:1;transition:none}
#s-hear-1 .stage .title{position:absolute;left:0;right:0;top:0;padding:10px 14px;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0));opacity:0;transition:opacity .12s;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-hear-1 .stage:hover .title{opacity:1}
#s-hear-1 .stage .fsb{position:absolute;right:10px;bottom:16px;width:26px;height:26px;border:0;background:transparent;color:#fff;font-size:16px;
  cursor:pointer;text-shadow:0 1px 2px #000;padding:0;opacity:0;transition:opacity .12s;z-index:2}
#s-hear-1 .stage:hover .fsb{opacity:1}
#s-hear-1 .stage .armed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:3}
#s-hear-1 .stage .armed button{padding:12px 22px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;
  animation:armpulse 1.4s ease-in-out infinite}
@keyframes armpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.18)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
/* расшифровка под роликом — как на ютубе: список с таймерами, текущая строка подсвечена, клик — перемотка */
#s-hear-1 .reflist{position:relative;margin-top:10px;flex:1 1 auto;min-height:0;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
#s-hear-1 .drawer .player{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
#s-hear-1 .reflist .rl{display:flex;gap:10px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.45;color:var(--dim)}
#s-hear-1 .reflist .rl:hover{background:var(--panel)}
#s-hear-1 .reflist .rl .t{flex:0 0 44px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim-2);padding-top:2px}
#s-hear-1 .reflist .rl.cur{background:var(--panel-2);color:var(--text)}
#s-hear-1 .reflist .rl.cur .t{color:var(--text)}
#s-hear-1 .reflist .rl .rw.on{color:var(--text);background:rgba(224,165,72,.10)}
#s-hear-1 .reflist .rl .rw.said{color:var(--text)}
#s-hear-1 .reflist .rl .rw{border-radius:3px;padding:0 1px}
#s-hear-1 .reflist.mark .rl .rw{cursor:pointer}
#s-hear-1 .reflist .rl .body{outline:none}
#live .lt .grow{display:inline-block;animation:growin .18s ease-out both}
@keyframes growin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#s-hear-1 .reflist.mark ::selection{background:rgba(255,255,255,.10)}
#s-hear-1 .reflist .rl .rw.sel{background:rgba(255,255,255,.08);box-shadow:4px 0 0 rgba(255,255,255,.08)}
#s-hear-1 .reflist .rl .rw.sel.first{border-radius:4px 0 0 4px}
#s-hear-1 .reflist .rl .rw.sel.last{border-radius:0 4px 4px 0;box-shadow:none}
#s-hear-1 .reflist .rl .t{position:relative}
#s-hear-1 .reflist .rl .t .addtrk{display:none;position:absolute;left:0;top:-12px;width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;border:1px solid var(--line-2);color:var(--dim-2);font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif;cursor:pointer;background:var(--bg);box-sizing:border-box}
#s-hear-1 .reflist.mark .rl .t:hover .addtrk,#s-hear-1 .reflist.mark .rl .t .addtrk:hover{display:block}
#s-hear-1 .reflist .rl .t{padding-top:2px;min-height:16px}
#s-hear-1 .reflist .rl .t .addtrk:hover{color:#e0a548;border-color:#e0a548}
#s-hear-1 .reflist .rl.extra{padding-top:2px;padding-bottom:2px}
#s-hear-1 .reflist .rl.extra .t{color:rgba(224,165,72,.6)}
#s-hear-1 .reflist .rl.extra .body:empty::before{content:'кликни над словом, где началась реплика, и пиши';color:var(--dim-2);font-style:italic;opacity:.6}
#s-hear-1 .reflist .rl.extra{cursor:text}
#s-hear-1 .reflist .rl.extra .body{flex:1 1 auto;min-height:1.2em;display:block}
#s-hear-1 .reflist .rl .body .rw{padding:0}
#s-hear-1 .reflist .rl .body .gap{margin:0;height:1.1em}
#s-hear-1 .reflist .rl .rw.sel,#s-hear-1 .reflist .rl .gap.sel{background:rgba(255,255,255,.07)}
#s-hear-1 .reflist .rl .rw.sel.first{border-radius:4px 0 0 4px}
#s-hear-1 .reflist .rl .rw.sel.last{border-radius:0 4px 4px 0}
#s-hear-1 .reflist .rl .rw.sel.first.last{border-radius:6px}
#s-hear-1 .pal .sw.add{background:none;border:1px solid var(--line-2);font-size:12px;line-height:12px;text-align:center;color:var(--dim-2)}
#s-hear-1 .reflist.mark .rl .rw:hover{background:rgba(255,255,255,.05)}
#s-hear-1 .reflist .rl .rw.added{border-bottom:1px dotted rgba(224,165,72,.5)}
#s-hear-1 .reflist .rl .gap{display:none;width:5px;height:12px;vertical-align:middle;cursor:text;border-left:1px dotted transparent;margin:0}
#s-hear-1 .reflist.mark .rl .gap{display:inline-block}
#s-hear-1 .reflist.mark .rl .gap:hover{border-left:1px solid rgba(224,165,72,.7)}
#s-hear-1 .reflist .rl .gap input{width:9ch;font:inherit;background:none;color:var(--text);border:0;border-bottom:1px solid rgba(224,165,72,.5);padding:0 2px;outline:none}
#s-hear-1 .pal{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim-2)}
#s-hear-1 .pal .grp{display:inline-flex;gap:5px;align-items:center;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
#s-hear-1 .pal .sw{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;opacity:.85}
#s-hear-1 .pal .sw.on{border-color:#fff;opacity:1;transform:scale(1.15)}
#s-hear-1 .pal .sw.erase{background:none;border:1px dashed var(--dim-2)}
#s-hear-1 .pal .b{padding:2px 8px}
#s-hear-1 .stage .fast{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:14px;background:rgba(0,0,0,.6);
  color:#fff;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s}
#s-hear-1 .stage .fast.on{opacity:1}
#s-hear-1 .ctl .keys .b{min-width:38px;max-width:38px;padding:5px 0;text-align:center;font-size:13px}
#s-hear-1 .ctl .keys .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
#s-hear-1 .ctl .keys .sp .b{min-width:46px;max-width:46px}
#s-hear-1 .ctl .keys .sp .b[aria-pressed=true]{background:var(--panel-2);border-color:var(--text);color:var(--text)}

/* ПУСТОЙ РАЗДЕЛ НЕ ДОЛЖЕН ВЫГЛЯДЕТЬ ПОЛОМАННЫМ: пока никто не говорил,
   столбцов нет, и лист был бы чёрной дырой высотой в экран. */
#s-hear-1>#chat:empty::before{content:'разговор появится здесь: новое сверху, у каждого голоса свой отступ';
  color:var(--dim-2);font-size:12px;letter-spacing:.04em;
  align-self:start;justify-self:start}
.topo{position:relative;flex:0 0 auto;background:#07080a}
.topo iframe.atlas{display:block;width:100%;border:0;background:#07080a;
  height:var(--sh,70vh);min-height:420px}
.msg{max-width:min(72ch,88%);padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--panel-2);border:1px solid var(--line)}
.msg.s{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.h{align-self:flex-start;background:none;border:1px dashed var(--line);color:var(--dim);font-size:13.5px}
.msg.h .w{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
/* ОБЛАЧКО — ДВЕ СКРУГЛЁННЫЕ СКОБКИ (06.09.2026, владелец: «просто
   скруглённую скобку сделай слева и справа от облачков», пунктира не было).
   Верх и низ без линий, слева и справа — дуги цветом человека. */
.say .msg.h{border:0;border-left:2px solid var(--line-2);border-right:2px solid var(--line-2);border-radius:16px;padding:6px 13px;font-size:14.5px;color:var(--text);background:none;align-self:flex-start;width:fit-content;max-width:100%}
.say{border-left:0 !important;padding-left:0}
.say>.who .w{margin-left:6px;color:var(--dim-2);text-transform:none;letter-spacing:.03em;font-size:10.5px;font-weight:400}
.say>.who .w:empty{display:none}
.msg.draft{opacity:.5;font-style:italic;border-style:dashed}
.msg.sys{align-self:center;background:none;color:var(--dim-2);font-size:12px;padding:0}
.act{align-self:flex-start;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line-2);
  padding:2px 10px;max-height:64px;overflow:auto;white-space:pre-wrap;cursor:pointer}
.act b{color:var(--text);font-weight:500}
.ears{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
/* ── АКУСТИКА: тон, поток, эталоны ── */
.f0row{display:flex;align-items:baseline;gap:6px;margin:2px 0 10px}
.f0row b{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.f0row .hz{color:var(--dim-2);font-size:13px}
.f0row .band{margin-left:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim-2)}
.f0row .band.m{color:#6aa0ff}.f0row .band.w{color:#ff5aa8}.f0row .band.hi{color:#ffd24a}
canvas.f0{display:block;width:100%;height:54px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.012)}
.kv2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:4px 0 12px}
.kv2>div{border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.kv2 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kv2 span{font-size:11px;color:var(--dim-2);letter-spacing:.04em}
.flow{min-height:52px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.012);font-size:14.5px;line-height:1.45;color:var(--dim);
  white-space:pre-wrap;word-break:break-word}
.dens{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.drow{display:grid;grid-template-columns:92px 1fr 44px auto auto;gap:9px;align-items:center;
  font-size:12.5px;color:var(--dim)}
.drow .nm{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.drow .bar i{display:block;height:100%;background:#5c8}
.drow.bad .bar i{background:#c55}
.drow .num{color:var(--dim-2)}
.drow .sub{color:var(--dim-2);font-size:11.5px}
.tile.mixed{border-color:rgba(228,68,102,.35)}
.densrow{display:flex;align-items:center;gap:7px;margin-top:7px}
.densrow .bar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.densrow .bar i{display:block;height:100%;background:#5c8}
.densrow .bar i.bad{background:#c55}
.densrow .num{font-size:11.5px;color:var(--dim-2)}

<script>
'use strict';
/* ═══ 0. МЕЛОЧИ ═══════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(SVGNS, n);
  for (const k in (a||{})) e.setAttribute(k, a[k]); return e; };

  const e = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const ev in v) e.addEventListener(ev, v[ev]);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'ds') for (const d in v) e.dataset[d] = v[d];
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
/* ОДИН ЗАПРОС НА АДРЕС ЗА РАЗ (04.09.2026). Часть ручек честно медленные:
   /api/vision/state перебирает камеры через cv2 — до восьми секунд на
   холодном кэше. Пока такой запрос в пути, опросчик успевал послать
   второй и третий, и они выстраивались в очередь, вешая всю страницу.
   Дедупликация по адресу + потолок ожидания: висящая ручка портит только
   свою карточку, а не весь интерфейс. */
const inflight = {};
function get(u, ms){
  if (inflight[u]) return inflight[u];
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 20000);
  return inflight[u] = fetch(u, {signal:c.signal}).then(r => r.json())
    .catch(() => null).finally(() => { clearTimeout(t); delete inflight[u]; });
}
const post = (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b||{})}).then(r => r.json()).catch(e => ({error:String(e)}));
/* ОШИБКИ СТРАНИЦЫ — В ЖУРНАЛ СЕРВЕРА (2026-09-06). Владелец видит «прога
   лежит», а я не вижу его консоль. Любая ошибка JS уходит в logs/ui_use.jsonl. */
window.addEventListener('error', e => { try { post('/api/ui/use', {what:'jserr: ' + (e.message || '') + ' @' + (e.lineno || 0) + ':' + (e.colno || 0), how:'error'}); } catch(_){} });
window.addEventListener('unhandledrejection', e => { try { post('/api/ui/use', {what:'jsrej: ' + String(e.reason && (e.reason.stack || e.reason.message || e.reason)).slice(0, 300), how:'error'}); } catch(_){} });
const gb = n => (n/1073741824).toFixed(1);
const fmtAgo = s => s == null ? '' : s < 60 ? Math.round(s)+' с' : s < 3600 ? Math.round(s/60)+' мин' : Math.round(s/3600)+' ч';
let toastT = 0;
function toast(t, bad){
  const e = $('#toast'); e.textContent = t; e.classList.toggle('bad', !!bad); e.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), bad ? 6000 : 3200);
}
/* журнал использования: что открыл, что нажал — по одной строке */
const useSeen = {};
function use(what){
  const now = Date.now();
  if (useSeen[what] && now - useSeen[what] < 2000) return;
  useSeen[what] = now;
  post('/api/ui/use', {what, how:'click'});
}

/* строительные блоки интерфейса */
const B = {
  btn: (t, fn, cls) => h('button', {class:'b ' + (cls||''), on:{click:fn}}, t),
  tg(on, fn){

    i.addEventListener('input', () => v.textContent = (fmt||String)(+i.value));
    i.addEventListener('change', () => fn(+i.value));
    const w = h('div', {class:'sl'}, i, v);
    w.set = x => { i.value = x; v.textContent = (fmt||String)(+x); };
    return w;
  },
  sel(opts, cur, fn){
    const s = h('select', {class:'in', on:{change:() => fn(s.value)}});
    opts.forEach(([v, t]) => s.appendChild(h('option', {value:v, selected:v===cur?'':null}, t)));
    s.set = (o, c) => { s.innerHTML=''; (o||opts).forEach(([v,t]) => s.appendChild(h('option',{value:v,selected:v===c?'':null},t))); };
    return s;
  },
  row(t, d, ...ctl){ return h('div', {class:'row'}, h('div', {class:'t'}, t),
    d ? h('div', {class:'d'}, d) : null, h('div', {class:'c'}, ...ctl)); },
  stars(n, fn){
    const w = h('span', {class:'stars', title:'Ручная оценка: 1–10, ноль — не использовать'});

};

/* ═══ 1. ОРГАНЫ ═══════════════════════════════════════════════════════ */
const ORGANS = [
  /* ДВА ОТДЕЛЬНЫХ РАЗДЕЛА, А НЕ ЛИСТ С ДВУМЯ ЭТАЖАМИ (05.09, вторая
      правка). Сначала я поставил сцену первым экраном, а разговор —
      вторым экраном того же листа, и в оглавлении «Чат» получился
      подпунктом. Владелец: «сделай нормально, зачем ты его в подблок
      сделал». Он прав: это два равных раздела, а не «раздел и его
      кусок» — и в оглавлении они стоят рядом. */
   {k:'hear',  t:'Слух',  lede:'Что она слышит и чем распознаёт.', toc:['Акустическая топология','Чат','Акустика','Движки и шумодав','Голоса','Сцена']},
  {k:'voice', t:'Голос', lede:'Чем говорит и как звучит.',        toc:['Движок','Голоса','Топология звука']},
  {k:'brain', t:'Мозги', lede:'Кто думает и на чём.',             toc:['Модель','Локальные','Облако','Обучение','Характер']},
  {k:'eyes',  t:'Глаза', lede:'Что она видит на экране и в камере.', toc:['Экран и камера','Внимание']},
  {k:'hands', t:'Руки',  lede:'Чем она действует в системе.',     toc:['Команды','Приложения','Окна и доверие']},
  {k:'face',  t:'Лицо',  lede:'Как она выглядит и двигается.',    toc:['Персонаж','Внешний вид','Окно на столе']},
];
const WORD = {ready:'готова', loading:'поднимаю', broken:'сломано', off:'выключено'};

/* ═══ 2. СЦЕНА: ВЕЕР СЕКТОРОВ, ШАР, КОЛЬЦО ══════════════════════════
   Геометрия и вид — из Graphite (index.html, 2026-08-20…25), которым
   владелец доволен: секторы режут ВСЮ сцену от дырки вокруг шара до краёв,
   подписи гравированы, шар белый с прорезанным именем, кольцо — спектр
   наружу от кромки шара и дуги готовности органов. Чего здесь нет:

/* ШЕСТЬ КЛИНЬЕВ ПО НАБРОСКУ ВЛАДЕЛЬЦА (04.09.2026). Границы — не ровные
   60°, а горизонталь через центр плюс четыре диагонали В УГЛЫ экрана.
   Отсюда несимметрия: верхний и нижний клинья широкие, угловые узкие —
   ровно как на его макете. Порядок в списке = по часовой от «трёх часов».
   `a` (середина клина) считается в geometry() и живёт для дуг на кольце. */
const ZONES = [
  {k:'hands', c:'BR', name:'руки',   sub:'система и файлы'},
  {k:'voice', c:'B',  name:'голос',  sub:'как звучит'},
  {k:'hear',  c:'BL', name:'слух',   sub:'что слышит'},
  {k:'face',  c:'TL', name:'тело',   sub:'образ и жесты'},
  {k:'eyes',  c:'T',  name:'зрение', sub:'экран и камера'},
  {k:'brain', c:'TR', name:'мозг',   sub:'модели и мышление'},

/* ЗАЛИВКА ИНДИКАТОРОВ ТОЛЬКО РАСТЁТ (04.09.2026, владелец: «почему эти
   полосочки туда-сюда прыгают, они должны просто постепенно загрузиться»).

   не индикатор, а метроном: глазу не за что зацепиться, и непонятно,
   движется дело или нет. Полоска ползёт вперёд и назад не идёт; вниз её

   застывает, и доводка отсюда ползла бы сто секунд вместо полутора. */

function paintLoad(){
  const now = performance.now();
  const ldt = loadT ? Math.min(.5, (now - loadT)/1000) : .016; loadT = now;
  ZONES.forEach(z => {
    const g = LOAD[z.k]; if (!g) return;
    const st = (READY[z.k] || {}).state || 'off';
    /* Цель и скорость. «Поднимаю» ползёт медленно и не доходит до конца —
       край полоски остаётся за готовностью, чтобы «почти» не читалось

      loadSt[z.k] = st;

}

     один пиксель, и «ровно экран» останавливался на 754 вместо 755 —

const WORKLET = `class Cap extends AudioWorkletProcessor{

function songEq(bands){
  /* волна звука: огибающая полос сверху и зеркально снизу, сглажена;
     сама волна плавно течёт (сглаживание по времени), без зубцов */

  const c = ov.querySelector('canvas.eq'); if (!c) return;

  const n = Math.min(bands.length, 40); if (n < 4) return;
  const prev = c._v || new Array(n).fill(0);
  const v = [];
  for (let i = 0; i < n; i++){ const x = Math.max(0, Math.min(1, ((+bands[i] || 0) - 70) / 150)); v.push(prev[i] * 0.55 + x * 0.45); }

  const pts = v.map((a, i) => [i / (n - 1) * W, a * H * 0.42]);

  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(217,164,58,0)'); g.addColorStop(.25, 'rgba(217,164,58,.28)'); g.addColorStop(.75, 'rgba(217,164,58,.28)'); g.addColorStop(1, 'rgba(217,164,58,0)');

  for (let i = 1; i < pts.length; i++){ const p = pts[i - 1], q = pts[i]; const cx = (p[0] + q[0]) / 2; ctx.bezierCurveTo(cx, H / 2 - p[1], cx, H / 2 - q[1], q[0], H / 2 - q[1]); }

  ctx.closePath(); ctx.fill();
}

  /* ═══ РЕДАКТОР РАЗМЕТКИ ЭТАЛОНА (06.09.2026) ══════════════════════════

  /* ГОЛОСА — СКОЛЬКО УГОДНО (владелец: «если будет ебанутое количество

  let MARK = {lines:{}, voices:{}}, markOn = false, curVoice = null, saveT = 0, dragFrom = null;

      if (meta.px) body.style.paddingLeft = meta.px + 'px';
      /* ГДЕ НАЧАЛАСЬ ПАРАЛЛЕЛЬНАЯ РЕПЛИКА (владелец: «хочу вот отсюда
         примерно начать, чтобы ты таймер в долях секунд мог видеть, когда
         она там пиздит относительно транскриба»). Клик по пустому месту

  async function markLoad(){

  function paintScore(sc){

    const bad = (sc.bins || []).filter(b => b.lost || b.extra).slice(-8).map(b => `${mmss(b.t)} ${b.hit}/${b.ref}` + (b.lost ? ' потеряно: ' + b.lost : '') + (b.extra ? ' лишнее: ' + b.extra : '')).join('\n');

  function poll(){ clearInterval(pollT); pollT = setInterval(async () => { if (vid.paused){ clearInterval(pollT); return; } const d = await get('/api/polygon', 8000); if (d && d.live) paintScore(d.live); }, 1500); }

  src.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  /* ПЛЮСИК — ФАЙЛ ИЗ ПРОВОДНИКА (владелец, 2026-09-06). Браузер путь к
     файлу не отдаёт, поэтому файл заливается на сервер в data/media —

  const fileIn = h('input', {type:'file', accept:'audio/*,video/*,.mkv,.mp4,.mp3,.wav,.m4a,.ogg,.webm', style:'display:none'});
  const plus = h('button', {class:'b sm', title:'добавить файл с диска', style:'font-size:16px;line-height:1;min-width:34px;max-width:34px', on:{click:() => fileIn.click()}}, '+');
  const upNote = h('div', {class:'note mono', style:'min-height:0'});

    const m = await post('/api/media/match', {name:f.name, size:f.size});
    if (m && m.item){ fileIn.value = ''; pick(m.item); return; }
    /* СРАЗУ ИГРАТЬ (владелец: «как только выберу — должен сразу отобразиться»).

function paintLive(t, marks){

  t = t || '';
  if (!t){ box.textContent = ''; box._prev = ''; return; }
  if (!(marks && marks.length)){
    /* СЛОВА ВСТАЮТ ПО ОДНОМУ (владелец: «как у тебя или GPT — слова в
       моменте выстраивают фразу»). Движок отдаёт строку целиком каждые

    .sort((a, b) => a[0] - b[0]);

    if (b <= a) continue;

    t.tx.innerHTML = '';
    if (head) t.tx.appendChild(h('b', {}, head));
    if (tail) t.tx.appendChild(h('i', {}, tail));

function voiceBucket(hz, sex, vtl){
  /* ═══ КОРЗИНА ПО СПЕКТРУ, А НЕ ТОЛЬКО ПО ВЫСОТЕ (06.09.2026) ═══
     Владелец: «облачка быстрее формировать под людей на основе частот
     звука, а уж потом логика и распознавание голоса — и всё за секунду».
     Быстрая подпись голоса = высота (полутоны) + длина голосового тракта
     по формантам (см): у одного человека высота гуляет на 5–6 полутонов,
     а тракт почти стоит; у двух людей с одной высотой тракт разный.
     Расстояние: полутоны/3.5 + сантиметры/1.2 — своя корзина, если < 1. */
  const st = 12 * Math.log2(hz / 110);
  let best = null, bd = 1e9;
  VBUCK.forEach(v => {
    let d = Math.min(Math.abs(st - v.st), Math.abs(st - 12 - v.st) + 1.5, Math.abs(st + 12 - v.st) + 1.5) / 3.5;
    if (vtl && v.vtl) d = 0.6 * d + 0.4 * Math.abs(vtl - v.vtl) / 1.2;

    best.st += 0.08 * (st - best.st);

     даёт сервер по длине голосового тракта и только когда уверен; без
     уверенности — нейтральная палитра, чтобы не врать цветом. */
  if (sex === 'м' || sex === 'ж'){
    const pal = sex === 'ж' ? ['#f06292','#ffb74d','#ff8a65','#ffd54f','#ce93d8'] : ['#5a96ff','#4dd0e1','#9fa8da','#4db6ac','#81c784'];
    const nth = VBUCK.filter(x => x.sex === sex).length;
    const v = {st, vtl: vtl || 0, hz:Math.round(hz), key:'v' + VBUCK.length, color:pal[nth % pal.length], sex,
               name: (VNAMES[bkey(Math.round(hz))] || 'голос ' + Math.round(hz) + ' Гц')};

  if (sex === '?'){
    const pal = ['#b39ddb','#bcaaa4','#a5d6a7','#e6ee9c','#90caf9'];
    const nth = VBUCK.filter(x => x.sex === '?').length;
    const v = {st, vtl: vtl || 0, hz:Math.round(hz), key:'v' + VBUCK.length, color:pal[nth % pal.length], sex:'?',
               name: (VNAMES[bkey(Math.round(hz))] || 'голос ' + Math.round(hz) + ' Гц')};
    VBUCK.push(v); return v;
  }
  /* ═══ ЦВЕТ ГОВОРИТ О ПОЛЕ ГОЛОСА (06.09) ═══════════════════════════
     Владелец: «давай голоса будем по цветам разделять: женские — тёплые
     оттенки, мужские — холодные, для наглядности».
     Граница 165 Гц: мужской голос 85–155, женский 165–255. Внутри своей
     половины оттенки идут по кругу, чтобы двое мужчин не слились. */
  const hzv = Math.round(110 * Math.pow(2, st / 12));
  const warm = ['#f06292','#ffb74d','#ff8a65','#ffd54f','#ce93d8'];
  const cool = ['#5a96ff','#4dd0e1','#9fa8da','#4db6ac','#81c784'];
  const pal = hzv >= 165 ? warm : cool;

  VBUCK.push(v);
  return v;
}

/* Склейка подряд идущих реплик одного голоса в одно облачко. */
/* ═══ ПРАВКА ВИДНА В САМОЙ ФРАЗЕ (06.09) ═════════════════════════════
   Держим последние облачка по их номеру (pid). Когда второй проход

   Диффим по словам, а не по буквам: человек читает словами, и подсветка
   половины слова выглядела бы сбоем, а не правкой. */
const SAID = new Map();          /* pid -> {el, x} */
function rememberSaid(pid, el){

      const stem = w.replace(/[^а-яё]/gi, '').toLowerCase();

       2. Ответ на вопрос: прошлая кончилась «?», новая короткая (≤3 слова)

    try {
      const prevT = (GLUE.lastText || '').trim(); const newT = (m.text || '').trim();

      const pw = prevT.toLowerCase().replace(/[^а-яёa-z ]/g, '').split(/\s+/).filter(Boolean);

    f0hist.forEach((v, i) => { const x = w - (f0hist.length-i)*(w/120);

/* ═══ 14. ДОСКА ══════════════════════════════════════════════════════
   Вынесена на главный экран отдельной кнопкой в шапке — раньше до неё
   надо было добираться через старую шапку, и владелец туда почти не
   заходил. Карточку берут рукой и роняют в столбик: она летит за
   курсором, при отпускании примагничивается и приседает. Это единственное
   место в оболочке, где анимация не служебная, — работа с задачами должна
   быть приятной, иначе доска опять зарастёт.
   Столбцы — те же, что у devboard.py: doing / bugs / planned / ideas / done. */
const COLS = [['doing','в работе'],['bugs','баги'],['planned','в планах'],['ideas','идеи'],['done','сделано']];
const board = $('#board'), colsBox = $('#cols');
let BD = null, drag = null;
COLS.forEach(([id, t]) => {
  const body = h('div', {class:'body', ds:{col:id}});
  const inp = h('input', {class:'in', placeholder:'новая карточка', on:{keydown: async e => {
    if (e.key !== 'Enter' || !inp.value.trim()) return;
    await post('/api/devboard/add', {col:id, text:inp.value.trim()}); inp.value = ''; use('board:add'); loadBoard(); }}});
  colsBox.appendChild(h('div', {class:'col', ds:{col:id}}, h('h3', {}, t, h('b', {ds:{n:id}}, '0')), body, h('div', {class:'add'}, inp)));
});
function card(it){
  const c = h('div', {class:'tk' + (it.auto ? ' auto' : ''), ds:{id:it.id}}, h('span', {}, it.text),
    it.note ? h('span', {class:'nt'}, it.note) : null,
    h('button', {class:'x', title:'убрать', on:{click: async e => { e.stopPropagation();
      await post('/api/devboard/delete', {id:it.id}); use('board:del'); loadBoard(); }}}, '×'));
  c.addEventListener('pointerdown', e => grab(e, c, it));
  return c;
}
function grab(e, c, it){
  if (e.target.closest('.x')) return;
  e.preventDefault();
  const r = c.getBoundingClientRect();
  const g = c.cloneNode(true); g.classList.add('fly');
  g.style.cssText += `left:${r.left}px;top:${r.top}px;width:${r.width}px`;
  document.body.appendChild(g);
  c.style.opacity = '.25';
  drag = {g, c, it, dx: e.clientX - r.left, dy: e.clientY - r.top, moved:false};
  addEventListener('pointermove', move); addEventListener('pointerup', drop, {once:true});
}
function move(e){
  if (!drag) return;
  drag.moved = true;
  const x = e.clientX - drag.dx, y = e.clientY - drag.dy;
  const tilt = Math.max(-7, Math.min(7, (e.movementX || 0) * 1.6));
  drag.g.style.left = x + 'px'; drag.g.style.top = y + 'px';
  drag.g.style.transform = `rotate(${tilt}deg) scale(1.03)`;
  const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('.col');
  colsBox.querySelectorAll('.col').forEach(k => k.classList.toggle('hov', k === col));
}
async function drop(e){
  removeEventListener('pointermove', move);
  if (!drag) return;
  const d = drag; drag = null;
  colsBox.querySelectorAll('.col').forEach(k => k.classList.remove('hov'));
  const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('.col');
  const to = col && col.dataset.col;
  if (!d.moved || !to || to === d.it.col){ d.g.remove(); d.c.style.opacity = ''; return; }
  /* примагничивание: карточка долетает до места сама, потом приседает */
  const body = col.querySelector('.body'), br = body.getBoundingClientRect();
  d.g.style.transition = 'left .26s cubic-bezier(.2,.9,.3,1),top .26s cubic-bezier(.2,.9,.3,1),transform .26s';
  d.g.style.left = (br.left + 10) + 'px';
  d.g.style.top = (br.top + Math.min(br.height - 40, body.scrollHeight + 8)) + 'px';
  d.g.style.transform = 'rotate(0) scale(1)';
  d.g.style.width = (br.width - 20) + 'px';
  await post('/api/devboard/update', {id:d.it.id, col:to});
  use('board:move');
  setTimeout(async () => { d.g.remove(); await loadBoard();
    const fresh = colsBox.querySelector(`[data-id="${d.it.id}"]`);
    if (fresh){ fresh.style.setProperty('--rot', (Math.random()*6-3).toFixed(1)+'deg'); fresh.classList.add('land');
      setTimeout(() => fresh.classList.remove('land'), 460); } }, 270);
}
async function loadBoard(){
  BD = await get('/api/devboard'); if (!BD) return;
  const by = {}; COLS.forEach(([id]) => by[id] = []);
  (BD.items||[]).forEach(it => (by[it.col] || by.planned).push(it));
  COLS.forEach(([id]) => { const body = colsBox.querySelector(`.body[data-col="${id}"]`);
    body.innerHTML = ''; by[id].forEach(it => body.appendChild(card(it)));
    colsBox.querySelector(`[data-n="${id}"]`).textContent = by[id].length; });
  const bugs = Object.entries(BD.bugs||{}).filter(([,b]) => !b.resolved);
  const bb = colsBox.querySelector('.body[data-col="bugs"]');
  bugs.forEach(([k, b]) => bb.appendChild(h('div', {class:'tk auto'}, h('span', {}, `${k} ×${b.count}`), h('span', {class:'nt'}, (b.text||'').slice(0,140)))));
  colsBox.querySelector('[data-n="bugs"]').textContent = by.bugs.length + bugs.length;
  $('#bstamp').textContent = BD.updated ? 'обновлено ' + String(BD.updated).replace('T', ' ').slice(0, 16) : '';
}
function boardOpen(on){ board.classList.toggle('on', on); if (on){ use('board'); loadBoard(); loadUse(); } }
/* СТАТИСТИКА ИСПОЛЬЗОВАНИЯ (идея владельца 04.09.2026): чем он реально
   пользуется, а что не получило ни одного взгляда. Считается из
   logs/ui_use.jsonl — по строке на действие; решение «переделать или
   выкинуть» будет опираться на неё, а не на память. */
const useBox = h('div', {style:'margin-top:14px'});
$('#board').appendChild(useBox);
async function loadUse(){
  const d = await get('/api/ui/use?days=30'); if (!d) return;
  const rows = Object.entries(d.counts || {}).sort((a, b) => b[1] - a[1]);
  useBox.innerHTML = '';
  if (!rows.length){ useBox.appendChild(h('div', {class:'note'}, 'Журнал использования пуст — он начал копиться только что.')); return; }
  const max = rows[0][1];
  useBox.append(h('h3', {style:'margin:0 0 8px;font-size:13px'}, 'Чем пользуюсь · 30 дней'),
    h('div', {style:'display:flex;gap:6px;flex-wrap:wrap'}, ...rows.slice(0, 24).map(([k, v]) =>
      h('span', {class:'tag' + (v > max/3 ? ' on' : ''), style:'text-transform:none;letter-spacing:0', title:k}, k + ' · ' + v))));
}

$('#bclose').addEventListener('click', () => boardOpen(false));
/* Живая перезагрузка интерфейса иногда молчит (сторож ui/ работает только
   пока цел его поток). Кнопка — честный запасной путь, а не украшение. */

document.addEventListener('keydown', e => { if (e.key === 'Escape' && board.classList.contains('on')){ e.stopPropagation(); boardOpen(false); } }, true);

try { if (ORGANS.some(o => o.k === hh0)) open(hh0); } catch(e){ console.error(e); try { post('/api/ui/use', {what:'jserr open: ' + (e && (e.stack || e.message)), how:'error'}); } catch(_){} }
</script>
