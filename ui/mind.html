<title>Разум · ANAMORF</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   РАЗУМ — панель наблюдения за памятью.

   ПЕРЕСВЕТ ПОСЛЕ ЖАЛОБЫ ВЛАДЕЛЬЦА: первая версия была почти не
   читаема. Ошибка типовая — «дорого выглядит» перепутано с «темно».
   На чёрном фоне серый текст исчезает, а мягкое свечение съедает
   остатки контраста. Правило теперь простое: фон чёрный, ЧЕРНИЛА
   ЯРКИЕ. Узлы насыщенные, связи белые, подписи светлые и с тёмным
   ореолом, чтобы читались поверх чего угодно.

   Цвет узла = кто это. Не украшение: по одному взгляду видно, чей
   куст, даже когда подписи не влезли.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ночь:#050608; --глубина:#0a0c10; --плита:#12161d; --грань:#232a35;
  --грань2:#38424f;
  --текст:#f2f6fa; --тускло:#b3c0cf; --шёпот:#8695a6; --призрак:#5d6b7c;
  --свой:#ffc65c; --сталь:#63c7f5; --тревога:#ff6b6b; --рост:#5ee08a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ночь);color:var(--текст);
  font:14px/1.55 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}

#корпус{display:grid;grid-template-columns:1fr minmax(360px,26vw);height:100vh}
@media(max-width:1000px){#корпус{grid-template-columns:1fr;
  grid-template-rows:56vh 1fr}}

#сцена{position:relative;overflow:hidden;background:
  radial-gradient(130% 95% at 50% 42%,#0d1016 0%,#050608 68%)}
#холст{display:block;width:100%;height:100%;cursor:grab}
#холст.тянем{cursor:grabbing}

#шапка{position:absolute;top:0;left:0;right:0;z-index:3;
  display:flex;align-items:flex-start;gap:18px;padding:18px 22px;
  pointer-events:none;flex-wrap:wrap}
.марка{font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--призрак);font-weight:600}
.марка b{display:block;font-size:20px;letter-spacing:.14em;color:#fff;
  font-weight:700;margin-top:2px}
#числа{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.число{text-align:right}
.число .v{font-size:18px;font-variant-numeric:tabular-nums;color:#fff;
  line-height:1.05;font-weight:600}
.число .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--шёпот);margin-top:3px}
.число.тревожно .v{color:var(--тревога)}

#низ{position:absolute;left:22px;bottom:18px;z-index:3;display:flex;gap:9px}
.чип{border:1px solid var(--грань2);background:rgba(10,12,16,.86);
  backdrop-filter:blur(8px);border-radius:999px;padding:7px 15px;
  font-size:12px;color:var(--тускло);cursor:pointer;transition:.16s}
.чип:hover{border-color:#5a6a7c;color:#fff}
.чип.горит{border-color:var(--свой);color:var(--свой)}
.чип.тревога{border-color:var(--тревога);color:var(--тревога)}

#борт{border-left:1px solid var(--грань);background:var(--глубина);
  overflow-y:auto;padding:20px 20px 40px;scrollbar-width:thin}
#борт::-webkit-scrollbar{width:6px}
#борт::-webkit-scrollbar-thumb{background:var(--грань2);border-radius:3px}
@media(max-width:1000px){#борт{border-left:0;border-top:1px solid var(--грань)}}

.раздел{margin-bottom:24px}
.раздел>h2{margin:0 0 11px;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--шёпот);font-weight:700;
  display:flex;align-items:center;gap:9px}
.раздел>h2::after{content:"";flex:1;height:1px;background:var(--грань)}
.тихо{color:var(--тускло);font-size:12.5px}

#кто{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#кто .точка{width:11px;height:11px;border-radius:50%;flex:none}
#кто .имя{font-size:24px;font-weight:700;letter-spacing:-.01em;color:#fff;
  line-height:1.1}
#кто .свой{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--свой);border:1px solid rgba(255,198,92,.5);border-radius:4px;
  padding:2px 7px;font-weight:600}
#мета{color:var(--шёпот);font-size:12px;margin-top:6px}

.метка{display:inline-block;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;border:1px solid var(--грань2);border-radius:4px;
  padding:2px 6px;color:var(--тускло);vertical-align:middle;margin-left:8px}

.дом{display:grid;grid-template-columns:74px 1fr 32px;gap:10px;
  align-items:center;font-size:12.5px;color:var(--тускло);margin-bottom:8px}
.жёлоб{height:4px;background:#1b212a;border-radius:2px;position:relative}
.жёлоб i{position:absolute;inset:0 auto 0 0;border-radius:2px;
  transition:width .45s cubic-bezier(.22,1,.36,1)}
.жёлоб b{position:absolute;top:-3px;width:2px;height:10px;border-radius:1px;
  background:#8695a6}
.чис{text-align:right;color:#fff;font-variant-numeric:tabular-nums;
  font-size:12px}

/* КАЧЕЛИ — двусторонняя шкала от центра. Односторонняя полоса врёт о
   главном: перекос это не «сколько», а «в какую сторону и насколько
   от нуля». Ноль в середине, упоры по краям. */
.качели{margin:4px 0 14px}
.качели .шкала{position:relative;height:26px;border-radius:6px;
  background:linear-gradient(90deg,rgba(99,199,245,.10),rgba(0,0,0,0) 45%,
    rgba(0,0,0,0) 55%,rgba(255,198,92,.10));border:1px solid var(--грань)}
.качели .ось{position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--грань2)}
.качели .тик{position:absolute;top:50%;width:1px;height:5px;
  background:#2b3340;transform:translateY(-50%)}
.качели .упор{position:absolute;top:0;bottom:0;width:1px;background:#39424f}
.качели .бар{position:absolute;top:7px;height:12px;border-radius:3px;
  transition:left .5s cubic-bezier(.22,1,.36,1),width .5s cubic-bezier(.22,1,.36,1)}
.качели .ручкаp{position:absolute;top:2px;width:2px;height:22px;
  border-radius:1px;background:#fff;
  transition:left .5s cubic-bezier(.22,1,.36,1)}
.качели .края{display:flex;justify-content:space-between;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--шёпот);
  margin-top:6px}
.качели .края b{color:var(--текст);font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none;font-size:12px}
.качели.упёрлась .шкала{border-color:var(--тревога);
  box-shadow:0 0 0 1px rgba(255,107,107,.2)}
.находка{border:1px solid var(--грань);border-radius:10px;padding:12px 14px;
  margin-bottom:10px;background:var(--плита);position:relative;overflow:hidden}
.находка::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--тревога)}
.находка.мягко::before{background:var(--призрак)}
.находка b{display:block;font-size:13px;color:#fff;margin-bottom:5px}
.находка .п{color:var(--тускло);font-size:12.5px}
.находка .д{color:var(--сталь);font-size:12.5px;margin-top:8px}

#лента{max-height:260px;overflow-y:auto;scrollbar-width:thin}
.фраза{padding:9px 0;border-bottom:1px solid #171d25}
.фраза .t{font-size:13px;color:var(--текст);line-height:1.45}
.фраза .низ{display:flex;align-items:center;gap:9px;margin-top:7px}
.искра{flex:1;display:flex;gap:2px;align-items:flex-end;height:13px}
.искра i{flex:1;border-radius:1px;min-height:1px}
.ист{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--шёпот);white-space:nowrap}
.вес{font-size:11.5px;font-variant-numeric:tabular-nums;color:#fff;
  min-width:32px;text-align:right}
.мертва{opacity:.42}
.мертва .t{text-decoration:line-through;text-decoration-color:var(--призрак)}

.руч{margin-bottom:14px}
.руч label{display:flex;justify-content:space-between;font-size:12.5px;
  color:var(--тускло);margin-bottom:6px}
.руч label b{color:#fff;font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;appearance:none;
  background:var(--грань2);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;
  height:13px;border-radius:50%;background:var(--сталь);cursor:pointer;
  box-shadow:0 0 0 4px rgba(99,199,245,.18)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;
  border-radius:50%;background:var(--сталь);cursor:pointer}

.ручстр{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;
  border-bottom:1px solid #171d25;font-size:12.5px}
.ручстр .n{color:var(--тускло)}
.ручстр .o{color:var(--шёпот);font-size:11.5px;display:block;margin-top:2px}
.ручстр .v{color:#fff;font-variant-numeric:tabular-nums;text-align:right;
  white-space:nowrap}
.ручстр.двинута .v{color:var(--свой)}
.ручстр .было{color:var(--призрак);font-size:11.5px}

#спар{border:1px solid var(--грань);border-radius:12px;padding:14px;
  background:var(--плита);display:flex;justify-content:space-between;
  align-items:center;gap:12px;transition:.25s}
#спар.идёт{border-color:rgba(255,198,92,.55);
  box-shadow:0 0 0 1px rgba(255,198,92,.15),0 10px 34px -14px rgba(255,198,92,.45)}
.реакция{border:1px solid var(--грань);border-radius:10px;padding:12px 14px;
  margin-bottom:10px;background:var(--плита)}
.реакция .ч{font-size:13px;color:#fff}
.реакция .р{font-size:12px;color:var(--тускло);margin:6px 0 10px}
.реакция .р b{color:var(--сталь);font-weight:600}
.верд{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.верд button{font-size:11.5px;padding:7px 4px;border:1px solid var(--грань2);
  background:#10141a;color:var(--тускло);border-radius:7px;cursor:pointer;
  transition:.16s}
.верд button:hover{border-color:var(--сталь);color:#fff}
.верд button.широкая{grid-column:1/-1;margin-top:6px;color:var(--шёпот)}
.верд button.широкая:hover{border-color:var(--свой);color:var(--свой)}
.реакция.готова{opacity:.5}
.реакция.готова .верд{display:none}

svg{display:block;overflow:visible}
#круг{width:100%;max-width:340px;margin:0 auto 16px}
#радар{width:100%;max-width:280px;margin:0 auto 10px}
.оговорка{font-size:12px;color:var(--шёпот);line-height:1.5;
  border-left:2px solid var(--грань2);padding-left:11px;margin-top:12px}
.ключ{display:grid;gap:7px;font-size:12px;color:var(--тускло)}
.ключ div{display:flex;gap:9px;align-items:baseline}
.ключ i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
</style>
</head>

/* ── холст ──────────────────────────────────────────────────── */
/* Цвет узла = кто это. Насыщенные тона на чёрном читаются с любого
   расстояния, а полутона на полутонах — ни с какого. Владелец всегда
   тёплое золото: его куст должен опознаваться боковым зрением. */
const ХВОСТ = ["#ff3ea5","#4cc9f0","#5ee08a","#b085ff","#ff8f1f",
               "#ffd23f","#ff6b6b","#3ad6c0"];
const цветЧ = ч => ч.свой ? "#ffc65c"
  : (ч.тип === "unknown" ? "#6b7a8c" : ХВОСТ[(ч.id * 3) % ХВОСТ.length]);

const холст=document.getElementById("холст"), кт=холст.getContext("2d");
const буф=document.createElement("canvas"), бк=буф.getContext("2d");
let Ш=0,В=0,ДПИ=1,узлы=[],пыль=[];

function размер(){
  ДПИ=Math.min(devicePixelRatio||1,2);
  const r=холст.parentElement.getBoundingClientRect();
  Ш=r.width; В=r.height;
  for(const c of [холст,буф]){ c.width=Ш*ДПИ; c.height=В*ДПИ; }
  холст.style.width=Ш+"px"; холст.style.height=В+"px";
  кт.setTransform(ДПИ,0,0,ДПИ,0,0); бк.setTransform(ДПИ,0,0,ДПИ,0,0);
  пыль=Array.from({length:70},()=>({x:Math.random()*Ш,y:Math.random()*В,
    z:.25+Math.random()*.75,r:Math.random()*1.0+.3}));
}
addEventListener("resize",размер);

const изо=(x,y,z)=>{
  const c=Math.cos(угол),s=Math.sin(угол);
  return [Ш/2+(x*c-y*s), В/2+(x*s+y*c)*.42-z*.6+18];
};
const мягко=(a,b,k)=>a+(b-a)*k;

/* Подпись всегда с тёмным ореолом: на графе она рано или поздно
   ляжет поверх яркого узла, и без ореола там будет каша. */
function подпись(g,t,x,y,цвет,размер_,жир){
  g.font=`${жир?600:400} ${размер_}px Inter,'Segoe UI',system-ui,sans-serif`;
  g.textAlign="center";
  g.shadowColor="rgba(0,0,0,.95)"; g.shadowBlur=7;
  g.fillStyle=цвет; g.fillText(t,x,y); g.fillText(t,x,y);
  g.shadowBlur=0;
}

function рисоватьСцену(g){
  g.clearRect(0,0,Ш,В);
  // Кадры начинаются раньше, чем приходят данные: холст крутится с
  // первой миллисекунды, а fetch отвечает позже. Проверка одна и в
  // самом верху — дальше по коду данные читаются свободно, и не надо
  // помнить про null в каждой строке (уже забыл однажды).
  if(!Д || !Д.люди) return;
  const люди=Д.люди;
  const R=Math.min(Ш*.31,В*.72);

  for(const p of пыль){
    const dx=(Math.cos(угол*.6)*20)*p.z;
    g.fillStyle=`rgba(170,195,225,${.06+p.z*.09})`;
    g.beginPath(); g.arc((p.x+dx+Ш)%Ш,p.y,p.r,0,7); g.fill();
  }
  g.strokeStyle="rgba(120,140,170,.16)"; g.lineWidth=1;
  g.beginPath();
  for(let i=0;i<=72;i++){
    const a=i/72*Math.PI*2, [x,y]=изо(Math.cos(a)*R,Math.sin(a)*R,0);
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();

  /* ВЛАДЕЛЕЦ В ЦЕНТРЕ (просьба владельца 25.08). Остальные — кольцами
     по кругу близости: семья ближе всех, чужие дальше всех. Это не
     красивость: расстояние на картинке должно значить расстояние в
     жизни, иначе картинка врёт о главном. */
  узлы=[];
  const круги = (Д["окружение"] && Д["окружение"]["ветки"]) || [];
  const кругЧ = ч => {
    if(ч.свой) return 0;
    const в = круги.find(x=>x.id===ч.id);
    return в ? (в["круг"]||4) : 4;
  };
  const влЧ = ч => {
    const в = круги.find(x=>x.id===ч.id);
    return (в && в["влияние"] && в["влияние"]["есть"]) ? в["влияние"] : null;
  };
  const посадка = [];
  const поКругам = {};
  люди.forEach(ч=>{ const k=кругЧ(ч); (поКругам[k]=poK(поКругам,k)).push(ч); });
  function poK(o,k){ return o[k] || (o[k]=[]); }
  Object.keys(поКругам).forEach(k=>{
    const список=поКругам[k], K=+k;
    список.forEach((ч,i)=>{
      if(K===0){ посадка.push({ч,a:0,rad:0}); return; }
      const шаг=(Math.PI*2)/Math.max(1,список.length);
      const a=i*шаг + K*0.7;                 // кольца развёрнуты друг к другу
      посадка.push({ч,a,rad:R*(0.30+K*0.17)});
    });
  });
  const порядок=посадка.sort((p,q)=>
    изо(Math.cos(p.a)*p.rad,Math.sin(p.a)*p.rad,0)[1]
   -изо(Math.cos(q.a)*q.rad,Math.sin(q.a)*q.rad,0)[1]);

  // кольца близости
  [1,2,3,4,5].forEach(K=>{
    const rr=R*(0.30+K*0.17);
    g.strokeStyle=`rgba(120,140,170,${K<=2?.14:.07})`; g.lineWidth=1;
    g.beginPath();
    for(let i=0;i<=64;i++){
      const a=i/64*Math.PI*2, [x,y]=изо(Math.cos(a)*rr,Math.sin(a)*rr,0);
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  });

  for(const {ч,a,rad} of порядок){
    const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
    const улик=(ч.весы&&ч.весы.улик)||0;
    const выс=24+Math.min(104,улик*1.3);
    const [ох,оу]=изо(x,y,0), [вх,ву]=изо(x,y,выс);
    const это=выбран===ч.id, над=наведён===ч.id;
    плавно[ч.id]=мягко(плавно[ч.id]??1, это?1.4:(над?1.16:1), .12);
    const k=плавно[ч.id], цв=цветЧ(ч);
    узлы.push({ч,x:вх,y:ву,r:56*k});

    // ВЕТВЬ К ЦЕНТРУ: цвет = влияние на владельца. Зелёная — рядом с ним
    // владелец оживает, красная — гаснет, серая — ровно или молчим.
    if(!ч.свой){
      const вл=влЧ(ч);
      const цвет = !вл ? "rgba(150,170,195,.20)"
        : (вл["вердикт"]==="оживляет" ? "rgba(94,224,138,.55)"
        : (вл["вердикт"]==="гасит" ? "rgba(255,107,107,.55)"
        : "rgba(150,170,195,.30)"));
      const [цx,цy]=изо(0,0,34);
      const [сx,сy]=изо(x*.5,y*.5,выс*.75+26);
      g.strokeStyle=цвет; g.lineWidth=вл?2:1;
      g.beginPath(); g.moveTo(цx,цy);
      g.quadraticCurveTo(сx,сy,вх,ву); g.stroke();
    }
    // стебель от пола
    g.strokeStyle="rgba(255,255,255,.16)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(ох,оу); g.lineTo(вх,ву); g.stroke();
    g.fillStyle="rgba(255,255,255,.05)";
    g.beginPath(); g.ellipse(ох,оу,20*k,7*k,0,0,7); g.fill();

    // ВЕТВИ К ДОМЕНАМ. Куст, а не клякса: белая тонкая ветвь и цветной
    // узел на конце — так видно и связь, и каждое значение по отдельности.
    ДОМЕНЫ.forEach((d,j)=>{
      const dd=(ч.домены&&ч.домены[d])||_дом(30,50,0);
      const la=a+(j/ДОМЕНЫ.length)*Math.PI*2+.28;
      const rr=(20+(dd.компетентность/100)*44)*k;
      const [px,py]=изо(x+Math.cos(la)*rr,y+Math.sin(la)*rr,выс+8);
      const [mx,my]=изо(x+Math.cos(la)*rr*.45,y+Math.sin(la)*rr*.45,выс+22);
      g.strokeStyle=`rgba(255,255,255,${.14+(dd.улик?.2:0)})`;
      g.lineWidth=1;
      g.beginPath(); g.moveTo(вх,ву);
      g.quadraticCurveTo(mx,my,px,py); g.stroke();

      const сила=Math.max(.22,dd.доверие/100);
      const рад=(2.6+Math.min(5.4,dd.улик*.28))*k;
      g.globalAlpha=сила; g.fillStyle=цв;
      g.beginPath(); g.arc(px,py,рад,0,7); g.fill();
      g.globalAlpha=1;
      g.fillStyle="rgba(255,255,255,.92)";
      g.beginPath(); g.arc(px,py,рад*.34,0,7); g.fill();
      if(это){
        подпись(g,d,px,py-рад-7,"rgba(235,243,250,.78)",10.5,false);
      }
    });

    // дуга качелей
    const в=ч.весы||{};
    const вера=(в.доверие_макс||30)/100;
    const крит=Math.min(1,(в.проверок||0)*.22+(в.минусов||0)*.05);
    const пер=Math.max(-1,Math.min(1,вера-крит));
    const тревожно=(ч.разбор||[]).some(н=>н.код!=="рано_судить");
    const rr=76*k, старт=-Math.PI/2+пер*1.15;
    g.strokeStyle=тревожно?"rgba(255,107,107,.95)":"rgba(190,210,235,.5)";
    g.lineWidth=2.4; g.lineCap="round";
    g.beginPath(); g.arc(вх,ву,rr,старт-.45,старт+.45); g.stroke();
    g.lineCap="butt";

    // ядро
    g.fillStyle=цв;
    g.beginPath(); g.arc(вх,ву,(это?9:7)*k,0,7); g.fill();
    g.fillStyle="#fff";
    g.beginPath(); g.arc(вх,ву,(это?3.6:2.8)*k,0,7); g.fill();
    if(это){
      g.strokeStyle=цв; g.globalAlpha=.5; g.lineWidth=1.2;
      g.beginPath(); g.arc(вх,ву,19*k,0,7); g.stroke(); g.globalAlpha=1;
    }

    подпись(g,ч.имя,вх,ву+90*k, это?"#ffffff":(над?"#dbe6f1":"#9fb0c2"),
            это?14:12.5, это);
    const п=ч["портрет"]||{};
    if(п.готов&&п["круг"]&&п["круг"]["как_сказать"])
      подпись(g,п["круг"]["как_сказать"],вх,ву+106*k,
              это?цв:"rgba(160,178,198,.9)",11,false);
    if(!ч.свой){
      const кк=кругЧ(ч), имена=["","семья","друзья","работа","знакомые","чужие"];
      подпись(g,имена[кк]||"",вх,ву+120*k,"rgba(130,148,170,.7)",9.5,false);
    }
  }
}

function кадр(){
  время+=1/60;
  if(вращать&&!тянем) цельУгол+=.0020;
  угол=мягко(угол,цельУгол,.09);
  рисоватьСцену(бк);
  кт.clearRect(0,0,Ш,В);
  кт.save();
  кт.filter="blur(11px)"; кт.globalCompositeOperation="lighter";
  кт.globalAlpha=.38; кт.drawImage(буф,0,0,Ш,В);
  кт.restore();
  кт.drawImage(буф,0,0,Ш,В);      // резкий слой поверх свечения
  requestAnimationFrame(кадр);
}

/* мышь: перетаскивание вращает, клик выбирает */
let жалX=0, двигали=0;
холст.addEventListener("pointerdown",e=>{тянем=true;жалX=e.clientX;двигали=0;
  холст.classList.add("тянем");холст.setPointerCapture(e.pointerId);});
холст.addEventListener("pointermove",e=>{
  const r=холст.getBoundingClientRect();
  if(тянем){const d=e.clientX-жалX;жалX=e.clientX;двигали+=Math.abs(d);
    цельУгол+=d*.006;угол=цельУгол;return;}
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  наведён=null;
  for(const у of узлы) if(Math.hypot(у.x-mx,у.y-my)<у.r) наведён=у.ч.id;
});
addEventListener("pointerup",e=>{
  if(тянем&&двигали<5){
    const r=холст.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    for(const у of узлы) if(Math.hypot(у.x-mx,у.y-my)<у.r){
      выбран=у.ч.id; рисоватьБорт();
    }
  }
  тянем=false; холст.classList.remove("тянем");
});

<script>
"use strict";
/* ═══ ИНСПЕКТОР ══════════════════════════════════════════════════
   Правая колонка собирается целиком из данных, а не правится по
   кусочкам: у панели с восемью блоками ручное обновление ветвится
   быстрее, чем успеваешь про него помнить, и однажды один блок
   показывает одного человека, а соседний — другого.            */

const esc = s => String(s??"").replace(/[&<>"]/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function цветДоверия(t,a){
  // от холодной стали к тёплому золоту, и всегда достаточно светло,
  // чтобы полоса читалась на чёрном — низкое доверие должно быть
  // видно, а не исчезать
  const h = 202 + (44-202)*Math.max(0,Math.min(1,t/100));
  return `hsla(${h},${62+t*.18}%,${46+(t/100)*22}%,${a})`;
}

/* ── круг Лири ─────────────────────────────────────────────────
   Вертикаль — кто ведёт, горизонталь — сколько тепла. Длина вектора
   прижата уверенностью: мало наблюдений — точка ближе к центру, и
   центр честно значит «ничего определённого». Именно этого ответа
   нет у типологий с четырьмя буквами.                            */
function кругЛири(пр){
  const C=115,R=92;
  const готов=пр&&пр.готов&&пр["круг"];
  const к=готов?пр["круг"]:null;
  let g=`<defs>
    <radialGradient id="gтепло" cx="72%" cy="50%">
      <stop offset="0%" stop-color="#e0b464" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#e0b464" stop-opacity="0"/></radialGradient>
    <radialGradient id="gхолод" cx="28%" cy="50%">
      <stop offset="0%" stop-color="#7fb0d8" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#7fb0d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gточка">
      <stop offset="0%" stop-color="#e0b464" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e0b464" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${C}" cy="${C}" r="${R}" fill="url(#gтепло)"/>
    <circle cx="${C}" cy="${C}" r="${R}" fill="url(#gхолод)"/>`;
  [1,.68,.36].forEach(m=>{
    g+=`<circle cx="${C}" cy="${C}" r="${R*m}" fill="none"
      stroke="${m===1?"#262d38":"#181d25"}" stroke-width="1"/>`;});
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    g+=`<line x1="${C+Math.cos(a)*R*.36}" y1="${C-Math.sin(a)*R*.36}"
      x2="${C+Math.cos(a)*R}" y2="${C-Math.sin(a)*R}" stroke="#161b23"/>`;
  }
  /* Подписи разложены по сторонам, а не «все по центру на радиусе»:
     верхние уезжают выше кольца, нижние ниже, боковые прижимаются к
     своей стороне и выравниваются по краю. Иначе строка садится на
     кольцо, а две строки одной подписи налезают друг на друга —
     ровно то, что владелец и увидел. */
  ОКТ.forEach(([имя,уг,живое])=>{
    const a=уг*Math.PI/180;
    const cx=Math.cos(a), cy=-Math.sin(a);
    const x=C+cx*R*(Math.abs(cx)>.4?1.10:1.0);
    let y=C+cy*R*(Math.abs(cy)>.4?1.16:1.0);
    const выше = cy < -0.4, ниже = cy > 0.4;
    if(выше) y-=10; if(ниже) y+=16;
    const anchor = Math.abs(cx)<.35 ? "middle" : (cx>0?"start":"end");
    const это=к&&к["октант"]===имя;
    // вслух — живое слово, термин мельче под ним: спорить надо с
    // термином, а слышать человек должен нормальный язык
    g+=`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11.5"
      fill="${это?"#ffc65c":"#94a3b4"}" ${это?'font-weight="700"':''}
      >${живое}</text>
      <text x="${x}" y="${y+13}" text-anchor="${anchor}" font-size="9"
      letter-spacing=".08em" fill="${это?"rgba(255,198,92,.65)":"#5a6878"}"
      >${имя}</text>`;
  });
  /* Подписи осей «ВЕДЁТ / УСТУПАЕТ» убраны (владелец, 25.08): их почти
     не видно, а нужного они не добавляют — «всегда главный» и «его не
     слышно» стоят ровно на этих полюсах и говорят то же самое словами.
     Дублирующая подпись это не подсказка, а шум поверх картинки. */
  if(к){
    const a=(к["угол"]||0)*Math.PI/180, д=(к["выраженность"]||0)*R;
    const x=C+Math.cos(a)*д, y=C-Math.sin(a)*д;
    const ор=14+(пр["уверенность"]||0)*26;
    g+=`<circle cx="${x}" cy="${y}" r="${ор}" fill="url(#gточка)"/>
      <line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="#e0b464"
        stroke-width="1.4" opacity=".75"/>
      <circle cx="${x}" cy="${y}" r="4.5" fill="#e0b464"/>
      <circle cx="${x}" cy="${y}" r="8" fill="none" stroke="#e0b464"
        stroke-opacity=".35"/>`;
  }else{
    g+=`<circle cx="${C}" cy="${C}" r="4" fill="#5a6878"/>`;
  }
  if(готов && к && (к["выраженность"]||0) < .18){
    // «нормис» — это ответ, а не пустота: человек без крайностей
    g+=`<text x="${C}" y="${C-14}" text-anchor="middle" font-size="12"
      font-weight="700" fill="#ffc65c">${esc(к["как_сказать"]||"")}</text>`;
  }
  return `<svg id="круг" viewBox="-56 -40 342 322">${g}</svg>`;
}

/* ── радар Big Five ─── пять осей читаются формой, а не пятью полосами:
   провал по одной оси виден силуэтом, а список цифр надо сравнивать. */
function радарБиг5(оси){
  const C=110,R=76,n=БИГ5.length;
  const есть=БИГ5.filter(о=>оси&&оси[о]!=null);
  if(есть.length<3) return "";
  let сетка="",путь="",метки="";
  [1,.66,.33].forEach(m=>{
    const pts=БИГ5.map((_,i)=>{
      const a=-Math.PI/2+i*2*Math.PI/n;
      return `${C+Math.cos(a)*R*m},${C+Math.sin(a)*R*m}`;}).join(" ");
    сетка+=`<polygon points="${pts}" fill="none" stroke="#181d25"/>`;
  });
  путь=БИГ5.map((о,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n, v=(оси[о]??50)/100;
    return `${C+Math.cos(a)*R*v},${C+Math.sin(a)*R*v}`;}).join(" ");
  БИГ5.forEach((о,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n;
    const x=C+Math.cos(a)*(R+21), y=C+Math.sin(a)*(R+21);
    сетка+=`<line x1="${C}" y1="${C}" x2="${C+Math.cos(a)*R}"
      y2="${C+Math.sin(a)*R}" stroke="#161b23"/>`;
    метки+=`<text x="${x}" y="${y+3}" text-anchor="middle" font-size="9"
      fill="#525d6b">${о.slice(0,12)}</text>
      <text x="${x}" y="${y+14}" text-anchor="middle" font-size="9.5"
      fill="#8894a4" font-variant-numeric="tabular-nums">${Math.round(оси[о]??50)}</text>`;
  });
  return `<svg id="радар" viewBox="-30 -18 280 262">${сетка}
    <polygon points="${путь}" fill="rgba(127,176,216,.16)"
      stroke="#7fb0d8" stroke-width="1.3"/>${метки}</svg>`;
}

/* ── СМЕСЬ ТЕМПЕРАМЕНТОВ ────────────────────────────────────────
   Чистых сангвиников не бывает: один ярлык — это порог, а не человек.
   Показываем доли всех четырёх, они в сумме ровно 100. Рядом, когда
   есть, — то же самое по последнему разговору: разница между «какой он
   вообще» и «какой он сегодня» ценнее любого из двух портретов. */
const ТЕМП_ЦВЕТ = {"холерик":"#ff6b6b","сангвиник":"#ffc65c",
                   "флегматик":"#63c7f5","меланхолик":"#b085ff"};
const ТЕМП_ЖИВОЕ = {"холерик":"заводится с полоборота",
  "сангвиник":"лёгкий на подъём","флегматик":"его ничем не пробить",
  "меланхолик":"всё близко к сердцу"};

function полосыТемперамента(смесь, сейчас){
  if(!смесь) return "";
  const пары=Object.entries(смесь).sort((a,b)=>b[1]-a[1]);
  const с=(сейчас&&сейчас["готов"])?сейчас["смесь"]:null;
  return `<div style="margin-top:14px">` + пары.map(([имя,знач])=>{
    const тек = с ? с[имя] : null;
    const δ = тек!=null ? тек-знач : null;
    const стрелка = (δ==null||Math.abs(δ)<4) ? "" :
      `<span style="color:${δ>0?"var(--рост)":"var(--тревога)"};font-size:11px">
        ${δ>0?"↑":"↓"}${Math.abs(Math.round(δ))}</span>`;
    return `<div class="дом" style="grid-template-columns:96px 1fr 42px">
      <span title="${ТЕМП_ЖИВОЕ[имя]||""}">${имя}</span>
      <div class="жёлоб" style="height:6px">
        <i style="width:${знач}%;background:${ТЕМП_ЦВЕТ[имя]};opacity:.85"></i>
        ${тек!=null?`<b style="left:calc(${тек}% - 1px);height:12px;top:-3px;
          background:#fff;opacity:.75"></b>`:""}
      </div>
      <span class="чис">${Math.round(знач)}%${strelkaSafe(стрелка)}</span></div>`;
  }).join("") +
  (с?`<div class="тихо" style="font-size:11.5px;margin-top:4px">
      белая риска и стрелка — как он ведёт себя В ЭТОМ разговоре
      (${сейчас["фраз"]} фраз) против того, какой он обычно</div>`
    :`<div class="тихо" style="font-size:11.5px;margin-top:4px">
      ${esc((сейчас&&сейчас["почему"])||"по этому разговору пока рано")}</div>`)
  + `</div>`;
}
function strelkaSafe(s){ return s||""; }

function блокПортрет(ч){
  const пр=(ч&&ч["портрет"])||{};
  let низ;
  if(!пр.готов){
    низ=`<div class="тихо">${esc(пр["почему"]||"портрета пока нет")}</div>
      <div class="оговорка">Пятьдесят из ста выглядит как измерение, хотя
      это отсутствие данных — поэтому здесь пусто, а не «нейтрал».</div>`;
  }else{
    const к=пр["круг"], аг=пр["агрессия"]||{};
    низ=`<div style="font-size:19px;color:#fff;font-weight:700;line-height:1.2">
        ${esc(к["как_сказать"]||к["октант"]||"середина круга")}
        <span class="метка">гипотеза</span></div>
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;
        color:var(--шёпот);margin-top:3px">${esc(к["октант"]||"")}</div>
      <div class="тихо" style="margin-top:6px">${esc(к["что_значит"])}</div>
      ${радарБиг5(пр["оси"])}
      ${полосыТемперамента(пр["смесь"], пр["сейчас"])}
      <div class="тихо" style="margin-top:8px">
        фраз ${пр["фраз"]} · уверенность ${пр["уверенность"]}</div>
      ${(аг["доля_адресной"]>0.02)?`<div class="находка" style="margin-top:10px">
        <b>адресная агрессия ${Math.round(аг["доля_адресной"]*100)}%
           из фраз</b><div class="п">${esc(аг["как_читать"]||"")}</div></div>`:""}
      <div class="оговорка">${esc(пр["оговорка"]||"")}</div>`;
  }
  return `<div class="раздел"><h2>Портрет по речи</h2>${кругЛири(пр)}${низ}</div>`;
}

/* Круг близости и влияние. Влияние всегда подписано как наблюдение о
   ВЛАДЕЛЬЦЕ: «рядом с ним ты обычно…». Если подать это как свойство
   собеседника, панель начнёт тихо ссорить человека с его окружением на
   основании совпадения, а не причины. */
const ИМЕНА_КРУГОВ=["владелец","семья","друзья","работа","знакомые","чужие"];
function блокОкружение(ч){
  const ветки=(Д && Д["окружение"] && Д["окружение"]["ветки"])||[];
  const в=ветки.find(x=>x.id===ч.id);
  if(ч.свой){
    const рядом=ветки.filter(x=>x["влияние"]&&x["влияние"]["есть"])
      .sort((p,q)=>(q["влияние"]["балл"]||0)-(p["влияние"]["балл"]||0));
    if(!рядом.length) return "";
    return `<div class="раздел"><h2>Твоё окружение</h2>
      <div class="тихо" style="margin-bottom:11px">Как меняешься ТЫ рядом
        с людьми. Наблюдение о тебе, не о них: совпадение — не причина.</div>` +
      рядом.map(x=>{
        const вл=x["влияние"], зн=вл["вердикт"]==="оживляет"?"↑"
          :(вл["вердикт"]==="гасит"?"↓":"→");
        const ц=вл["вердикт"]==="оживляет"?"var(--рост)"
          :(вл["вердикт"]==="гасит"?"var(--тревога)":"var(--шёпот)");
        return `<div class="ручстр"><span class="n">${esc(x["имя"])}
          <span class="o">${esc(ИМЕНА_КРУГОВ[x["круг"]]||"")} ·
            ${esc((вл["подробно"]||[]).join("; "))}</span></span>
          <span class="v" style="color:${ц}">${зн} ${esc(вл["вердикт"])}</span>
          </div>`;}).join("") + `</div>`;
  }
  if(!в) return "";
  const вл=в["влияние"]||{};
  const ц=вл["вердикт"]==="оживляет"?"var(--рост)"
    :(вл["вердикт"]==="гасит"?"var(--тревога)":"var(--шёпот)");
  return `<div class="раздел"><h2>Кто он тебе</h2>
    <div style="font-size:17px;color:#fff;font-weight:700">
      ${esc(ИМЕНА_КРУГОВ[в["круг"]]||"—")}
      <span class="метка">${в["назначен"]?"твои слова":"догадка"}</span></div>
    <div class="тихо" style="margin-top:5px">${esc((в["основания"]||[]).join("; "))}</div>
    ${вл["есть"]?`
      <div class="находка" style="margin-top:12px;border-left:0">
        <b style="color:${ц}">${esc(вл["словами"])}</b>
        <div class="п">${esc((вл["подробно"]||[]).join("; "))}</div>
        <div class="оговорка" style="margin-top:8px">${esc(вл["оговорка"]||"")}</div>
      </div>`
     :`<div class="тихо" style="margin-top:10px">про влияние молчу —
        ${esc(вл["почему"]||"мало данных")}</div>`}
    </div>`;
}

function блокДомены(ч){
  return `<div class="раздел"><h2>Доверие по темам</h2>` +
    ДОМЕНЫ.map(d=>{
      const dd=(ч.домены&&ч.домены[d])||{доверие:30,компетентность:50,улик:0};
      return `<div class="дом"><span>${d}</span>
        <div class="жёлоб">
          <i style="width:${dd.доверие}%;background:${цветДоверия(dd.доверие,.9)}"></i>
          <b style="left:calc(${dd.компетентность}% - 1px)"></b></div>
        <span class="чис">${dd.доверие}</span></div>`;}).join("") +
    `<div class="тихо" style="margin-top:8px;font-size:11.5px">
      полоса — доверие («не врёт ли»), риска — компетентность
      («разбирается ли»). Это разные вещи.</div></div>`;
}

/* Настоящие качели: ноль по центру, влево недоверие, вправо вера, по
   сотке в каждую сторону. Стрелка на упоре подсвечивает рамку — это
   повод усомниться не в человеке, а в собственном взгляде. */
function качелиШкала(в){
  const п=Math.max(-100,Math.min(100,+(в["перекос"]??0)));
  const лево=п<0, ширина=Math.abs(п)/2;      // 100 единиц = половина шкалы
  const цвет=лево?"var(--сталь)":"var(--свой)";
  const упор=Math.abs(п)>=70;
  const тики=[10,20,30,40,60,70,80,90].map(x=>
    `<i class="тик" style="left:${x}%"></i>`).join("");
  return `<div class="качели${упор?" упёрлась":""}">
    <div class="шкала">
      ${тики}
      <i class="упор" style="left:15%"></i><i class="упор" style="left:85%"></i>
      <i class="ось"></i>
      <i class="бар" style="left:${лево?50-ширина:50}%;width:${ширина}%;
        background:${цвет};opacity:.55"></i>
      <i class="ручкаp" style="left:${50+п/2}%;background:${цвет}"></i>
    </div>
    <div class="края">
      <span>← не верю<br><span style="opacity:.7">проверок ${Math.round(в["критика"]??0)}</span></span>
      <span style="text-align:center"><b>${п>0?"+":""}${Math.round(п)}</b><br>
        <span style="opacity:.7">перекос</span></span>
      <span style="text-align:right">верю →<br><span style="opacity:.7">доверие ${Math.round(в["вера"]??0)}</span></span>
    </div></div>`;
}

function блокКачели(ч){
  const н=ч.разбор||[];
  const в=ч.весы||{};
  return `<div class="раздел"><h2>Качели</h2>` +
    ("перекос" in в ? качелиШкала(в) : "") +
    (н.length?н.map(x=>
    `<div class="находка${x.код==="рано_судить"?" мягко":""}"
       style="${x.код==="сомнение_в_себе"?"border-color:var(--тревога)":""}">
       <b>${esc(x.код.replace(/_/g," "))}</b>
       <div class="п">${esc(x.что)}. ${esc(x.почему)}</div>
       <div class="д">→ ${esc(x.делать)}</div></div>`).join("")
    :`<div class="тихо">в равновесии</div>`) + `</div>`;
}

function блокЛента(){

      <div class="t">${esc(ф.текст)}</div>
      <div class="низ"><span class="ист">${esc(ф.источник)}</span>
        <span class="искра">${bar(ф.эмоция,"#7fb0d8")}${bar(ф.новизна,"#3a4553")}
          ${bar(s,мертва?"#d4756a":"#e0b464")}</span>
        <span class="вес">${s.toFixed(2)}</span></div></div>`;}).join("");
  return `<div class="раздел"><h2>Лента слуха</h2><div id="лента">${строки}</div>

      доживут до утра.</div></div>`;
}

function блокМетки(){
  const м=(Д&&Д.метки)||{};
  const р=(id,имя,зн,подпись)=>`<div class="руч">
    <label>${подпись} <b id="v-${id}">${(+зн).toFixed(2)}</b></label>
    <input type="range" id="r-${id}" data-ручка="${имя}" min="0" max="1"

  return `<div class="раздел"><h2>Эмоциональные метки</h2>
    <div class="тихо" style="margin-bottom:12px;font-size:11.5px">Как
      миндалина взвешивает фразу. Меняет будущее — прошлое не
      пересчитывается: оно взвешено тем, чем взвешивалось.</div>
    ${р("эм","вес_эмоции",м["эмоция"]??.45,"вес эмоции")}
    ${р("нов","вес_новизны",м["новизна"]??.35,"вес новизны")}
    ${р("бон","бонус_владельца",м["бонус_владельца"]??.3,"бонус владельца")}
    ${р("пор","порог_забвения",м["порог_забвения"]??.15,"порог забвения")}

function блокРучки(){
  const р=(Д&&Д["ручки"])||{};
  return `<div class="раздел"><h2>Ручки</h2>` +
    Object.entries(р).map(([имя,x])=>{

        <span class="n">${esc(имя)}<span class="o">${esc(x["о_чём"])}</span></span>

          ${дв?`<span class="было">← ${x["родное"]}</span>`:""}
          <span class="было" style="margin-left:6px">${сч}</span></span></div>`;
    }).join("") + `</div>`;
}

function блокСпар(){
  const с=(Д&&Д.спарринг)||{идёт:false};
  let р="";
  if(отчёт&&(отчёт.реакции||[]).length){
    р=`<div class="раздел"><h2>Калибровка</h2>
      <div class="тихо" style="margin-bottom:12px;font-size:11.5px">
        Проверялся не человек — он играл. Проверялась её реакция.

      отчёт.реакции.map(x=>`<div class="реакция" data-id="${x.id}">
        <div class="ч">[${esc(x["вид"])}] ${esc(x["описание"])}</div>
        <div class="р">ручка <b>${esc(x["ручка"])}</b> — ${esc(x["ручка_о_чём"])}
          · сейчас ${x["ручка_сейчас"]}</div>
        <div class="верд">
          <button data-в="перебор">перебор</button>
          <button data-в="в_точку">в точку</button>
          <button data-в="недобор">недобор</button>
          <button class="широкая" data-в="это_было_всерьёз">а это было всерьёз</button>
        </div></div>`).join("") + `</div>`;
  }
  return `<div class="раздел"><div id="спар" class="${с.идёт?"идёт":""}">
      <div><div style="font-size:9.5px;letter-spacing:.24em;
        text-transform:uppercase;color:var(--призрак)">Спарринг</div>
        <div class="тихо" style="margin-top:3px">${с.идёт
          ? `идёт с «${esc(с["с_кем"])}» · ${с["минут"]||0} мин · в песочнице ${с["в_песочнице"]||0}`
          : "выключен — выводы пишутся в карту как обычно"}</div></div>
      <button class="чип ${с.идёт?"тревога":""}" id="кн-спар">${
        с.идёт?"Закончить":"Включить"}</button></div></div>` + р;
}

function рисоватьБорт(){
  if(!Д) return;
  const ч=(Д.люди||[]).find(x=>x.id===выбран)||(Д.люди||[])[0];
  if(ч) выбран=ч.id;
  const в=(ч&&ч.весы)||{};
  document.getElementById("борт").innerHTML = `
    <div class="раздел">
      <div id="кто">
        <span class="точка" style="background:${ч?цветЧ(ч):"#5d6b7c"}"></span>
        <span class="имя">${esc(ч?ч.имя:"—")}</span>
        ${ч&&ч.свой?'<span class="свой">свой</span>':""}</div>
      <div id="мета">${esc(ч?ч.архетип:"")} · улик ${в.улик||0}
        · проверок ${в.проверок||0}${в["дней_с_последней_улики"]!=null
        ? ` · последняя ${в["дней_с_последней_улики"]} дн. назад`:""}</div>
    </div>
    ${ч?блокОкружение(ч):""}
    ${ч?блокПортрет(ч):""}
    ${ч?блокКачели(ч):""}
    ${ч?блокДомены(ч):""}
    ${блокСпар()}
    ${блокЛента()}
    ${блокМетки()}
    ${блокРучки()}
    <div class="раздел"><h2>Как читать сцену</h2>
      <div class="ключ">
        <div><i style="background:#ffc65c"></i><span>цвет куста — кто это;
          золотой всегда свой</span></div>
        <div><i style="background:#4cc9f0"></i><span>узел на ветке — тема:
          длина ветки это компетентность, яркость — доверие, размер —
          сколько улик</span></div>
        <div><i style="background:#ff6b6b"></i><span>дуга вокруг — качели:
          наклон это перекос веры и проверок, красная — разбор что-то
          нашёл</span></div>
        <div><i style="background:#8695a6"></i><span>высота над кругом —
          сколько она этого человека видела</span></div>
      </div></div>`;
  подключитьБорт();
  const св=(Д.сводка)||{};
  const ч2=(k,v,тревожно)=>`<div class="число${тревожно?" тревожно":""}">
    <div class="v">${v??"—"}</div><div class="k">${k}</div></div>`;
  document.getElementById("числа").innerHTML =
    ч2("сырьё",св["сырьё"]) + ч2("эпизодов",св["эпизоды"]) +
    ч2("фактов",св["факты"]) + ч2("людей",св["люди"]??(Д.люди||[]).length) +
    (св["просрочено"]?ч2("просрочек",св["просрочено"],true):"");
}

/* ── значимость: то же правило, что в writer.compute_salience ── */
const веса=()=>({
  эм:+(document.getElementById("r-эм")?.value ?? .45),
  нов:+(document.getElementById("r-нов")?.value ?? .35),
  бон:+(document.getElementById("r-бон")?.value ?? .3),
  пор:+(document.getElementById("r-пор")?.value ?? .15)});
function знач(ф,w){
  let s=ф.эмоция*w.эм+ф.новизна*w.нов;
  if(ф.источник==="owner") s+=w.бон;
  return Math.min(1,s);
}

function подключитьБорт(){
  document.querySelectorAll('#борт input[type=range]').forEach(эл=>{
    const v=document.getElementById("v-"+эл.id.slice(2));
    эл.addEventListener("input",()=>{ v.textContent=(+эл.value).toFixed(2);
      обновитьЛенту(); });
    эл.addEventListener("change",async()=>{
      try{ await fetch("/api/mind/tuning",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({"имя":эл.dataset["ручка"],"значение":+эл.value,
                             "почему":"ползунок в панели «Разум»"})});
      }catch(e){}
    });
  });
  const кн=document.getElementById("кн-спар");
  if(кн) кн.addEventListener("click",переключитьСпар);
  document.querySelectorAll("#борт .верд button").forEach(б=>{
    б.addEventListener("click",()=>калибровать(б));
  });
}

function обновитьЛенту(){
  const w=веса(), узел=document.getElementById("лента");
  if(!узел) return;
  узел.querySelectorAll(".фраза").forEach((el,i)=>{
    const ф=(Д.лента||[]).slice().reverse()[i]; if(!ф) return;
    const s=знач(ф,w), мертва=s<w.пор;
    el.classList.toggle("мертва",мертва);
    el.querySelector(".вес").textContent=s.toFixed(2);
    const b=el.querySelectorAll(".искра i")[2];
    b.style.height=Math.max(6,s*100)+"%";
    b.style.background=мертва?"#d4756a":"#e0b464";
  });
}

let отчёт=null;
async function переключитьСпар(){
  const идёт=Д&&Д.спарринг&&Д.спарринг.идёт;
  const свой=(Д.люди||[]).find(ч=>ч.свой)||(Д.люди||[])[0];
  try{
    const r=await fetch("/api/spar",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(идёт?{action:"stop"}
        :{action:"start",person_id:свой&&свой.id,"зачем":"стресс-тест из панели"})});
    const о=await r.json();
    отчёт = (идёт && о["реакции"]) ? о : null;
    if(!идёт && Д.спарринг) Д.спарринг={идёт:true,"с_кем":свой?свой.имя:"—",
      "минут":0,"в_песочнице":0};
    else if(идёт) Д.спарринг={идёт:false};
  }catch(e){
    Д.спарринг={идёт:!идёт,"с_кем":свой?свой.имя:"—","минут":0,"в_песочнице":0};
    отчёт=null;
  }
  рисоватьБорт(); if(живой) загрузить();
}

async function калибровать(б){
  const к=б.closest(".реакция");
  try{
    const r=await fetch("/api/spar",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"calibrate",id:+к.dataset.id,
        "вердикт":б.dataset["в"],"почему":"из панели «Разум»"})});
    const о=await r.json();
    к.querySelector(".р").innerHTML = о["ушло_в_карту"]
      ? "→ ушло в карту человека"
      : (о["двинулось"] ? `→ ${esc(о["ручка"])}: ${о["было"]} → ${о["стало"]}`
         : `→ ${esc(о["ручка"])}: не двигали, подтверждений ${о["подтверждений"]||1}`);
  }catch(e){ к.querySelector(".р").innerHTML="→ без сервера не применить"; }
  к.classList.add("готова");
}

/* ── данные ─────────────────────────────────────────────────── */
async function загрузить(){
  try{
    const r=await fetch("/api/mind",{cache:"no-store"});
    if(!r.ok) throw 0;
    const о=await r.json(); if(о.error) throw 0;
    Д=о; живой=true;
  }catch(e){ if(!Д) Д=ДЕМО; живой=false; }
  const чип=document.getElementById("чип-жив");
  чип.textContent=живой?"Живые данные":"Демо-данные";
  чип.classList.toggle("горит",!живой);
  рисоватьБорт();
}
document.getElementById("чип-вращ").addEventListener("click",e=>{
  вращать=!вращать; e.target.classList.toggle("горит",!вращать);});
document.getElementById("чип-жив").addEventListener("click",загрузить);

размер(); загрузить(); кадр();
setInterval(()=>{ if(живой&&!отчёт) загрузить(); },5000);
</script>
