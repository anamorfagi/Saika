<!DOCTYPE html>
<!-- =========================================================================
СОБСТВЕННЫЙ VRM-АВАТАР САЙКИ (2026-07-25) — без сторонних программ.

Рендер: three.js + @pixiv/three-vrm (официальная библиотека pixiv, лежит в
ui/vendor — работает офлайн). Физика волос/юбки — родные spring bones из
VRM-файла, three-vrm симулирует их сама (vrm.update).

Управление — напрямую от Сайки, никакого MIDI/хоткеев/фильтров ввода:
- жесты/эмоции: websocket /ws, событие {"type":"avatar_gesture","gesture":x}
  (шлёт server/avatar.py при КАЖДОМ жесте — tool-call, маркер, тон, фиджет);
- липсинк + покачивание головы: /api/audio_level (реальный RMS озвучки TTS).

Прозрачность: фон страницы прозрачный (alpha). В OBS добавь Browser-источник
на http://127.0.0.1:8765/avatar — фон будет прозрачным сам. Отдельным окном
браузера фон можно задать параметром ?bg=101318 (hex) или ?bg=green.
Параметры: ?cam=full|bust (кадр), ?bg=..., ?scale=1.0

Структура анимаций (2026-07-25, по образцу того, как это устроено у Warudo):
3 слоя — IDLE (basePose) / OVERLAY (аддитивные добавки: кив, биты, взгляд,
наклон-на-вопрос) / TRANSIENT (одноразовые GESTURES{} и .vrma-клипы). Все
переходы между позами — мягкие (экспоненциальное сглаживание в setRot/expr),
без «щелчков» при смене или окончании жеста. Подробности — в комментарии
прямо над функциями setRot/expr ниже по файлу.
========================================================================== -->

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  /* без этого браузер на телефоне перехватывает жест себе — страница

#avctl{position:fixed;right:10px;bottom:10px;display:flex;flex-direction:column;

#avctl button:active{background:rgba(145,132,217,.55);transform:scale(.92)}

     Полсекунды тишины читаются как «не нажалось», и человек жмёт второй

  #avset{position:fixed;right:56px;bottom:10px;z-index:21;display:none;

  #avset.on{display:block}

  #hint.gone{opacity:0}
  /* РЕЖИМ «НА СТОЛЕ» (2026-08-14): окно без рамки поверх всего, фон
     прозрачный. Всё, что рисует свои подложки — кнопки, подсказка —
     прячем: на рабочем столе они выглядят как мусор вокруг модели. */
  body.desk #avctl, body.desk #hint, body.desk #avset{display:none !important}
  body.desk{background:transparent !important}
  /* РАМКА ОКНА (2026-08-14). Прозрачное окно без рамки невозможно ухватить
     за край — границы не видно, целиться некуда. Рисуем её страницей, а не
     системой: у окна нет заголовка, и добавить его значило бы вернуть всё
     то, от чего мы уходили. Углы подсвечены — за них тянется размер. */
  body.desk.framed::after{content:'';position:fixed;inset:0;pointer-events:none;
    border:1px dashed rgba(170,160,255,.55);border-radius:10px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  body.desk.framed::before{content:'';position:fixed;inset:0;pointer-events:none;
    background:
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) left top/16px 2px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) left top/2px 16px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) right top/16px 2px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) right top/2px 16px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) left bottom/16px 2px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) left bottom/2px 16px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) right bottom/16px 2px no-repeat,
      linear-gradient(rgba(170,160,255,.85),rgba(170,160,255,.85)) right bottom/2px 16px no-repeat;
    border-radius:10px}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const qs = new URLSearchParams(location.search);
if (qs.get('desk')) document.body.classList.add('desk');
const hint = document.getElementById('hint');

/* ---------- сцена ---------- */
// preserveDrawingBuffer нужен, чтобы кадр можно было ПРОЧИТАТЬ после
// отрисовки (2026-08-13, зеркало для Сайки). Без него toDataURL отдаёт
// пустоту: WebGL по умолчанию сбрасывает буфер сразу после показа.
// СГЛАЖИВАНИЕ НЕ ТРОГАЕМ (2026-08-14, вторая правка за час). Сначала я
// выключил его в окне на столе ради плавности — и владелец справедливо
// спросил: «а про сглаживание мы не слышали? чё она вся лесенкой стала».
// Урок ровно тот, что записан в PHILOSOPHY.md разделом 0: за скорость
// нельзя платить тем, о чём не просили. Плавность добираем потолком
// частоты кадров — он не стоит ни одного пикселя качества.
const _DESK = new URLSearchParams(location.search).has('desk');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true,
                                          preserveDrawingBuffer:true,
                                          powerPreference:'high-performance'});

// ЗЕРКАЛО (2026-08-13, живой отказ: «посмотри на себя, опиши, как ты
// выглядишь» — она рассказывала про «зрелую женщину» и глаза, которые
// «меняются от рендеринга», глядя на аниме-девочку с зелёными глазами.
// Смотреть на себя ей было НЕЧЕМ: зрение снимает весь экран, где она себя
// не узнаёт. Теперь родительская страница может попросить кадр аватара.)
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'saika-selfie') return;
  try {
    renderer.render(scene, activeCam());  // свежий кадр, а не прошлый
    const url = renderer.domElement.toDataURL('image/jpeg', 0.85);
    (e.source || window.parent).postMessage(
      {type: 'saika-selfie-result', url: url}, '*');
  } catch (err) {
    (e.source || window.parent).postMessage(
      {type: 'saika-selfie-result', error: String(err)}, '*');
  }
});
renderer.setSize(innerWidth, innerHeight);
// РАЗРЕШЕНИЕ ТОЖЕ ВОЗВРАЩАЮ: пиксель 1:1 на экране с масштабом 125-150%
// даёт ту самую «лесенку» по контуру — сглаживание её только смягчает,
// а причина в вдвое меньшем числе точек. Считаем как везде.
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const bg = qs.get('bg');
if (bg) renderer.setClearColor(bg.match(/^[0-9a-f]{6}$/i) ? '#'+bg : bg, 1);
else renderer.setClearAlpha(0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
/* СОСТОЯНИЕ ВИДА ОБЪЯВЛЯЕМ ДО КАМЕРЫ (2026-08-14, живая ошибка:
   «Uncaught ReferenceError: Cannot access 'view' before initialization»
   — экран остался пустым). placeCamera() теперь читает углы облёта из
   view, а объявлен view был ниже по файлу: у let есть временная мёртвая
   зона, и обращение до объявления это не undefined, а падение всего
   модуля. Порядок объявлений — часть кода, а не оформление. */
//   az, el      — ОБЛЁТ КАМЕРЫ вокруг модели (азимут и высота), как в
//                  Блендере средней кнопкой: предмет стоит на месте, а ты
//                  ходишь вокруг него. Это НЕ то же, что повернуть модель;
//   rx, ry, rz  — поворот САМОЙ модели (ползунки в настройках), как
//                  вращение объекта в 3D-редакторе;
//   dist        — расстояние камеры до модели;
//   snap, ortho — шаг привязки и тип проекции.
//   ox, oy, oz  — сдвиг ВИДА (камера и её цель едут вместе, сцена
//                  «съезжает» — так пан работает в 3D-редакторах)
let view = {x:0, y:0, z:0, zoom:1, rx:0, ry:0, rz:0, snap:0, ortho:false,
            az:0, el:0, dist:0, ox:0, oy:0, oz:0, lean:0};
try{ view = Object.assign(view, JSON.parse(localStorage.saika_av_view||'{}')); }catch(e){}

const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, .1, 30);
const camMode = qs.get('cam') || 'full';
// точка, вокруг которой ходим: примерно центр фигуры
const PIVOT = new THREE.Vector3(0, 0.95, 0);
const BASE_DIST = 2.6;
function placeCamera(){
  if (camMode === 'bust'){ PIVOT.set(0, 1.3, 0); }
  // ОБЛЁТ ПО СФЕРЕ. Азимут — вокруг вертикальной оси, высота — подъём и
  // спуск. Высоту ограничиваем ±85°: на полюсе камера смотрит строго
  // сверху вниз, вектор «вверх» вырождается и картинка кувыркается.
  const r = (view.dist || (camMode === 'bust' ? 1.35 : BASE_DIST));
  const a = (view.az || 0) * Math.PI / 180;
  const el = Math.max(-85, Math.min(85, view.el || 0)) * Math.PI / 180;
  // ОСЬ ВРАЩЕНИЯ — САМА МОДЕЛЬ, А НЕ НАЧАЛО СЦЕНЫ (2026-08-14: «вращение
  // какое-то неправильное, такое ощущение, что какой-то невидимый центр
  // справа от неё»). Так и было: PIVOT стоял в нуле сцены намертво, а
  // фигуру человек до этого сдвинул мышью (view.x/y/z). Камера послушно
  // ходила вокруг пустого места, и модель уезжала по дуге — ровно то
  // ощущение «центра сбоку». Точка облёта теперь едет вместе с фигурой.
  // ЦЕЛЬ КАМЕРЫ = где стоит модель ПЛЮС сдвиг вида (2026-08-14, «шифт
  // колесико куда делось?»). Пропало оно из-за моей же предыдущей правки:
  // я привязал точку облёта к модели, а сдвиг двигал саму модель — камера
  // послушно ехала следом и держала её ровно по центру, то есть на экране
  // не происходило НИЧЕГО. Теперь у сдвига свои поля: они двигают камеру
  // вместе с целью, сцена съезжает, а облёт по-прежнему крутится вокруг
  // фигуры. Ровно как пан и орбита в любом 3D-редакторе.
  const px = PIVOT.x + (view.x || 0) + (view.ox || 0);
  const py = PIVOT.y + (view.y || 0) + (view.oy || 0);
  const pz = PIVOT.z + (view.z || 0) + (view.oz || 0);
  camera.position.set(px + r * Math.cos(el) * Math.sin(a),
                      py + r * Math.sin(el),
                      pz + r * Math.cos(el) * Math.cos(a));
  camera.lookAt(px, py, pz);
}
placeCamera();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  // в окне на столе пропорции меняют мышью постоянно — кадр обязан
  // успевать за ними, иначе модель режется на каждом растягивании
  // при растягивании окна кадр пересобираем, но ручной масштаб уже
  // сохраняется отдельно и переживает это (см. saikaFit — zoom не трогает)
  if (document.body.classList.contains('desk')) window.saikaFit &&
    window.saikaFit(false); });   // false — не трогать выставленное руками

/* ---------- позиционирование мышью (2026-07-25) ----------
   ЛКМ-драг — двигать модель (вверх/вниз/в стороны), колесо — приблизить/
   отдалить, ПКМ-драг — вертикаль камеры. Запоминается в localStorage. */
// ВРАЩЕНИЕ И ПРОЕКЦИЯ (2026-08-14, просьба владельца: «добавь возможность
// вращать её во всех осях и вращение с привязками, например по выбранному
// градусу — ну тип как в блендере, обычный плавный режим и с шагом»; и
// отдельно: «она в углу окна как будто из угла выглядывает, хотелось бы
// объёмную, но ровную проекцию»).
//   rx, ry, rz — наклон/поворот/крен модели в градусах
//   snap       — шаг привязки в градусах (0 = свободно, как раньше)
//   ortho      — ровная проекция вместо перспективной

/* ВИД В ОКНЕ НА СТОЛЕ ХРАНИТСЯ НА СЕРВЕРЕ (2026-08-14, просьба владельца
   «сделай запоминание, как было открыто окно до этого, и её положение в
   окне, масштабы там всякие»).

   Почему не localStorage, как в панели: окно на столе — отдельный профиль
   QtWebEngine, и хранилище у него временное. Панель помнила, окно забывало
   каждый запуск, и человек заново подгонял масштаб. Кладём в config рядом с
   геометрией самого окна — тогда «как было» восстанавливается целиком:
   и где окно стояло, и какого размера, и как в нём стояла модель.
   Панель при этом продолжает жить на localStorage — её трогать незачем. */
let _viewSaveT = 0;
function _pushDeskView(){
  // ОДИН ИСТОЧНИК ПРАВДЫ (2026-08-14: «у тебя буквально управление в этих
  // окнах отличается»). Так и было: панель читала вид из localStorage,
  // окно на столе — с сервера. Два хранилища, два разных состояния, и
  // выглядит это как разное управление. Теперь правда одна — серверная, а
  // localStorage остаётся запасным вариантом на случай, если сервер молчит.
  // Шлют оба окна, слушают тоже оба.
  clearTimeout(_viewSaveT);          // колесо крутят подряд — пишем не каждый щелчок
  _viewSaveT = setTimeout(() => {
    fetch('/api/avatar/desk', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({view: view})}).catch(()=>{});
  }, 400);
}
let _viewTouched = 0;              // когда вид меняли ЗДЕСЬ, руками
function saveView(){
  _viewTouched = performance.now();
  try{ localStorage.saika_av_view=JSON.stringify(view); }catch(e){}
  _pushDeskView();
}
// базовый разворот модели (его ставит VRMUtils.rotateVRM0 при загрузке) —
// пользовательский угол складывается с ним, а не подменяет
let baseRot = {x: 0, y: 0, z: 0};
const D2R = Math.PI / 180;
// угол приводим к -180..180: при шаге гранями азимут иначе уезжает в -870°,
// и ползунок в настройках (диапазон ±180) начинает показывать неправду
const norm180 = a => ((((a || 0) + 180) % 360) + 360) % 360 - 180;
/* РУЧКА К ВИДУ СНАРУЖИ (2026-08-17). Скрипт — модуль, поэтому `view`
   заперт в его области видимости, и ни стенд, ни консоль браузера до него
   не дотягивались: проверить «пережил ли вид изменение размера окна» можно
   было только глазами, а глаз этого и не ловит (сброс облёта выглядит как
   обычный вид спереди). Ручка на чтение и на правку, как window.saikaPanes
   в index.html:
       saikaView()                  — что сейчас
       saikaView({ox:0.2, az:30})   — поправить и перерисовать            */
window.saikaView = function(patch){
  if (patch){ Object.assign(view, patch); applyView(); }
  return view;
};

function applyView(){
  placeCamera();                 // облёт камеры — часть вида
  if (vrm){
    vrm.scene.position.set(view.x, view.y, view.z);
    const b = baseRot;
    vrm.scene.rotation.set(b.x + (view.rx||0)*D2R,
                           b.y + (view.ry||0)*D2R,
                           b.z + (view.rz||0)*D2R);
  }
  camera.zoom = view.zoom; camera.updateProjectionMatrix();
}

/* РОВНАЯ ПРОЕКЦИЯ (ортографическая).

   Почему «выглядывает из угла»: перспективная камера расходится лучами из
   одной точки, и всё, что стоит НЕ в центре кадра, она показывает под
   углом — видно немного сбоку и сверху/снизу. В панели это незаметно,
   потому что модель по центру. А в окне во весь экран, где фигура стоит
   сбоку, тот же эффект читается как «повернулась и выглядывает».

   Ортографическая камера лучей не расходит: предмет выглядит одинаково,
   где бы он ни стоял в кадре. Объём при этом никуда не девается — его
   даёт свет и тени, а не перспектива. Ровно то, что и просили. */
let ortho = null;
function orthoCam(){
  if (!ortho){
    ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 30);
  }
  const h = 1.9 / Math.max(0.05, view.zoom || 1);   // высота кадра в метрах
  const w = h * (innerWidth / Math.max(1, innerHeight));
  ortho.left = -w/2; ortho.right = w/2;
  ortho.top = h/2;   ortho.bottom = -h/2;
  ortho.position.copy(camera.position);
  ortho.quaternion.copy(camera.quaternion);
  ortho.updateProjectionMatrix();
  return ortho;
}
// какой камерой рисовать этот кадр
function activeCam(){ return view.ortho ? orthoCam() : camera; }

/* ВПИСАТЬ МОДЕЛЬ В ОКНО ЦЕЛИКОМ (2026-08-14).
   Владелец про окно на столе: «она обрезанная появляется и редактировать не
   могу». Причина честная: кадр подобран под панель интерфейса — она почти
   квадратная. Окно на столе узкое и высокое, при тех же настройках камеры
   в него не влезают то макушка, то ноги.
   Считаем настоящие габариты модели и подбираем расстояние камеры так,
   чтобы она помещалась вся, с небольшим полем по краям. Зовётся при
   загрузке, при смене размера окна и снаружи — из окна на столе, когда
   человек его растянул (window.saikaFit). */
/* Восстановление сохранённого вида. Если он есть — saikaFit не зовём:
   иначе подгонка перебьёт то, что человек выставил руками. */
window.saikaRestore = async function(){
  if (!_DESK) { window.saikaFit(true); return; }
  try{
    const r = await fetch('/api/avatar/desk').then(x => x.json());
    const v = r && r.view;
    if (v && typeof v.zoom === 'number'){
      view = Object.assign({x:0, y:0, z:0, zoom:1,
                            rx:0, ry:0, rz:0, snap:0, ortho:false}, v);
      applyView();
      return;                       // человек уже всё настроил — не мешаем
    }
  }catch(e){}
  window.saikaFit(true);            // первый запуск: вписываем целиком
};

window.saikaFit = function(hard){
  /* hard=true — «вписать с нуля»: зовётся только когда сохранённого вида
     нет (первый запуск). hard=false/не задан — «окно поменяло размер»:
     пересобираем кадр, но НИЧЕГО из выставленного человеком не трогаем.

     ПОЧЕМУ ПОЯВИЛСЯ ПАРАМЕТР (2026-08-17, «шифт-колесико ломается при
     масштабировании окна, а остальное нет»). Здесь стояло
     `view = {x:0, y:0, z:0, zoom: view.zoom || 1}` — присваивание ЦЕЛОГО
     объекта, которое молча выбрасывало всё, чего нет в фигурных скобках:
     сдвиг вида (ox/oy/oz), перенос модели (x/y/z), облёт (az/el), поворот
     (rx/ry/rz), шаг привязки, режим проекции. А функция висит на resize.
     Заметен из всего этого был именно сдвиг: zoom уцелевал явно, а облёт
     сбрасывался в ноль — то есть в вид спереди, который глазом от нормы
     не отличить. */
  if (!vrm) return;
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const size = box.getSize(new THREE.Vector3());
  const mid  = box.getCenter(new THREE.Vector3());
  if (!isFinite(size.y) || size.y <= 0) return;
  const vfov = camera.fov * Math.PI / 180;
  const distH = (size.y / 2) / Math.tan(vfov / 2);
  const hfov  = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const distW = (size.x / 2) / Math.tan(hfov / 2);
  const dist  = Math.max(distH, distW) * 1.12;   // поле по краям
  // РУЧНОЙ МАСШТАБ НЕ СБРАСЫВАЕМ (2026-08-14): подгонка кадра зовётся на
  // каждое изменение размера окна, и если обнулять zoom, то человек тянет
  // край рамки — и теряет то приближение модели, которое сам только что
  // выставил колесом. Подгоняем расстояние камеры, его настройку не трогаем.
  if (hard){          // только первый запуск: ставим фигуру по центру
    view.x = view.y = view.z = 0;
    view.ox = view.oy = view.oz = 0;
  }
  camera.position.set(mid.x, mid.y, mid.z + dist);
  camera.lookAt(mid.x, mid.y, mid.z);
  camera.updateProjectionMatrix();
  applyView();
};
/* КАСАНИЯ, А НЕ ТОЛЬКО МЫШЬ (2026-07-26). Было mousedown/mousemove — на
   телефоне таких событий не существует вовсе, поэтому модель нельзя было
   ни подвинуть, ни отмасштабировать: она просто торчала обрезанной по краям.
   Pointer Events покрывают мышь, палец и стилус одним кодом, а щипок двумя
   пальцами считаем сами — стандартного события для него нет. */
const clampZoom = z => Math.min(4, Math.max(0.35, z));
/* ПИКСЕЛИ -> МЕТРЫ СЦЕНЫ (2026-08-17). Было прибито число 2.2 — «столько
   примерно метров видно по высоте кадра». Оно неверно вдвое: при расстоянии
   2.6 и угле обзора 28° по высоте видно 1.30 м, а не 2.2 — поэтому сдвиг
   уезжал заметно быстрее курсора, и «поймать» модель в нужное место с
   первого раза не получалось. Считаем из того, чем реально смотрим: у
   перспективы высота кадра зависит от расстояния до модели и угла, у
   ортографии задана явно. Так сдвиг идёт ровно за рукой при любом
   расстоянии, зуме и размере окна. */
function pxToScene(){
  const zoom = view.zoom || 1;
  const H = Math.max(1, innerHeight);
  if (view.ortho) return (1.9 / zoom) / H;
  const r = view.dist || (camMode === 'bust' ? 1.35 : BASE_DIST);
  return (2 * r * Math.tan(camera.fov * Math.PI / 360) / zoom) / H;
}
const ptrs = new Map();
let pinch0 = 0, zoom0 = 1, moved = 0, lastTap = 0;
function pinchDist(){
  const a = [...ptrs.values()];
  if (a.length < 2) return 0;
  return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
}
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
addEventListener('pointerdown', e=>{
  if (e.button === 1) e.preventDefault();   // иначе браузер включит автоскролл
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, b:e.button});
  if (ptrs.size === 2){ pinch0 = pinchDist(); zoom0 = view.zoom; }
  moved = 0;
  try{ e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); }
  catch(err){}
});
/* СРЕДНЯЯ КНОПКА ОДНОЙ ФУНКЦИЕЙ (2026-08-14, «блядь, чё я в окне её
   сместить не могу»). В панели браузера события мыши приходят странице
   штатно, а в окне на столе между мышью и страницей стоит Qt со своим
   веб-движком — и середина туда доезжала не всегда. Гадать, кто именно её
   съедает (автопрокрутка Chromium, композитор, фильтр событий), можно
   долго. Поэтому логика вынесена сюда, и зовут её ДВОЕ: обычный
   pointermove в панели и Qt-окно напрямую через window.saikaNudge —
   у Qt-то средняя кнопка есть гарантированно, левой ведь окно двигается. */
function _mid(dx, dy, alt, ctrl, shift, p){
  _viewTouched = performance.now();
  const clampZ = v => Math.min(4, Math.max(0.35, v));
  if (alt){
    const ry = view.ry || 0, STEP_PX = 55;
    if (!p.alt){
      const rel = (view.az || 0) - ry;
      view.az = norm180(Math.round(rel / 90) * 90 + ry);
      const el0 = view.el || 0;
      view.el = [-85, 0, 85].reduce((a, b) =>
        Math.abs(b - el0) < Math.abs(a - el0) ? b : a);
      p.alt = {ax: 0, ay: 0};
    } else {
      p.alt.ax += dx; p.alt.ay += dy;
      while (Math.abs(p.alt.ax) >= STEP_PX){
        const d = p.alt.ax > 0 ? 1 : -1;
        p.alt.ax -= d * STEP_PX; view.az = norm180((view.az || 0) - d * 90);
      }
      while (Math.abs(p.alt.ay) >= STEP_PX){
        const d = p.alt.ay > 0 ? 1 : -1;
        p.alt.ay -= d * STEP_PX;
        const cur = [-85, 0, 85].indexOf(view.el || 0);
        view.el = [-85, 0, 85][Math.max(0, Math.min(2, (cur < 0 ? 1 : cur) + d))];
      }
    }
  } else if (ctrl){
    view.zoom = clampZ((view.zoom || 1) * (1 - dy * 0.004));
  } else if (shift){
    const kp = pxToScene();
    const right = new THREE.Vector3(), up = new THREE.Vector3(),
          fwd = new THREE.Vector3();
    camera.updateMatrixWorld();          // базис берём из СВЕЖЕЙ матрицы
    camera.matrixWorld.extractBasis(right, up, fwd);
    view.ox -= (right.x * dx - up.x * dy) * kp;
    view.oy -= (right.y * dx - up.y * dy) * kp;
    view.oz -= (right.z * dx - up.z * dy) * kp;
  } else {
    const st = Number(view.snap || 0);
    if (!p.orb) p.orb = {az: view.az || 0, el: view.el || 0};
    p.orb.az -= dx * 0.4;
    p.orb.el = Math.max(-85, Math.min(85, p.orb.el + dy * 0.4));
    const fit = v => st ? Math.round(v / st) * st : v;
    view.az = norm180(fit(p.orb.az));
    view.el = fit(p.orb.el);
  }
  applyView();
  if (window.__avPaintSet) window.__avPaintSet();
}

// состояние жеста для Qt-окна: у него нет наших ptrs
const _qtDrag = {};
window.saikaNudge = (dx, dy, alt, ctrl, shift, end) => {
  if (end){ for (const k in _qtDrag) delete _qtDrag[k]; saveView(); return; }
  _mid(dx, dy, !!alt, !!ctrl, !!shift, _qtDrag);
};

addEventListener('pointermove', e=>{
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  // РУКА ВАЖНЕЕ СИНХРОНИЗАЦИИ (2026-08-14: в окне сдвиг «не работал», хотя
  // код тот же, что в панели). Отметка «трогаю сам» ставилась только в
  // saveView, то есть при ОТПУСКАНИИ кнопки. А общий вид опрашивается раз
  // в секунду — и посреди жеста прилетал старый вид с сервера и затирал
  // всё, что человек только что провёл мышью. Со стороны это выглядит
  // ровно как «не двигается». Метим на каждом движении.
  _viewTouched = performance.now();
  if (ptrs.size >= 2){                       // щипок — масштаб
    const d = pinchDist();
    if (pinch0 > 0 && d > 0){
      view.zoom = clampZoom(zoom0 * d / pinch0);
      applyView();
    }
    return;
  }
  // СРЕДНЯЯ КНОПКА — ВРАЩЕНИЕ (2026-08-14, просьба владельца: «добавь
  // поворот через зажатое колесико» и «при шифте выравнивание по осям, как
  // блендер»). Взято именно колесо, потому что ЛКМ и ПКМ уже заняты
  // перемещением и вертикалью камеры — отбирать рабочие жесты нельзя.
  //   зажал колесо + води     — крутим: по горизонтали Y, по вертикали X
  //   + Shift                 — ось фиксируется: только та, вдоль которой
  //                             начал вести. Так поворот остаётся чистым,
  //                             без «поехало сразу в две стороны».
  //   шаг привязки из настроек применяется здесь же
  /* НАВИГАЦИЯ КАК В БЛЕНДЕРЕ (2026-08-14, третий заход — предыдущие два
     были мимо, и заслуженно). Раскладка один в один с Блендером:

       колесо зажать           — облёт вокруг модели (orbit)
       Shift + колесо зажать   — сдвиг по плоскости экрана (pan)
       Ctrl  + колесо зажать   — приблизить/отдалить (dolly)
       Alt   + колесо зажать   — ВЫРАВНИВАНИЕ ВИДА ПО БЛИЖАЙШЕЙ ОСИ
       колесо крутить          — приблизить/отдалить

     Alt — это то самое «выравнивание по осям», про которое ты говорил: в
     Блендере он подтягивает вид к ближайшему ровному ракурсу (спереди,
     сбоку, сзади, сверху). Отпустил — вид защёлкнулся ровно.

     ОТСТУПЛЕНИЕ ОДНО, СОЗНАТЕЛЬНОЕ: шаг облёта. В Блендере Ctrl+колесо —
     это зум, и он у нас тоже так работает. Но ты отдельно просил «через
     зажатый контрол все вращения с шагом», поэтому шаг привязки берётся из
     настроек ⚙: выбрал там 15° — и облёт идёт ступеньками всегда, без
     всяких модификаторов. Так обе просьбы выполняются и не спорят. */
  if (p.b === 1){
    _mid(dx, dy, e.altKey, e.ctrlKey, e.shiftKey, p);
    return;
  }
  if (!e.shiftKey) p.axis = '';
  const k = pxToScene();                      // пиксели -> метры сцены
  if (p.b === 2) camera.position.y += dy*k;   // ПКМ — вертикаль камеры
  else { view.x += dx*k; view.y -= dy*k; }
  applyView();
});
function ptrEnd(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch0 = 0;
  if (ptrs.size) return;
  saveView();
  // двойное касание = сброс вида. dblclick на телефоне не приходит, а
  // способ вернуть модель на место нужен обязательно: увёл за край —
  // иначе не найдёшь
  if (moved < 12){
    const now = performance.now();
    if (now - lastTap < 340){
      view = Object.assign(view, {x:0, y:0, z:0, zoom:1,
                                  rx:0, ry:0, rz:0, ox:0, oy:0, oz:0});
      applyView(); saveView(); flash('вид сброшен', 1200);
      if (window.__avPaintSet) window.__avPaintSet();
      lastTap = 0;
    } else lastTap = now;
  }
}
addEventListener('pointerup', ptrEnd);
addEventListener('pointercancel', ptrEnd);
addEventListener('wheel', e=>{ view.zoom = clampZoom(
  view.zoom * (e.deltaY<0 ? 1.08 : 0.925)); applyView(); saveView(); },
  {passive:true});

  async function sendDsk(patch, btn){
    // ОПТИМИСТИЧНО: показываем результат немедленно, а ответ сервера потом
    // либо подтвердит, либо поправит. Ждать ответа, чтобы перекрасить
    // кнопку, — значит делать интерфейс медленнее, чем он есть.
    Object.assign(dsk, patch.on !== undefined ? {} : patch);
    paintDsk(); paintFrame();
    if(btn){
      btn.classList.add('pending');
      setTimeout(() => btn.classList.remove('pending'), 400);
    }
    try{
      const r = await fetch('/api/avatar/desk', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(patch)}).then(x => x.json());
      Object.assign(dsk, r);
      paintDsk(); paintFrame();
      if(r.busy && !watch) watch = setInterval(pullDsk, 1500);
    }catch(e){}
  }

        ? 'rgba(145,132,217,.75)' : 'rgba(255,255,255,.16)';
      if (setBox.classList.contains('on')) paintSet();
    }
    if(b.id === 'dsk-on')    sendDsk({on: !dsk.on}, b);
    if(b.id === 'dsk-lock')  sendDsk({lock: !dsk.lock}, b);
    if(b.id === 'dsk-frame') sendDsk({frame: !dsk.frame}, b);
  });
  if(!document.body.classList.contains('desk')){
    pullDsk();

  }

  /* СИНХРОНИЗАЦИЯ ВИДА — ДЛЯ ОБОИХ ОКОН. Панель и окно на столе живут в
     разных процессах и друг о друге не знают; общее у них только сервер.
     Поэтому оба раз в секунду спрашивают «какой сейчас вид» и применяют,
     если он изменился не ими. Своё не перебиваем: две секунды после
     собственного движения мышью входящее игнорируем, иначе рука и вторая
     панель дрались бы за модель. */
  let _lastSeen = '';
  const syncView = async () => {
    try{
      const r = await fetch('/api/avatar/desk').then(x => x.json());
      if (_DESK) document.body.classList.toggle('framed', !!r.frame);
      const v = r && r.view;
      if (!v) return;
      const sig = JSON.stringify(v);
      if (sig === _lastSeen) return;
      _lastSeen = sig;
      if (performance.now() - _viewTouched < 2000) return;
      Object.assign(view, v);
      applyView();
      if (window.__avPaintSet) window.__avPaintSet();
    }catch(e){}
  };
  syncView();

    '<div class="row"><b>X</b><input type="range" id="rx" min="-180" ' +
      'max="180" step="1"><span class="val" id="rxv">0°</span></div>' +
    '<div class="row"><b>Y</b><input type="range" id="ry" min="-180" ' +
      'max="180" step="1"><span class="val" id="ryv">0°</span></div>' +
    '<div class="row"><b>Z</b><input type="range" id="rz" min="-180" ' +
      'max="180" step="1"><span class="val" id="rzv">0°</span></div>' +
    '<select id="snap">' +
      '<option value="0">плавно (без привязки)</option>' +
      '<option value="5">шаг 5°</option>' +
      '<option value="15">шаг 15°</option>' +
      '<option value="30">шаг 30°</option>' +
      '<option value="45">шаг 45°</option>' +
      '<option value="90">шаг 90°</option>' +
    '</select>' +
    '<select id="proj">' +
      '<option value="persp">перспектива (как глаз)</option>' +

    '</select>' +
    '<div style="color:#9a93c9;margin:8px 0 2px">Облёт камеры</div>' +

      'ступеньками. ' +
      'Облёт двигает камеру, поворот — саму модель: это разные вещи, как в ' +
      '3D-редакторе. ' +
      'Ровная проекция убирает эффект «выглядывает из угла»: фигура ' +
      'выглядит одинаково в любой части кадра, а объём даёт свет, ' +
      'а не перспектива.</div>';
  document.body.appendChild(setBox);
  setBox.addEventListener('pointerdown', e => e.stopPropagation());

  const $s = id => setBox.querySelector('#' + id);
  const AX = ['rx', 'ry', 'rz', 'az', 'el', 'lean'];
  function paintSet(){
    for (const a of AX){
      $s(a).value = Math.round(view[a] || 0);
      $s(a + 'v').textContent = Math.round(view[a] || 0) + '°';
    }
    $s('snap').value = String(view.snap || 0);
    $s('proj').value = view.ortho ? 'ortho' : 'persp';
    const hf = $s('hfollow');
    if (hf) hf.textContent = 'Голова следит за зрителем: '
      + (view.headFollow === false ? 'выкл' : 'вкл');

  // выбранного шага — так же ведут себя 3D-редакторы, где Ctrl «щёлкает»
  // поворот по 15°. Ноль означает прежнее свободное поведение.
  const snapTo = v => {
    const st = Number(view.snap || 0);
    return st ? Math.round(v / st) * st : v;
  };
  for (const a of AX){
    $s(a).addEventListener('input', e => {
      // осанка к сетке углов не привязывается: это плавная подстройка
      view[a] = (a === 'lean') ? Number(e.target.value)
                               : snapTo(Number(e.target.value));
      applyView(); paintSet(); saveView();
    });
  }
  $s('snap').addEventListener('change', e => {
    view.snap = Number(e.target.value);
    for (const a of AX) view[a] = snapTo(view[a] || 0);
    applyView(); paintSet(); saveView();
  });
  $s('proj').addEventListener('change', e => {
    view.ortho = e.target.value === 'ortho';
    applyView(); saveView();
  });
  $s('hfollow').addEventListener('click', () => {
    view.headFollow = (view.headFollow === false);
    $s('hfollow').textContent = 'Голова следит за зрителем: '
      + (view.headFollow === false ? 'выкл' : 'вкл');
    applyView(); saveView();
  });
  $s('rreset').addEventListener('click', () => {
    view.rx = view.ry = view.rz = view.az = view.el = 0;
    view.ox = view.oy = view.oz = 0;
    applyView(); paintSet(); saveView();
  });
  // готовые ракурсы — то же, что цифры на нумпаде в 3D-редакторе
  setBox.addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    view.az = Number(b.dataset.v); view.el = 0;
    applyView(); paintSet(); saveView();
  });
  paintSet();
  window.__avPaintSet = paintSet;   // вращение мышью двигает и ползунки

  box.addEventListener('pointerdown', e => e.stopPropagation());
  box.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    // ЧУЖИЕ КНОПКИ НЕ ТРОГАЕМ (2026-08-14, живой провал: добавил рядом
    // кнопки окна на столе — и панель погасла при первом же нажатии. У них
    // нет data-z, parseFloat(undefined) = NaN, зум становится NaN, камера
    // уезжает в никуда и модель пропадает. Раньше в этом ряду были только
    // свои три кнопки, и проверять было нечего.)
    if (!b.dataset.r && !b.dataset.z) return;
    if (b.dataset.r){
      // сбрасываем ПОЛЯ, а не подменяем объект целиком: раньше здесь
      // терялись az/el/rx/ry/rz/snap/ortho, и половина настроек молча
      // пропадала при каждом нажатии ⟳
      Object.assign(view, {x:0, y:0, z:0, zoom:1, rx:0, ry:0, rz:0,
                           az:0, el:0, ox:0, oy:0, oz:0});
      if (window.__avPaintSet) window.__avPaintSet();
    }
    else view.zoom = clampZoom(view.zoom * parseFloat(b.dataset.z));
    applyView(); saveView();
  });
})();

/* ---------- загрузка VRM (+ смена наряда, 2026-07-25) ----------
   Наряд = отдельный .vrm целиком (VRoid обычным экспортом не хранит
   несколько нарядов в одном файле) — так что «переодевание» это ПОЛНАЯ
   пересборка сцены: убираем старую vrm.scene (VRMUtils.deepDispose — чтобы
   не копить геометрию/текстуры в памяти при частых сменах), грузим новую,
   заново собираем mixer и библиотеку .vrma (клипы привязаны к конкретному
   инстансу humanoid, старые для новой модели не подходят). */
let vrm = null, mixer = null, currentOutfit = 'default', loadingModel = false;
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
loader.register(p => new VRMAnimationLoaderPlugin(p));
function loadModel(url, label, force){
  // force — смена модели из библиотеки: она может прийти, пока ещё грузится
  // предыдущая, и тогда замок молча съедал бы запрос (человек выбирает
  // модель за моделью, а на экране всё та же).
  if (loadingModel && !force) return;
  loadingModel = true;
  hint.classList.remove('gone'); hint.textContent = 'загружаю '+(label||'модель')+'…';
  loader.load(url, gltf => {
    if (vrm){ scene.remove(vrm.scene); try{ VRMUtils.deepDispose(vrm.scene); }catch(e){} }
    for (const k in animLib) delete animLib[k];   // клипы старой модели не годятся
    active = null; animAction = null;             // жест/клип старой модели не продолжаем
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.removeUnnecessaryJoints(gltf.scene);
    VRMUtils.rotateVRM0(vrm);          // VRM0.0 смотрит в -Z — разворачиваем
    // БАЗОВЫЙ РАЗВОРОТ ЗАПОМИНАЕМ (2026-08-14, живой провал: «сбросить
    // позицию — она встаёт спиной к камере»). Строкой выше библиотека
    // развернула модель на 180°, потому что VRM 0.0 смотрит в -Z. А мой
    // поворот из настроек делал rotation.set(...) — то есть ЗАТИРАЛ этот
    // разворот вместе со своим нулём. Формально «сброс в ноль», по факту —
    // спиной к человеку. Теперь пользовательский угол складывается с
    // базовым, а не подменяет его.
    // пишем в СВОЮ переменную, а не в vrm.userData: у объекта VRM такого
    // поля нет вовсе (оно есть у vrm.scene, это Object3D), и присваивание
    // роняло всю загрузку — «Cannot set properties of undefined»
    baseRot = {x: vrm.scene.rotation.x,
               y: vrm.scene.rotation.y,
               z: vrm.scene.rotation.z};
    scene.add(vrm.scene);
    mixer = new THREE.AnimationMixer(vrm.scene);
    calibrateArms();                   // куда у ЭТОЙ модели опускаются руки
    applyView();                       // сохранённая позиция/зум
    const s = parseFloat(qs.get('scale')||'1'); if (s!==1) vrm.scene.scale.setScalar(s);
    hint.textContent = 'Сайка на месте';
    setTimeout(()=>hint.classList.add('gone'), 1500);
    loadingModel = false;
    loadAnimLibrary();
  }, p => { if(p.total) hint.textContent = 'загружаю '+(label||'модель')+'… '+Math.round(p.loaded/p.total*100)+'%'; },
     e => { loadingModel = false;
       hint.classList.remove('gone');
       hint.textContent = 'модель не загрузилась: '+url+' ('+e.message+')'; });
}
function loadOutfit(name){
  name = (name||'default').toLowerCase();
  if (name === currentOutfit) return;
  currentOutfit = name;
  // базовой модели анти-кэш нужен по той же причине, что и при смене
  // модели: адрес один, файл за ним разный
  loadModel(name === 'default'
              ? '/avatar/model.vrm?v='+Date.now()
              : '/avatar/outfits/'+encodeURIComponent(name)+'.vrm',
            'наряд «'+name+'»', true);
}
/* ---------- ЧТО СЕЙЧАС НАДЕТО: 3D или 2D (2026-07-26) ----------
   Библиотека аватаров держит и плоские модели. Спрашиваем сервер, кто
   надет, и включаем соответствующий путь. 3D работает ровно как раньше —
   ни строчки его логики не тронуто. */
const flat = document.getElementById('flat');
const flatImg = document.getElementById('flat-img');
let mode = '3d', flatCfg = {sway: 1, breath: 1};

async function applyCurrent(){
  let cur = null;
  try{ cur = await (await fetch('/api/avatar/current')).json(); }
  catch(e){ cur = null; }
  const st = (cur && cur.settings) || {};
  flatCfg.sway = st['avatar.2d.sway'] != null ? +st['avatar.2d.sway'] : 1;
  flatCfg.breath = st['avatar.2d.breath'] != null ? +st['avatar.2d.breath'] : 1;
  const want = (cur && cur.kind) || '3d';
  // ?v= — у модели один и тот же адрес, а файл за ним меняется; без метки
  // браузер показывал бы прежнюю из кэша
  const bust = '?v=' + Date.now();
  if (want === '2d'){
    mode = '2d';
    flat.classList.add('on');
    renderer.domElement.style.display = 'none';
    // ?v= — чтобы после смены модели браузер не показал прежнюю из кэша
    flatImg.src = '/avatar/sprite' + bust;
    hint.textContent = 'Сайка на месте (2D)';
    setTimeout(()=>hint.classList.add('gone'), 1200);
  } else {
    mode = '3d';
    flat.classList.remove('on');
    renderer.domElement.style.display = '';
    // сменили базовую модель — наряд «default» снова актуален, иначе
    // loadOutfit('default') решил бы, что менять нечего
    currentOutfit = 'default';
    loadModel('/avatar/model.vrm' + bust, (cur && cur.name) || 'модель', true);
  }
}
applyCurrent();

/* Процедурная «физика» плоского аватара. Настоящей симуляции костей у
   картинки быть не может — есть один спрайт. Но дыхание в покое и отклик
   на собственный голос дают ровно тот эффект живости, ради которого
   физику и просят: она перестаёт быть наклейкой. */
let flatPhase = 0;
function flatTick(dt){
  if (mode !== '2d') return;
  flatPhase += dt;
  const lvl = audioLevel || 0;
  const breath = Math.sin(flatPhase * 1.1) * 0.006 * flatCfg.breath;
  const talk = Math.sin(flatPhase * 9.5) * lvl * 0.012 * flatCfg.sway;
  const lean = Math.sin(flatPhase * 0.55) * 0.7 * flatCfg.sway
             + lvl * 1.4 * flatCfg.sway;
  const rise = -lvl * 6 * flatCfg.sway;
  flatImg.style.transform =
    'translateY(' + rise.toFixed(2) + 'px) rotate(' + lean.toFixed(2) + 'deg)' +
    ' scale(' + (1 + breath + talk).toFixed(4) + ')';
}

/* ---------- БИБЛИОТЕКА АНИМАЦИЙ (.vrma) ----------
   Файлы кладутся в models/avatar/anims/*.vrma (сервер отдаёт список).
   Имя файла = имя анимации: wave.vrma перекрывает процедурный wave,
   dance.vrma становится новым жестом «dance» — Сайка может звать его через
   avatar_action или маркером [жест:dance] без единой правки кода. */
const animLib = {};        // name -> THREE.AnimationClip
let animAction = null;     // текущее проигрываемое действие
async function loadAnimLibrary(){
  try{
    const names = await (await fetch('/avatar/anims')).json();
    for (const n of names){
      try{
        const g = await loader.loadAsync('/avatar/anims/'+encodeURIComponent(n));
        const va = g.userData.vrmAnimations && g.userData.vrmAnimations[0];
        if (va){ animLib[n.replace(/\.vrma$/i,'').toLowerCase()] =
                   createVRMAnimationClip(va, vrm); }
      }catch(e){ console.warn('anim', n, e); }
    }
    const ks = Object.keys(animLib);
    console.log('Библиотека анимаций:', ks.join(', '));
    // видимая диагностика (2026-07-25): показываем, что реально загрузилось,
    // прямо на странице — консоль у владельца не всегда открыта
    flash(ks.length ? ('анимации: '+ks.join(', ')) : 'анимации: пусто (файлы не загрузились)', 5000);
  }catch(e){ flash('библиотека анимаций не прочиталась: '+e, 6000); }
}
/* показать текст в #hint на время */
let flashTimer = null;
function flash(msg, ms){
  hint.classList.remove('gone'); hint.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>hint.classList.add('gone'), ms||2000);
}
function playClip(name){
  const clip = animLib[name];
  if (!clip || !mixer) return false;
  if (animAction) animAction.fadeOut(0.3);
  animAction = mixer.clipAction(clip);
  animAction.reset().setLoop(THREE.LoopOnce).fadeIn(0.2).play();
  animAction.clampWhenFinished = false;
  flash('▶ '+name+' ('+clip.duration.toFixed(1)+'с)', 1800);
  setTimeout(()=>{ if(animAction){animAction.fadeOut(0.4); animAction=null;} },
             clip.duration*1000 - 200);
  return true;
}
/* РУЧНОЙ ТЕСТ (2026-07-25): клавиши прямо на странице аватара, мимо всей
   цепочки ЛЛМ/сервера — чтобы сразу понять, где обрыв, если жесты «молчат»:
   A — следующая скачанная .vrma-анимация, G — следующий процедурный жест */
let _ai = 0, _gi = 0;
addEventListener('keydown', e=>{
  if (e.key==='a' || e.key==='A' || e.key==='ф' || e.key==='Ф'){
    const ks = Object.keys(animLib);
    if (!ks.length){ flash('библиотека пуста — нечего играть', 2500); return; }
    play(ks[_ai++ % ks.length]);
  } else if (e.key==='g' || e.key==='G' || e.key==='п' || e.key==='П'){
    const ks = Object.keys(GESTURES);
    const n = ks[_gi++ % ks.length];
    flash('жест: '+n, 1500); play(n);
  }
});

/* ---------- утилиты позы: setRot/expr — МЯГКИЕ (2026-07-25) ----------
   Раньше setRot/expr писали значение мгновенно (.rotation.set / setValue) —
   смена или конец жеста были «щелчком». Теперь это низкочастотный фильтр:
   каждый кадр значение подтягивается к цели на долю ROT_K/EXPR_K (считаются
   из dt в loop(), время сходимости ~90-110мс). Работает без снапшотов,
   потому что idle (basePose) пишет кость ПЕРВОЙ каждый кадр — переходу
   всегда есть «откуда» тянуться, что бы ни включилось поверх. */
const R = THREE.MathUtils.degToRad;
function bone(name){ return vrm && vrm.humanoid ? vrm.humanoid.getNormalizedBoneNode(name) : null; }
let ROT_K = 1, EXPR_K = 1;      // пересчитываются каждый кадр в loop() из dt

/* ГДЕ У ЭТОЙ МОДЕЛИ «РУКИ ОПУЩЕНЫ» (2026-07-27, четвёртый заход).

   Вся поза рук построена поворотом плеча по Z: +66° опускает левую руку из
   T-позы, −64° правую. На нашей модели это верно, но чужие VRM собирают
   нормализованный риг по-разному, и тот же поворот у них задирает руки
   вверх или разводит в стороны. Поэтому покой не угадываем, а МЕРЯЕМ.

   Третий заход мерял «кисть ниже плеча и как можно ближе к телу» — и
   выбирал угол, при котором руки ПРИЖАТЫ и уходят внутрь корпуса: у нашей
   модели он давал 92° вместо 66°, предплечья тонули в юбке. Ошибка была в
   самой мерке: «ближе к телу» — это не покой, это «внутрь тела». Плюс
   направление подъёма мерялось по высоте кисти ровно в точке, где кисть
   ниже всего, — там обе стороны дают одинаковый ответ, и знак выпадал
   случайно (у нас −1, то есть все жесты шли зеркально).

   Меряем не «прижатость», а ОТВЕДЕНИЕ руки: угол между «плечо → кисть» и
   вертикалью вниз, в сторону от тела. Это геометрия позы, она одинакова на
   любом риге. У опущенной руки отведение маленькое, но НЕ нулевое: на
   авторской модели угол +66° даёт 24° слева и 26° справа (замерено прямой
   рукой, локоть в нуле) — это и есть цель перебора. На нашей модели перебор
   возвращает ровно авторские 66/−64 (поза не меняется ни на пиксель), на
   чужом риге — тот угол, который даёт ТУ ЖЕ позу.

   Направление подъёма берём по тому же отведению: оно меняется с углом
   монотонно, в отличие от высоты кисти, — знак больше не выпадает случайно.

   Дальше всё авторское остаётся как есть: поза считается как смещение от
   авторского покоя, наложенное на измеренный. Локоть и кисть не трогаем
   вообще — у них покой ноль, а ноль одинаков в любой системе координат.
   Перебор идёт один раз на загрузку модели. */
const REST_AUTH   = {leftUpperArm: 66, rightUpperArm: -64};
const REST_ABDUCT = {leftUpperArm: 24, rightUpperArm:  26};  // градусы отведения
let armRest = null, armDir = 1;

function calibrateArms(){
  armRest = null; armDir = 1;
  if (!vrm || !vrm.humanoid) return;
  const H = vrm.humanoid;
  const sh = new THREE.Vector3(), hd = new THREE.Vector3(), hp = new THREE.Vector3();
  const out = {};
  try{
    const rawHips = H.getRawBoneNode('hips');
    // отведение руки при повороте плеча на deg: 0° — рука строго вниз,
    // больше — сильнее отведена от тела вбок
    const abduct = (b, rawU, rawH, sOut, deg) => {
      b.rotation.set(0, 0, R(deg));
      H.update();
      vrm.scene.updateWorldMatrix(true, true);
      rawU.getWorldPosition(sh); rawH.getWorldPosition(hd);
      const down = sh.y - hd.y;                  // >0 — кисть ниже плеча
      const outw = (hd.x - sh.x) * sOut;         // >0 — кисть отведена от тела
      return {down, ang: Math.atan2(outw, down) * 57.2958};
    };
    for (const side of ['left', 'right']){
      const name = side + 'UpperArm';
      const b = bone(name);
      const rawU = H.getRawBoneNode(name);
      const rawH = H.getRawBoneNode(side + 'Hand')
                || H.getRawBoneNode(side + 'LowerArm');
      if (!b || !rawU || !rawH) return;          // риг без сырых костей
      const save = b.rotation.clone();
      rawU.getWorldPosition(sh);
      if (rawHips) rawHips.getWorldPosition(hp); else hp.set(0, 0, 0);
      const sOut = (sh.x - hp.x) >= 0 ? 1 : -1;  // куда от тела смотрит это плечо
      let best = REST_AUTH[name], bestScore = Infinity;
      const scan = (from, to, step) => {
        for (let deg = from; deg <= to; deg += step){
          const m = abduct(b, rawU, rawH, sOut, deg);
          if (m.down <= 0) continue;             // кисть выше плеча — не покой
          const score = Math.abs(m.ang - REST_ABDUCT[name]);
          if (score < bestScore){ bestScore = score; best = deg; }
        }
      };
      scan(-170, 170, 5);                        // грубо по всему кругу
      const c = best; scan(c - 5, c + 5, 1);     // и точно вокруг найденного
      // почти авторский угол — берём авторский: у своей модели поза
      // обязана совпасть с ручной подгонкой в точности
      if (Math.abs(best - REST_AUTH[name]) <= 3) best = REST_AUTH[name];
      out[name] = R(best);
      if (side === 'left'){
        // куда рука поднимается: у автора её поднимает УМЕНЬШЕНИЕ z, то есть
        // при меньшем z отведение больше
        const lo = abduct(b, rawU, rawH, sOut, best - 10).ang;
        const hi = abduct(b, rawU, rawH, sOut, best + 10).ang;
        armDir = (lo > hi) ? 1 : -1;
      }
      b.rotation.copy(save);
    }
    H.update();
  }catch(e){
    armRest = null;
    return;                                     // остаёмся на авторских
  }
  armRest = out;
  console.log('avatar: покой рук', Math.round(out.leftUpperArm * 57.3),
              Math.round(out.rightUpperArm * 57.3), 'направление', armDir);
}

function setRot(name, x, y, z){
  // Плечо: авторскую позу пересчитываем на измеренный покой этой модели.
  // Локоть и кисть не трогаем — там покой ноль в любой системе координат.
  if (armRest && REST_AUTH[name] !== undefined){
    z = armRest[name] + (z - R(REST_AUTH[name])) * armDir;
  }
  const b = bone(name); if (!b) return;
  if (ROT_K >= 0.999){ b.rotation.set(x, y, z); return; }
  b.rotation.set(b.rotation.x + (x-b.rotation.x)*ROT_K,
                 b.rotation.y + (y-b.rotation.y)*ROT_K,
                 b.rotation.z + (z-b.rotation.z)*ROT_K);
}
// точечная версия для мест, где меняется только одна ось (пальцы) —
// напрямую на bone-объекте, а не по имени (уже вызван bone() снаружи)
function blendAxis(b, axis, v){ if (!b) return; b.rotation[axis] += (v-b.rotation[axis])*ROT_K; }
// АДДИТИВНЫЙ оверлей поверх сглаженной базы (фикс 2026-07-25): раз setRot
// теперь фильтр (тянет к цели на ROT_K за кадр), прямое `+= v` каждый кадр
// НЕ рассасывается и копится до v/ROT_K (~6-кратно!) — из-за этого голова
// «выкручивалась» при сдвиге модели и моталась на отводах взгляда.
// addAx добавляет v*ROT_K: равновесие ровно base+v, переход мягкий.
const addAx = (b, axis, v)=>{ if (b) b.rotation[axis] += v*ROT_K; };
// эмоции жестов (happy/angry/sad/relaxed) сглаживаются так же, а те, что
// текущий жест БОЛЬШЕ не трогает — сами угасают в 0 (декей-проход в loop);
// липсинг (aa/ih/ou) и моргание уже сглажены собственной огибающей — их
// пишем мгновенно, чтобы не задваивать фильтрацию
const GESTURE_EXPRS = ['happy','angry','sad','relaxed'];
const INSTANT_EXPRS = ['aa','ih','ou','blink','blinkLeft','blinkRight'];
const exprCur = {}; let exprTouched = new Set();
function expr(name, v){
  if (GESTURE_EXPRS.includes(name)) exprTouched.add(name);
  const cur = exprCur[name] || 0;
  const nv = INSTANT_EXPRS.includes(name) ? v : cur + (v-cur)*EXPR_K;
  exprCur[name] = nv;
  try{ vrm.expressionManager.setValue(name, nv); }catch(e){}
}
// плавные помощники
const ease = t => t<0 ? 0 : t>1 ? 1 : t*t*(3-2*t);
const pulse = (t, at, w) => Math.max(0, 1 - Math.abs(t-at)/w);   // треугольный имп.

/* ---------- ЖИВОЕ ТЕЛО (2026-07-25, по механикам аниматоров) ----------
   1) ПЕРЕНОС ВЕСА: живой человек не качается синусоидой — он раз в
      6-20 секунд плавно МЕНЯЕТ СТОЙКУ (вес на другую ногу, разворот
      корпуса, наклон головы) и держит её. Стойка — случайная цель,
      переход — с ease-in/out ~0.9с.
   2) Дыхание/микрокачание — поверх стойки, малой амплитудой.
   3) Голова частично следует за взглядом (см. блок взгляда ниже). */
let stance = {a:{wx:0,hy:0,sy:0,ht:0,hp:0}, b:{wx:0,hy:0,sy:0,ht:0,hp:0},
              t0:0, next:4};
function pickStance(t){
  stance.a = sampleStance(t);
  stance.b = {wx:(Math.random()*2-1)*R(4),   // вес: крен таза
              hy:(Math.random()*2-1)*R(9),   // разворот таза
              sy:(Math.random()*2-1)*R(6),   // разворот корпуса
              ht:(Math.random()*2-1)*R(6),   // наклон головы
              hp:(Math.random()*2-1)*R(3)};  // кив головы
  stance.t0 = t; stance.next = t + 6 + Math.random()*14;
}
function sampleStance(t){
  const p = ease((t-stance.t0)/0.9), a=stance.a, b=stance.b, o={};
  for (const k in a) o[k] = a[k]+(b[k]-a[k])*p;
  return o;
}
function basePose(t, amp){
  if (t > stance.next) pickStance(t);
  const s = sampleStance(t);
  // РУКИ (2026-07-25, «как робот» — фикс): у живого человека руки не
  // прямые по швам — локти чуть согнуты ВПЕРЁД, кисти развёрнуты к бедру,
  // плечи слегка вперёд, левая/правая несимметричны и медленно дрейфуют
  const dL = Math.sin(t*0.37)*0.012, dR = Math.sin(t*0.29+2)*0.012;
  setRot('leftUpperArm',  R(6)+dL, R(4),  R(66) + Math.sin(t*1.1)*0.03 - s.wx*0.5);
  setRot('rightUpperArm', R(8)+dR,-R(4), -R(64) - Math.sin(t*1.1+1)*0.03 - s.wx*0.5);
  setRot('leftLowerArm',  -R(14)+dL*2, R(6),  R(6));   // локоть согнут вперёд
  setRot('rightLowerArm', -R(18)+dR*2,-R(6), -R(6));
  setRot('leftHand',  R(5), 0,  R(10));                // кисть расслаблена
  setRot('rightHand', R(5), 0, -R(12));
  setRot('leftShoulder', 0, 0,  R(3));
  setRot('rightShoulder',0, 0, -R(3));
  // пальцы слегка подогнуты (раскрытая «лопата» — главный признак робота)
  // blendAxis — не .set() напрямую, иначе пальцы «щёлкают» при переходе
  // idle <-> жест, где пальцы задействованы (например point)
  for (const side of ['left','right']){
    const sign = side==='left' ? 1 : -1;
    for (const f of ['Index','Middle','Ring','Little'])
      ['Proximal','Intermediate','Distal'].forEach((seg,i)=>{
        blendAxis(bone(side+f+seg), 'z', sign*R(12 + i*6));
      });
    const th = bone(side+'ThumbProximal') || bone(side+'ThumbMetacarpal');
    blendAxis(th, 'y', sign*R(10));
  }
  // ЗАМИРАНИЕ (2026-07-25, «дерево на ветру» — фикс): живой человек
  // держит стойку почти НЕПОДВИЖНО, движется только дыхание; смена позы —
  // дискретная (pickStance), а не вечное качание. Синусы урезаны втрое.
  setRot('hips', 0, s.hy + Math.sin(t*0.23)*0.005, s.wx + Math.sin(t*0.45)*0.004);
  setRot('spine', Math.sin(t*0.8)*0.006 + amp*0.45, s.sy, -s.wx*0.6);
  setRot('chest', amp*0.8, s.sy*0.4, 0);
  setRot('neck', s.hp*0.5, -s.hy*0.5, 0);      // голова компенсирует корпус
  setRot('head', s.hp + Math.sin(t*0.35+1)*0.008, -s.sy*0.4, s.ht);
}

/* ---------- жесты: процедурные мини-анимации ---------- */
/* каждый жест = функция(p) где p:0..1 — прогресс; возвращать нечего,
   она докручивает кости/выражения ПОВЕРХ basePose */
const GESTURES = {
  joy:     {dur:2.6, fn:p=>{ expr('happy', ease(p*3)* (1-ease((p-0.75)*4)));
             setRot('head', -R(6)*Math.sin(p*Math.PI), 0, R(4)*Math.sin(p*Math.PI*2)); }},
  angry:   {dur:2.6, fn:p=>{ expr('angry', ease(p*3)*(1-ease((p-0.75)*4)));
             setRot('head', R(4)*Math.sin(p*Math.PI), 0, 0); }},
  sorrow:  {dur:3.0, fn:p=>{ expr('sad', ease(p*3)*(1-ease((p-0.8)*5)));
             setRot('head', R(10)*Math.sin(p*Math.PI), 0, 0);
             setRot('spine', R(4)*Math.sin(p*Math.PI), 0, 0); }},
  fun:     {dur:2.4, fn:p=>{ expr('relaxed', ease(p*3)*(1-ease((p-0.75)*4)));
             expr('blinkLeft', pulse(p, .45, .18));
             setRot('head', 0, 0, R(9)*Math.sin(p*Math.PI)); }},
  wave:    {dur:2.6, fn:p=>{ const a = ease(p*2.5)*(1-ease((p-0.8)*5));
             setRot('rightUpperArm', 0, 0, -R(68)+R(115)*a);
             setRot('rightLowerArm', 0, R(20)*a, R(35)*a + R(28)*a*Math.sin(p*22));
             expr('happy', a*0.6); }},
  good:    {dur:2.2, fn:p=>{ const a = ease(p*3)*(1-ease((p-0.7)*4));
             setRot('head', R(11)*Math.sin(p*Math.PI*1.5)*a, 0, 0);
             expr('happy', a*0.45); }},
  nodding: {dur:1.8, fn:p=>{ setRot('head', R(13)*Math.abs(Math.sin(p*Math.PI*2)), 0, 0); }},
  shaking: {dur:1.8, fn:p=>{ setRot('head', 0, R(14)*Math.sin(p*Math.PI*3), 0); }},
  clap:    {dur:2.8, fn:p=>{ const a = ease(p*3)*(1-ease((p-0.8)*6));
             const c = Math.abs(Math.sin(p*Math.PI*5));         // хлопки
             setRot('leftUpperArm', -R(45)*a, R(25)*a,  R(68)-R(48)*a);
             setRot('rightUpperArm',-R(45)*a,-R(25)*a, -R(68)+R(48)*a);
             setRot('leftLowerArm', 0,  R(55)*a - R(12)*c*a, 0);
             setRot('rightLowerArm',0, -R(55)*a + R(12)*c*a, 0);
             expr('happy', a*0.7); }},
  idle1:   {dur:3.4, fn:p=>{ const a=Math.sin(p*Math.PI);        // переминание
             setRot('hips', 0, 0, R(4)*Math.sin(p*Math.PI*2));
             setRot('spine', 0, R(6)*a, R(3)*Math.sin(p*Math.PI*2)); }},
  idle2:   {dur:3.6, fn:p=>{ const a=ease(p*2.2)*(1-ease((p-0.72)*4));  // потянуться
             setRot('leftUpperArm', -R(30)*a, 0,  R(68)-R(100)*a);
             setRot('rightUpperArm',-R(30)*a, 0, -R(68)+R(100)*a);
             setRot('spine', -R(6)*a, 0, 0); setRot('head', -R(8)*a, 0, 0);
             expr('relaxed', a*0.5); }},
  reset:   {dur:0.6, fn:p=>{}},
  /* --- стрим-набор реакций (2026-07-25): первая версия процедурно,
         потом любую можно перекрыть файлом models/avatar/anims/<имя>.vrma --- */
  dance:   {dur:5.0, fn:p=>{ const b=p*Math.PI*8;      // простые «качели»
             setRot('hips', 0, R(10)*Math.sin(b*0.5), R(6)*Math.sin(b));
             setRot('spine', R(4)*Math.sin(b+1), R(8)*Math.sin(b*0.5), 0);
             setRot('leftUpperArm', -R(35)*Math.abs(Math.sin(b*0.5)), 0,  R(68)-R(70)*Math.abs(Math.sin(b*0.5+1)));
             setRot('rightUpperArm',-R(35)*Math.abs(Math.sin(b*0.5+Math.PI)), 0, -R(68)+R(70)*Math.abs(Math.sin(b*0.5+2)));
             setRot('head', 0, 0, R(8)*Math.sin(b));
             expr('happy', 0.6); }},
  shy:     {dur:3.4, fn:p=>{ const a=ease(p*2.5)*(1-ease((p-0.75)*4));  // смущение
             setRot('head', R(14)*a, R(18)*a, 0);
             setRot('spine', R(5)*a, R(8)*a, 0);
             setRot('leftUpperArm', 0, 0, R(68)-R(25)*a);
             setRot('leftLowerArm', -R(70)*a, R(40)*a, 0);   // ручка к лицу
             expr('sad', a*0.3); expr('happy', a*0.35); }},
  cringe:  {dur:3.0, fn:p=>{ const a=ease(p*3)*(1-ease((p-0.75)*4));
             setRot('spine', -R(9)*a, R(6)*a, 0);            // отпрянула
             setRot('head', -R(6)*a, R(14)*a, R(5)*a);
             setRot('leftUpperArm', -R(20)*a, 0, R(68)-R(15)*a);
             expr('angry', a*0.35); expr('sad', a*0.3); }},
  rage:    {dur:3.0, fn:p=>{ const a=ease(p*4)*(1-ease((p-0.8)*5));
             expr('angry', a);
             setRot('head', R(6)*a, 0, R(3)*Math.sin(p*Math.PI*10)*a);  // трясётся
             setRot('leftUpperArm', 0, 0,  R(68)-R(20)*a);
             setRot('rightUpperArm',0, 0, -R(68)+R(20)*a);
             setRot('leftLowerArm',  -R(60)*a, 0, 0);        // кулачки сжаты
             setRot('rightLowerArm', -R(60)*a, 0, 0);
             setRot('spine', R(4)*a, 0, 0); }},
  cute:    {dur:3.2, fn:p=>{ const a=ease(p*2.5)*(1-ease((p-0.75)*4));  // милота
             setRot('head', R(4)*a, 0, R(14)*a);             // наклон головы
             setRot('leftUpperArm', -R(30)*a, R(30)*a,  R(68)-R(35)*a);
             setRot('rightUpperArm',-R(30)*a,-R(30)*a, -R(68)+R(35)*a);
             setRot('leftLowerArm',  -R(80)*a, R(30)*a, 0);  // ручки вместе
             setRot('rightLowerArm', -R(80)*a,-R(30)*a, 0);
             expr('happy', a*0.9); }},
  /* --- разговорные жесты (co-speech, 2026-07-25) ---
     «ask» отсюда убрана — теперь это отдельный OVERLAY-слой (askCue в
     play()/loop()), потому что наклон-на-вопрос не должен занимать общий
     слот `active` и блокировать другие жесты/биты во время речи. */
  point:   {dur:2.6, fn:p=>{ const a=ease(p*3)*(1-ease((p-0.78)*5));     // «вот!»
             // правая рука вперёд, указательный вытянут, остальные в кулак
             setRot('rightUpperArm', -R(62)*a, -R(12)*a, -R(64)+R(52)*a);
             setRot('rightLowerArm', -R(10)*a, -R(18)*a, 0);
             setRot('rightHand', 0, 0, -R(4));
             for (const f of ['Middle','Ring','Little'])
               ['Proximal','Intermediate','Distal'].forEach((seg,i)=>{
                 blendAxis(bone('right'+f+seg), 'z', -R(70+i*8)*a); });
             blendAxis(bone('rightIndexProximal'), 'z', -R(2));
             blendAxis(bone('rightIndexIntermediate'), 'z', -R(2));
             setRot('head', R(2)*a, -R(4)*a, 0);
             expr('happy', a*0.3); }},
  tired:   {dur:4.0, fn:p=>{ const a=ease(p*2)*(1-ease((p-0.8)*5));     // усталость
             setRot('spine', R(10)*a, 0, 0);                 // ссутулилась
             setRot('head', R(16)*a, 0, R(4)*Math.sin(p*Math.PI*2)*a);
             setRot('leftUpperArm', 0, 0,  R(72));
             setRot('rightUpperArm',0, 0, -R(72));
             expr('relaxed', a*0.6); expr('sad', a*0.25); }},
};
let active = null, activeT0 = 0;
let askCue = {t0: -9};   // OVERLAY «наклон на вопрос» — независимый слот, см. loop()
function play(name){
  name = (name||'').toLowerCase();
  if (!vrm) return;
  if (playClip(name)) { active = null; return; }   // .vrma в приоритете
  if (name === 'ask'){ askCue.t0 = performance.now()/1000; return; }  // оверлей, active не занимает
  const g = GESTURES[name];
  if (!g) return;
  active = g; activeT0 = performance.now()/1000;   // старые эмоции сами угаснут (декей в loop)
}

/* Клик внутри окна аватара — сообщаем главной странице, чтобы она закрыла
   свои выпадающие меню. Из iframe события мыши наружу не всплывают. */
addEventListener('pointerdown', ()=>{
  try{ if (parent !== window) parent.postMessage({saika:'pointerdown'}, '*'); }
  catch(e){}
}, true);

/* ---------- связь с Сайкой ---------- */
function connectWS(){
  const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onmessage = ev => { try{
    const m = JSON.parse(ev.data);
    if (m.type === 'avatar_gesture'){ flash('жест от Сайки: '+m.gesture, 1500); play(m.gesture); }
    else if (m.type === 'avatar_outfit') loadOutfit(m.outfit);
    // сменили модель или покрутили ручки в панели — перечитываем, что надето
    else if (m.type === 'avatar_reload') applyCurrent();
    else if (m.type === 'avatar_settings'){
      if (m['avatar.2d.sway'] != null) flatCfg.sway = +m['avatar.2d.sway'];
      if (m['avatar.2d.breath'] != null) flatCfg.breath = +m['avatar.2d.breath'];
    }
  }catch(e){} };
  ws.onclose = ()=> setTimeout(connectWS, 2000);   // сервер перезапустили — переподключаемся
  ws.onerror = ()=> ws.close();
}
connectWS();

/* липсинк: реальный уровень TTS-звука -> рот 'aa' + лёгкий кив головы */
let audioLevel = 0, audioTs = 0, bcTs = 0;
/* основной источник — BroadcastChannel из главной страницы UI: там уровень
   снимается AnalyserNode'ом с РЕАЛЬНО играющего звука (идеальная синхра).
   Серверный опрос ниже — фолбэк, если аватар открыт отдельным окном/OBS
   без главной страницы (тогда синхра приблизительная). */
if ('BroadcastChannel' in window){
  new BroadcastChannel('saika-tts-level').onmessage = e=>{
    bcTs = performance.now();
    audioLevel = Math.min(1, (e.data||0)*4);
    if (audioLevel > 0.02) audioTs = bcTs;
  };
}
async function pollAudio(){
  if (performance.now() - bcTs < 600){   // живой канал точнее — не мешаем
    setTimeout(pollAudio, 300); return; }
  try{
    // эндпоинт отдаёт ГОЛОЕ число текстом («0.123»), не JSON — парсим float
    const r = parseFloat(await (await fetch('/api/audio_level')).text());
    audioLevel = isNaN(r) ? 0 : r;
    if (audioLevel > 0.02) audioTs = performance.now();
  }catch(e){}
  setTimeout(pollAudio, 66);          // ~15 Гц, как VMCP head-bob
}
pollAudio();

/* ---------- ЗРИТЕЛЬНОЕ ВНИМАНИЕ ----------
   Взгляд живёт по правилам аниматоров: ~70-80%% времени на «зрителе»
   (камере) с САККАДАМИ — микропрыжками глаз каждые 0.5-3с; изредка —
   осознанный отвод взгляда в сторону/вниз на секунду-полторы (задумалась);
   при крупном переводе взгляда — моргание (так делают люди). Во время
   речи взгляд почти не уходит от зрителя. three-vrm сам доворачивает
   глаза на цель (vrm.lookAt.target). */
const gazeTarget = new THREE.Object3D(); scene.add(gazeTarget);
let gaze = {ox:0, oy:0, next:0};
// сглаженный взгляд ДЛЯ ГОЛОВЫ: глаза прыгают мгновенно (саккады так и
// работают), а вот голова догоняет плавно — иначе микроповороты выглядят
// дёрганьем (замечание владельца 2026-07-25)
let gs = {ox:0, oy:0};
function updateGaze(t, talking, dt){
  const k = 1 - Math.exp(-(dt||0.016)*3.2);      // ~0.3с догона
  gs.ox += (gaze.ox - gs.ox)*k;
  gs.oy += (gaze.oy - gs.oy)*k;
  if (t > gaze.next){
    // основной режим — СЛЕДИТЬ ЗА ЗРИТЕЛЕМ; отвод взгляда — редкое событие
    // (в основном глазами, голова почти не участвует — см. клампы ниже)
    const big = Math.random() < (talking ? 0.05 : 0.12);
    if (big){                                   // отвод взгляда
      gaze.ox = (Math.random()*2-1)*0.55; gaze.oy = -0.05-Math.random()*0.25;
      gaze.next = t + 0.8 + Math.random()*1.4;
      if (blinkT < 0) blinkT = 0;               // моргнуть на переводе
    } else {                                    // саккада вокруг зрителя
      gaze.ox = (Math.random()*2-1)*0.10; gaze.oy = (Math.random()*2-1)*0.07;
      gaze.next = t + 0.5 + Math.random()*2.4;
    }
  }
  gazeTarget.position.set(camera.position.x + gaze.ox,
                          camera.position.y + gaze.oy, camera.position.z);
  // ДОВОРОТ НА ЗРИТЕЛЯ ПРИ ПЕРЕМЕЩЕНИИ (2026-07-25): когда модель оттянута
  // мышью в сторону (view.x/y), камера остаётся на месте — голова частично
  // доворачивается на «съеденный» угол, остаток добирают глаза (lookAt).
  // РАМКИ ФИЗИКИ: у человека комфортный поворот головы ~30-40°, дальше он
  // разворачивает корпус — поэтому компенсацию жёстко клампим, даже если
  // модель утащили на край экрана, шея не «выкручивается».
  const clamp = THREE.MathUtils.clamp;
  // ВАЖНО (2026-07-25): здесь НЕЛЬЗЯ делить на view.zoom. camera.zoom — это
  // увеличение «объектива», камера при нём НЕ приближается к модели, так что
  // реальная дистанция не меняется. Из-за деления угол компенсации рос вместе
  // с зумом, и на ближнем плане Сайка задирала голову назад.
  const camDist = 2.5;
  // СМОТРИТ НА ЧЕЛОВЕКА, А НЕ ВПЕРЁД (2026-08-14: «она при повороте головой
  // смотрит куда-то вперёд, а не на меня»). Раньше доворот считался ТОЛЬКО
  // от сдвига модели по кадру (view.x) — про облёт камеры и разворот самой
  // фигуры этот расчёт не знал ничего. Стоило встать сбоку, и она честно
  // глядела «прямо перед собой», то есть мимо.
  // Считаем настоящий угол между тем, куда она повёрнута, и тем, где
  // человек: разворот фигуры — это базовый угол VRM плюс её собственный ry,
  // а зритель — там, где камера.
  // УГОЛ СЧИТАЕМ ОТ БАЗЫ, А НЕ ОТ АБСОЛЮТНЫХ УГЛОВ (2026-08-14, третий
  // заход по одному месту — стыдно, но полезно).
  //   1) я сложил baseRot.y + ry и назвал это «куда она смотрит». baseRot.y
  //      у VRM 0.0 равен 180° — это разворот, которым библиотека ставит
  //      модель лицом ВПЕРЁД. В итоге на обычном виде спереди выходило
  //      расхождение в 180°, то есть максимальный отворот всегда;
  //   2) следом попробовал взять направление из кватерниона — и снова мимо:
  //      локальное «вперёд» у VRM 0.0 это -Z, а я брал +Z.
  // Вывод: чужие соглашения об осях складывать вслепую нельзя. Считаем от
  // ТОГО, ЧТО УЖЕ РАБОТАЕТ: при ry=0 и камере спереди (az=0) отворота нет —
  // значит «куда она смотрит» это ровно её собственный поворот ry, а
  // базовый разворот в этой арифметике не участвует вовсе.
  //
  // ЗНАК проверен эквивалентностью со старым случаем: сдвинуть модель
  // вправо (view.x>0) при неподвижной камере — то же самое, что увести
  // камеру влево (az<0). Значит вклад облёта входит с минусом, как ниже.
  const toCam  = Math.atan2(camera.position.x - (view.x || 0),
                            camera.position.z - (view.z || 0));
  const facing = (view.ry || 0) * D2R;
  let relYaw = toCam - facing;
  relYaw = Math.atan2(Math.sin(relYaw), Math.cos(relYaw));   // в -PI..PI
  // рамки человеческой шеи: дальше 35° люди доворачивают корпус, а не
  // выкручивают голову — за пределом она просто смотрит максимально близко
  // ВЫКЛЮЧАТЕЛЬ ДОВОРОТА ГОЛОВЫ (2026-08-14, предупреждение владельца: «мы
  // опять сейчас наступим на грабли как UE5? просто пусть смотрит на
  // зрителя как режим взгляда в Warudo или VRoid»). Он прав дважды.
  // Во-первых, взгляд глазами и так делает библиотека — vrm.lookAt.target
  // указывает на камеру, это и есть «режим взгляда» из VRoid, он работал
  // всё это время. Во-вторых, доворот ГОЛОВЫ поверх него — приятная
  // добавка, но за три захода она уже съела больше времени, чем стоит.
  // Ломается — выключается одним флагом, и остаётся чистый VRoid-взгляд.
  // ВЕРТИКАЛЬ ТОЖЕ (2026-08-14: «не хватает углов подъёма-опускания головы,
  // поворотов»). Раньше в доворот заходил только горизонтальный угол, а
  // облёт по высоте не учитывался вовсе: поднимаешь камеру над ней — она
  // продолжает смотреть прямо перед собой. Считаем настоящий угол подъёма
  // от её головы до камеры.
  //   ЗНАК: камера ВЫШЕ (relPitch>0) — то же самое, что модель опущена
  //   (view.y<0), а этот случай уже даёт положительный panPitch. Значит
  //   вклад входит с плюсом.
  const _dh = Math.hypot(camera.position.x - (view.x || 0),
                         camera.position.z - (view.z || 0));
  const relPitch = Math.atan2(camera.position.y - (PIVOT.y + (view.y || 0)),
                              Math.max(0.2, _dh));
  const follow = view.headFollow !== false;
  // РАМКИ ШИРЕ, НО ЧЕЛОВЕЧЕСКИЕ: комфортный поворот головы у людей ~45°
  // вбок и ~25-30° вверх-вниз, дальше идёт корпус. Было 35 и 14 — узко,
  // отсюда и ощущение, что углов не хватает.
  const camYaw   = follow ? clamp(relYaw,   -R(45), R(45)) : 0;
  const camPitch = follow ? clamp(relPitch, -R(28), R(28)) : 0;
  // ДОВОРОТ К ЗРИТЕЛЮ — ТОЛЬКО ГОЛОВА И ШЕЯ (2026-08-14: «чё она
  // выгибается назад? и странно наклонена на прямом взгляде»).
  // Я подмешал угол камеры в ОБЩИЕ panYaw/panPitch, а их ниже потребляют
  // ещё и spine с chest — компенсация «хочу остаться в кадре», написанная
  // под сдвиг модели по экрану. В итоге стоило облететь её чуть выше, как
  // позвоночник прогибался назад, а вбок — заваливал корпус целиком.
  // Разделяем: корпус живёт на СТАРЫХ значениях и ведёт себя ровно как
  // раньше, а к зрителю доворачиваются только голова с шеей.
  const panYaw = clamp(Math.atan2(view.x, camDist), -R(35), R(35));
  // знак: модель ОПУЩЕНА (view.y<0) -> panPitch>0 -> отрицательный rotation.x
  // ниже = лицо ВВЕРХ (проверено владельцем 2026-07-25: было зеркально)
  const panPitch = clamp(Math.atan2(-view.y, camDist), -R(14), R(14));
  // а это — только для головы и шеи
  const headYaw   = panYaw   - camYaw;
  const headPitch = panPitch + camPitch;
  // голова следует за взглядом ЧУТЬ-ЧУТЬ: большие отводы взгляда — работа
  // ГЛАЗ (человек косится, а не крутит шеей); вклад головы клампим узко,
  // глаза доворачивают остаток сами. Всё — через addAx (аддитив поверх
  // сглаженной базы, без накопления).
  const hx = clamp(gs.ox, -0.16, 0.16), hy = clamp(gs.oy, -0.12, 0.12);
  addAx(bone('neck'), 'y', -hx*0.18 - headYaw*0.4);
  addAx(bone('neck'), 'x', headPitch*0.35);     // вертикаль: шея тоже работает
  const h = bone('head');
  addAx(h, 'x', -hy*0.14 + headPitch*0.45);     // подъём лица
  addAx(h, 'y', -hx*0.06 - headYaw*0.3);
  // «ХОЧУ ОСТАТЬСЯ В КАДРЕ» (2026-07-25, просьба владельца): при сильном
  // сдвиге модель подключает КОРПУС — опущена вниз: прогибается и тянет
  // лицо вверх; утащена вбок: чуть наклоняется к центру кадра
  // ОСАНКА (2026-08-14: «у неё всё равно спина как-то выгнута назад»).
  // Проверил по числам: из доворота к зрителю спина не получает ничего —
  // view.x и view.y были нулями, дыхание даёт градус-полтора. Значит
  // прогиб — собственная стойка модели: у VRoid-моделей грудь вперёд
  // заложена в позе покоя, и на виде сбоку это читается как выгнутая
  // спина. Менять чужую модель я не вправе, а спорить с ней вслепую
  // бессмысленно — поэтому даю ручку: положительный наклон выпрямляет,
  // отрицательный горбит. Ноль = как задумал автор модели.
  const lean = (view.lean || 0) * D2R;
  addAx(bone('spine'), 'x', panPitch*0.18 + lean * 0.6);
  addAx(bone('chest'), 'x', lean * 0.25);
  addAx(bone('spine'), 'z', -panYaw*0.18);
  addAx(bone('chest'), 'x', panPitch*0.1);
  // ВЕРХНИЕ ПОЗИЦИИ: модель поднята в кадре — милый наклон головы к плечу
  // (к тому, что ближе к центру кадра; по центру — к правому)
  const up = Math.max(0, Math.atan2(view.y, camDist));
  if (up > 0.02){
    const side = view.x > 0.02 ? -1 : 1;
    addAx(h, 'z', side*Math.min(up*1.1, R(13)));
    addAx(bone('neck'), 'z', side*Math.min(up*0.5, R(6)));
  }
}

/* ---------- моргание (с двойными) ---------- */
let nextBlink = 2 + Math.random()*3, blinkT = -1;

/* ---------- главный цикл ---------- */
const clock = new THREE.Clock();
let talkPhase = 0, mouth = 0;
let beat = {t0:-9, next:0, side:'right'};   // бит-жесты при речи
// ПОТОЛОК ЧАСТОТЫ КАДРОВ НА СТОЛЕ (2026-08-14). Фигурка, которая просто
// стоит и дышит, не выигрывает от 60 кадров ничего, а с выключенным
// GPU-композитингом каждый кадр стоит дорого — отсюда и рывки. 30 кадров
// глазу неотличимы на такой анимации, зато нагрузка вдвое меньше.
// Настраивается: ?fps=N в адресе окна.
const _FPS_CAP = _DESK ? Number(new URLSearchParams(location.search)
                                 .get('fps') || 30) : 0;
let _lastFrame = 0;
function loop(){
  requestAnimationFrame(loop);
  if (_FPS_CAP){
    const now = performance.now();
    if (now - _lastFrame < 1000 / _FPS_CAP) return;
    _lastFrame = now;
  }
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (vrm){
    // сглаживание позы/эмоций считаем из реального dt (см. блок setRot/expr
    // выше по файлу — это и есть «мягкие переходы»)
    ROT_K  = 1 - Math.exp(-dt*11);
    EXPR_K = 1 - Math.exp(-dt*9);
    exprTouched.clear();

    const breath = Math.sin(t*1.7)*0.5+0.5;       // дыхание 0..1
    if (!animAction) basePose(t, breath*0.04);    // .vrma играет — не мешаем
    if (mixer) mixer.update(dt);

    // TRANSIENT: активный именной жест поверх базы (один слот). Раньше
    // на конце жеста эмоции сбрасывались мгновенно — теперь просто
    // отпускаем слот, а декей-проход ниже сам плавно угасит то, что жест
    // держал (happy/angry/sad/relaxed), если новый жест их не подхватил
    if (active){
      const p = (performance.now()/1000 - activeT0) / active.dur;
      if (p >= 1) active = null;
      else active.fn(p);
    }

    // ---- липсинк v2 (2026-07-25): не «рот по громкости», а подобие речи --
    // 1) сглаживание: атака быстрая (~70мс), закрытие мягкое (~150мс);
    // 2) слоговая модуляция: рот ПУЛЬСИРУЕТ ~5-7 раз/с, как при слогах,
    //    а не висит открытым; 3) смесь гласных форм aa/ih/ou — губы живут.
    // теперь уровень — с РЕАЛЬНОГО звука (BroadcastChannel), в нём уже есть
    // естественные слоговые провалы; искусственная пульсация поверх давала
    // «кривой» рот — оставляем еле заметную вариацию формы, а огибающую
    // берём как есть. Кивки при речи — АДДИТИВНО к позе (setRot её
    // перезаписывал -> голова дёргалась на границах реплик).
    const talking = performance.now() - audioTs < 300;
    // чувствительность: RMS реального звука тихий (~0.05-0.2), поэтому
    // усиление большое + сжатие сверху (sqrt), чтобы тихие звуки открывали
    // рот заметно, а громкие не упирались в максимум
    const target = talking ? Math.min(0.95, Math.sqrt(audioLevel*4.5)) : 0;
    const spd = target > mouth ? 20 : 10;             // атака/спад
    mouth += (target - mouth) * (1 - Math.exp(-dt*spd));
    if (mouth > 0.015){
      talkPhase += dt*9;
      expr('aa', mouth * (0.8 + 0.2*Math.sin(talkPhase*1.3)));
      expr('ih', mouth * 0.18 * (0.5+0.5*Math.sin(talkPhase*0.9+1.3)));
      expr('ou', mouth * 0.12 * (0.5+0.5*Math.sin(talkPhase*0.6+2.6)));
      if (!active && !animAction){   // OVERLAY: кив+биты не спорят с .vrma-клипом
        const amp = R(1.2) + mouth*R(2.2);            // мягкий кив, аддитивно
        const h = bone('head');
        addAx(h, 'x', amp*Math.sin(talkPhase*0.5));
        addAx(h, 'y', amp*0.35*Math.sin(talkPhase*0.31+1));
        // БИТ-ЖЕСТИКУЛЯЦИЯ (co-speech beats): при речи люди слегка
        // «отбивают» фразы кистями — раз в 2-5с короткий импульс предплечья
        if (t > beat.next){ beat.t0 = t; beat.side = Math.random()<0.6 ? 'right':'left';
                            beat.next = t + 2 + Math.random()*3; }
        const bp = (t - beat.t0)/0.55;
        if (bp >= 0 && bp < 1){
          const ba = Math.sin(bp*Math.PI)*R(9)*(0.6+mouth*0.6);
          const la = bone(beat.side+'LowerArm');
          addAx(la, 'x', -ba); addAx(la, 'y', (beat.side==='right'?-1:1)*ba*0.5);
          addAx(bone(beat.side+'Hand'), 'x', ba*0.7);
        }
      }
    } else { expr('aa',0); expr('ih',0); expr('ou',0); }

    // OVERLAY: наклон головы на вопрос (askCue/play() выше) — свой
    // независимый слой, аддитивно; работает ДАЖЕ поверх активного
    // transient-жеста или .vrma-клипа, и не спорит с битами/кивом речи
    const askP = (t - askCue.t0) / 2.2;
    if (askP >= 0 && askP < 1){
      const a = Math.sin(askP*Math.PI);              // плавно туда и обратно
      const h = bone('head');
      addAx(h, 'x', R(3)*a); addAx(h, 'y', R(6)*a); addAx(h, 'z', R(12)*a);
      const n = bone('neck');
      addAx(n, 'y', R(4)*a); addAx(n, 'z', R(4)*a);
      addAx(bone('rightShoulder'), 'z', -R(4)*a);
    }

    // взгляд (после позы и жестов — доворачивает голову поверх)
    updateGaze(t, talking, dt);
    if (vrm.lookAt && vrm.lookAt.target !== gazeTarget)
      vrm.lookAt.target = gazeTarget;

    // фоновая микромимика: нейтральное лицо мертвит — держим едва заметный
    // «тонус» доброжелательности, слегка гуляющий по времени
    if (!active && !talking)
      expr('happy', 0.06 + 0.05*Math.sin(t*0.13) + 0.03*Math.sin(t*0.041));

    // ДЕКЕЙ: эмоции жестов, которые в этом кадре никто не трогал (жест
    // сменился или закончился) — сами плавно угасают в 0, без «щелчка»
    GESTURE_EXPRS.forEach(n => { if (!exprTouched.has(n)) expr(n, 0); });

    // моргание (иногда двойное — живее)
    blinkT >= 0 ? blinkT += dt : null;
    if (blinkT < 0 && t > nextBlink){ blinkT = 0; }
    if (blinkT >= 0){
      expr('blink', Math.sin(Math.min(blinkT/0.12,1)*Math.PI));
      if (blinkT > 0.14){ blinkT = -1; expr('blink',0);
        nextBlink = Math.random() < 0.2 ? t + 0.22    // двойное моргание
                                        : t + 2 + Math.random()*4; }
    }

    vrm.update(dt);            // spring bones: физика волос/юбки — здесь
  }
  flatTick(dt);
  renderer.render(scene, activeCam());
}
loop();
</script>
</body>
</html>
