<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Джоконда — этюд в духе да Винчи</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2a2620, #14110c 75%);
    font-family: Georgia, serif;
  }
  .wrap { text-align: center; padding: 24px; }
  svg { max-width: 92vw; max-height: 86vh; filter: drop-shadow(0 18px 40px rgba(0,0,0,.7)); }
  .cap { color: #a89878; font-style: italic; margin-top: 14px; font-size: 15px; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Сфумато: мягкое дымчатое размытие -->
    <filter id="sfumato" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa48e"/>
      <stop offset=".45" stop-color="#7d8468"/>
      <stop offset="1" stop-color="#5c6247"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a2e"/>
      <stop offset=".6" stop-color="#2a3320"/>
      <stop offset="1" stop-color="#1c2214"/>
    </linearGradient>
    <radialGradient id="skin" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#e8cba4"/>
      <stop offset=".55" stop-color="#d9b88c"/>
      <stop offset="1" stop-color="#b28f63"/>
    </radialGradient>
    <radialGradient id="skinHand" cx=".45" cy=".4" r=".8">
      <stop offset="0" stop-color="#e9cfa9"/>
      <stop offset=".6" stop-color="#d3b288"/>
      <stop offset="1" stop-color="#a9875c"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a18"/>
      <stop offset="1" stop-color="#241a0e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6b34"/>
      <stop offset=".5" stop-color="#5d471f"/>
      <stop offset="1" stop-color="#7c5f2c"/>
    </linearGradient>
    <radialGradient id="vign" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <!-- РАМА -->
  <rect x="0" y="0" width="600" height="800" fill="url(#frame)"/>
  <rect x="14" y="14" width="572" height="772" fill="none" stroke="#3a2c12" stroke-width="4"/>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#a5874c" stroke-width="3" opacity=".7"/>
  <rect x="36" y="36" width="528" height="728" fill="#222"/>

  <!-- КАРТИНА -->
  <g clip-path="none">
    <rect x="40" y="40" width="520" height="720" fill="url(#sky)"/>

    <!-- ПЕЙЗАЖ: дымчатые дали -->
    <g filter="url(#haze)" opacity=".8">
      <path d="M40 300 Q120 210 190 265 Q240 300 300 285 L300 420 L40 420 Z" fill="#5e6650"/>
      <path d="M560 290 Q480 200 420 260 Q370 300 320 285 L320 420 L560 420 Z" fill="#565e48"/>
      <path d="M60 340 Q150 290 230 330 L230 460 L60 460 Z" fill="#4c533d"/>
      <path d="M540 335 Q450 285 375 328 L375 460 L540 460 Z" fill="#474e39"/>
    </g>
    <!-- вода и мостик справа -->
    <g filter="url(#soft)">
      <path d="M360 430 Q450 415 560 425 L560 470 Q450 462 360 472 Z" fill="#6d7358"/>
      <path d="M430 436 q18 -16 38 0 M446 436 q0 -12 12 -12" stroke="#8b8a6e" stroke-width="5" fill="none" opacity=".8"/>
      <!-- дорожка слева -->
      <path d="M70 440 Q130 470 105 520 Q90 555 120 590" stroke="#7c7a5c" stroke-width="10" fill="none" opacity=".55"/>
    </g>
    <!-- туманная полоса -->
    <rect x="40" y="400" width="520" height="60" fill="#8b9077" opacity=".5" filter="url(#haze)"/>

    <!-- ПАРАПЕТ / КОЛОННЫ по бокам -->
    <rect x="40" y="430" width="34" height="330" fill="#4a4230"/>
    <rect x="526" y="430" width="34" height="330" fill="#453d2c"/>
    <rect x="40" y="560" width="520" height="16" fill="#554a34"/>

    <!-- ФИГУРА -->
    <g>
      <!-- волосы за плечами -->
      <path d="M212 300 Q200 180 300 168 Q400 180 388 300 Q402 420 380 470 L220 470 Q198 420 212 300 Z" fill="url(#hair)"/>
      <!-- плечи и платье -->
      <path d="M178 470 Q150 500 138 580 L130 760 L470 760 L462 580 Q450 500 422 470 Q360 440 300 440 Q240 440 178 470 Z" fill="url(#dress)"/>
      <!-- вырез с золотым шнурованием -->
      <path d="M252 452 Q300 492 348 452 L356 470 Q300 516 244 470 Z" fill="#caa96a" opacity=".85"/>
      <path d="M256 458 Q300 496 344 458" stroke="#7a5f2e" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
      <!-- складки -->
      <g stroke="#141a0e" stroke-width="3" opacity=".5" filter="url(#soft)">
        <path d="M210 520 Q230 620 218 740" fill="none"/>
        <path d="M390 520 Q372 620 384 740" fill="none"/>
        <path d="M300 540 Q298 640 300 750" fill="none"/>
      </g>
      <g stroke="#5c6b42" stroke-width="3" opacity=".45" filter="url(#soft)">
        <path d="M235 525 Q252 620 242 735" fill="none"/>
        <path d="M365 525 Q348 620 358 735" fill="none"/>
      </g>

      <!-- РУКИ сложены -->
      <g>
        <!-- правый рукав -->
        <path d="M165 560 Q150 640 190 690 L260 690 Q235 620 245 555 Q200 540 165 560 Z" fill="#333f26"/>
        <path d="M175 575 Q168 640 200 682" stroke="#57683c" stroke-width="4" fill="none" opacity=".5" filter="url(#soft)"/>
        <!-- левый рукав -->
        <path d="M435 560 Q450 640 410 690 L340 690 Q365 620 355 555 Q400 540 435 560 Z" fill="#2e3922"/>
        <!-- правая кисть сверху -->
        <path d="M228 668 Q268 650 318 662 Q352 670 352 690 Q352 712 316 714 L242 712 Q214 706 216 688 Q218 674 228 668 Z" fill="url(#skinHand)" filter="url(#soft)"/>
        <!-- левая кисть под ней -->
        <path d="M260 712 Q320 700 372 712 Q386 720 378 734 Q368 746 320 744 L262 742 Q240 736 244 724 Q248 716 260 712 Z" fill="url(#skinHand)" filter="url(#soft)"/>
        <!-- пальцы -->
        <g stroke="#a07c52" stroke-width="2" opacity=".65" filter="url(#soft)">
          <path d="M258 668 Q276 664 292 666" fill="none"/>
          <path d="M262 680 Q282 676 300 678" fill="none"/>
          <path d="M268 692 Q288 688 306 690" fill="none"/>
          <path d="M300 716 Q320 712 340 714" fill="none"/>
          <path d="M304 728 Q324 724 344 726" fill="none"/>
        </g>
        <!-- тень между руками -->
        <path d="M240 700 Q300 694 356 702" stroke="#5a4126" stroke-width="6" opacity=".5" fill="none" filter="url(#sfumato)"/>
      </g>

      <!-- ШЕЯ -->
      <path d="M272 372 L272 448 Q300 466 328 448 L328 372 Z" fill="url(#skin)"/>
      <path d="M272 400 Q300 424 328 400 L328 380 L272 380 Z" fill="#a9855a" opacity=".55" filter="url(#sfumato)"/>

      <!-- ГОЛОВА -->
      <g>
        <ellipse cx="300" cy="295" rx="82" ry="102" fill="url(#skin)"/>
        <!-- сфумато-тени вокруг овала -->
        <ellipse cx="300" cy="295" rx="82" ry="102" fill="none" stroke="#8f6f47" stroke-width="14" opacity=".4" filter="url(#sfumato)"/>
        <path d="M232 268 Q240 350 290 392 Q246 380 226 310 Z" fill="#a07e55" opacity=".5" filter="url(#sfumato)"/>
        <path d="M368 268 Q360 350 310 392 Q354 380 374 310 Z" fill="#977650" opacity=".5" filter="url(#sfumato)"/>

        <!-- волосы: пробор и пряди -->
        <path d="M300 178 Q214 190 218 292 Q220 330 232 356 Q222 300 244 262 Q262 232 300 226 Q338 232 356 262 Q378 300 368 356 Q380 330 382 292 Q386 190 300 178 Z" fill="url(#hair)"/>
        <g stroke="#1c130a" stroke-width="2" opacity=".6" filter="url(#soft)">
          <path d="M300 182 Q252 192 236 240" fill="none"/>
          <path d="M300 182 Q348 192 364 240" fill="none"/>
          <path d="M300 180 L300 224" fill="none"/>
          <path d="M288 184 Q244 198 230 252" fill="none"/>
          <path d="M312 184 Q356 198 370 252" fill="none"/>
        </g>
        <!-- вуаль -->
        <path d="M300 168 Q180 190 176 320 Q174 420 200 480 L214 470 Q192 410 196 316 Q200 206 300 190 Q400 206 404 316 Q408 410 386 470 L400 480 Q426 420 424 320 Q420 190 300 168 Z" fill="#c9bfa4" opacity=".18"/>
        <path d="M300 166 Q190 188 184 314" stroke="#e4dcc4" stroke-width="3" fill="none" opacity=".25" filter="url(#soft)"/>
        <path d="M300 166 Q410 188 416 314" stroke="#e4dcc4" stroke-width="3" fill="none" opacity=".25" filter="url(#soft)"/>

        <!-- брови — еле намечены -->
        <path d="M246 262 Q264 254 282 260" stroke="#5d4526" stroke-width="3" fill="none" opacity=".45" filter="url(#sfumato)"/>
        <path d="M318 260 Q336 254 354 262" stroke="#5d4526" stroke-width="3" fill="none" opacity=".45" filter="url(#sfumato)"/>

        <!-- глаза -->
        <g>
          <path d="M246 282 Q264 270 284 280 Q266 292 246 282 Z" fill="#f0e4cd" filter="url(#soft)"/>
          <path d="M316 280 Q336 270 354 282 Q334 292 316 280 Z" fill="#f0e4cd" filter="url(#soft)"/>
          <circle cx="266" cy="281" r="6.5" fill="#4a3418"/>
          <circle cx="334" cy="281" r="6.5" fill="#4a3418"/>
          <circle cx="266" cy="281" r="2.8" fill="#120b04"/>
          <circle cx="334" cy="281" r="2.8" fill="#120b04"/>
          <circle cx="268" cy="279" r="1.3" fill="#e8dcc0" opacity=".9"/>
          <circle cx="336" cy="279" r="1.3" fill="#e8dcc0" opacity=".9"/>
          <path d="M244 280 Q264 268 286 279" stroke="#3c2a12" stroke-width="3" fill="none" filter="url(#soft)"/>
          <path d="M314 279 Q336 268 356 280" stroke="#3c2a12" stroke-width="3" fill="none" filter="url(#soft)"/>
          <!-- нижние веки в дымке -->
          <path d="M248 288 Q266 296 284 287" stroke="#9c7b50" stroke-width="3" fill="none" opacity=".6" filter="url(#sfumato)"/>
          <path d="M316 287 Q334 296 352 288" stroke="#9c7b50" stroke-width="3" fill="none" opacity=".6" filter="url(#sfumato)"/>
        </g>

        <!-- нос -->
        <path d="M300 292 Q296 316 290 330 Q300 338 310 330 Q304 316 300 292 Z" fill="#c39e6f" opacity=".8" filter="url(#sfumato)"/>
        <path d="M290 332 Q300 340 310 332" stroke="#8f6c40" stroke-width="2.5" fill="none" opacity=".7" filter="url(#soft)"/>

        <!-- ГУБЫ: знаменитая улыбка, углы растворены в дымке -->
        <path d="M272 356 Q300 350 328 356 Q316 368 300 368 Q284 368 272 356 Z" fill="#a8624a" opacity=".9" filter="url(#soft)"/>
        <path d="M276 358 Q300 364 324 358" stroke="#7e4634" stroke-width="2" fill="none" filter="url(#soft)"/>
        <path d="M264 352 Q272 356 276 358" stroke="#8a5a40" stroke-width="3" fill="none" opacity=".55" filter="url(#sfumato)"/>
        <path d="M336 352 Q328 356 324 358" stroke="#8a5a40" stroke-width="3" fill="none" opacity=".55" filter="url(#sfumato)"/>

        <!-- подбородок и лёгкий румянец -->
        <ellipse cx="300" cy="382" rx="16" ry="8" fill="#b8936a" opacity=".4" filter="url(#sfumato)"/>
        <ellipse cx="252" cy="330" rx="16" ry="12" fill="#c98d66" opacity=".22" filter="url(#sfumato)"/>
        <ellipse cx="348" cy="330" rx="16" ry="12" fill="#c98d66" opacity=".22" filter="url(#sfumato)"/>
      </g>
    </g>

    <!-- кракелюры старины -->
    <g stroke="#0c0a06" stroke-width="1" opacity=".25">
      <path d="M120 100 l14 22 l-8 18 M420 90 l-10 26 l14 14 M90 600 l18 12 l-4 20 M500 640 l-16 16 l10 18 M330 60 l6 20 l-12 10"/>
    </g>
    <!-- виньетка -->
    <rect x="40" y="40" width="520" height="720" fill="url(#vign)"/>
  </g>
</svg>
<div class="cap">«La Gioconda» — этюд в духе Леонардо. Сфумато прилагается, пятьсот лет выдержки — нет.</div>
</div>
</body>
</html>
