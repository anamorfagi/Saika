<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANAMORF · цепочка</title>
<style>
:root{--bg:#0a0a0c;--pan:#141418;--ln:rgba(255,255,255,.09);
  --ink:#ecedf1;--dim:rgba(236,237,241,.42);--go:#7fd6a5;
  --ease:cubic-bezier(.2,.85,.25,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:400 13px/1.45 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr 268px;height:100%}
.pan{background:var(--pan);border-right:1px solid var(--ln);overflow:auto;padding:12px}
.pan:last-child{border-right:0;border-left:1px solid var(--ln)}
h3{margin:0 0 8px;font:500 10.5px/1 inherit;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
button{background:#22222a;color:var(--ink);border:1px solid var(--ln);border-radius:8px;
  padding:6px 10px;font:400 12px/1 inherit;cursor:pointer}
button:hover{background:#2e2e38;border-color:rgba(255,255,255,.32)}
button.on{background:#5a5a68;border-color:rgba(255,255,255,.55)}
input[type=text]{background:#0f0f13;color:var(--ink);border:1px solid var(--ln);
  border-radius:7px;padding:6px 8px;font:400 12px/1 inherit;width:100%}
input[type=range]{width:100%;accent-color:#dcdce4}
label{display:block;font:400 11px/1.5 inherit;color:var(--dim);margin-top:9px}
label b{color:var(--ink);font-weight:500;float:right}
.tile{background:#1c1c22;border:1px solid var(--ln);border-radius:10px;padding:10px 8px;
  cursor:pointer;text-align:center;transition:all .16s var(--ease)}
.tile:hover{background:#2b2b34;border-color:rgba(255,255,255,.34);transform:translateY(-1px)}
.tile .gl{display:block;font-size:19px;line-height:1;margin-bottom:5px;color:#dcdce4}
.tile b{display:block;font:500 11.5px/1 inherit}
.tile i{display:block;margin-top:3px;font:400 9.5px/1.25 inherit;font-style:normal;color:var(--dim)}
.nd{display:flex;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer;
  border:1px solid transparent;align-items:center}
.nd:hover{background:#1d1d23}
.nd.sel{background:#2c2c36;border-color:rgba(255,255,255,.3)}
.nd .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd .tp{font:400 9.5px/1 inherit;color:var(--dim)}

/* ═══ ХОЛСТ ═══ */
#wrap{position:relative;overflow:hidden;background:
  radial-gradient(circle at 50% 45%,#101014,#08080a 75%)}
#cv{position:absolute;inset:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:rgba(255,255,255,.36);stroke-width:2;
  stroke-dasharray:2 9;stroke-linecap:round;pointer-events:stroke;cursor:pointer}
#links path.hot{stroke:#fff;stroke-width:2.6}
#links path.hit{stroke:transparent;stroke-width:16;stroke-dasharray:none}

.node{position:absolute;user-select:none}
.node .card{display:flex;align-items:center;gap:10px;white-space:nowrap;height:44px;
  padding:0 18px 0 15px;border-radius:999px;cursor:grab;
  background:linear-gradient(168deg,#3d3d47,#26262e);border:1px solid rgba(255,255,255,.2);
  box-shadow:0 16px 30px -14px #000,0 2px 4px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(255,255,255,.08)}
.node.sel .card{border-color:rgba(255,255,255,.6);
  box-shadow:0 0 0 2px rgba(255,255,255,.3),0 22px 44px -18px #000}
.node.magnet .card{border-color:var(--go);box-shadow:0 0 0 2px var(--go)}
.node .ic{font-size:14px;flex:none}
.node .tx{font:400 14px/1 inherit}
.node .sub{font:400 11px/1 inherit;color:var(--dim)}
/* точка */
.node.dot .card{width:16px;height:16px;padding:0;border-radius:50%;
  background:rgba(255,255,255,.85);border:0;box-shadow:0 0 0 5px rgba(255,255,255,.08)}
.node.dot .lb{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font:400 9.5px/1 inherit;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);pointer-events:none}
/* гнездо связи */
.plug{position:absolute;right:-9px;top:50%;margin-top:-6px;width:12px;height:12px;
  border-radius:50%;background:#0e0e12;border:2px solid rgba(255,255,255,.6);
  cursor:crosshair;transition:transform .15s var(--ease),border-color .15s}
.plug:hover{transform:scale(1.5);border-color:var(--go)}
.node.dot .plug{right:-13px}
body.sim .plug{display:none}

#top{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;
  gap:8px;padding:0 12px;z-index:400;background:rgba(10,10,12,.75);
  border-bottom:1px solid var(--ln)}
#top .sp{flex:1}
#tip{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;
  justify-content:center;font:300 12px/1 inherit;color:var(--dim);
  border-top:1px solid var(--ln);background:rgba(10,10,12,.75);z-index:400}
#log{position:absolute;right:12px;top:50px;width:230px;z-index:390;pointer-events:none;display:none}
body.sim #log{display:block}
#log div{background:rgba(20,20,26,.9);border:1px solid var(--ln);border-radius:8px;
  padding:5px 8px;margin-bottom:4px;font:400 11px/1.35 inherit;color:var(--dim)}
#log div b{color:var(--ink)}
#out{width:100%;height:110px;margin-top:8px;background:#0f0f13;color:var(--dim);
  border:1px solid var(--ln);border-radius:8px;padding:7px;
  font:400 10px/1.4 ui-monospace,monospace;resize:none}
</style></head><body class="edit">
<div id="app">

  <div class="pan">
    <h3>Палитра</h3>
    <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <div class="tile" onclick="addNode('item')"><span class="gl">▭</span>
        <b>Плашка</b><i>пункт</i></div>
      <div class="tile" onclick="addNode('dot')"><span class="gl">●</span>
        <b>Точка</b><i>узел</i></div>
    </div>
    <h3 style="margin-top:14px">Правка</h3>
    <div class="row"><button onclick="undo()">↶ отменить</button>
      <button onclick="redo()">↷ вернуть</button></div>
    <div class="row"><button onclick="delNode()">удалить</button>
      <button onclick="reset()">сброс</button></div>
    <h3 style="margin-top:14px">Цепочка</h3>
    <div class="row"><button onclick="copyOut()">скопировать</button>
      <button onclick="pasteIn()">вставить</button></div>
    <textarea id="out" spellcheck="false"></textarea>
  </div>

  <div id="wrap">
    <div id="top">
      <button id="b-edit" class="on" onclick="setMode('edit')">правка</button>
      <button id="b-sim" onclick="setMode('sim')">симуляция</button>
      <span class="sp"></span>
      <button onclick="tidy()">разложить</button>
      <button onclick="fit()">вписать</button>
    </div>
    <div id="cv"><svg id="links"></svg></div>
    <div id="log"></div>
    <div id="tip"></div>
  </div>

  <div class="pan">
    <h3>Список</h3>
    <div id="tree"></div>
    <h3 style="margin-top:14px">Элемент</h3>
    <label>Имя</label><input type="text" id="f-n" oninput="setF('n',this.value)">
    <label>Подпись</label><input type="text" id="f-s" oninput="setF('s',this.value)">
    <label>Значок</label><input type="text" id="f-ic" oninput="setF('ic',this.value)">
    <div id="linkinfo" style="font:400 10.5px/1.55 inherit;color:var(--dim);margin-top:8px"></div>
    <h3 style="margin-top:14px">Механика</h3>
    <label>Чем открывается</label>
    <div class="row">
      <button data-o="click" onclick="setS('open','click')">клик</button>
      <button data-o="hover" onclick="setS('open','hover')">наведение</button>
      <button data-o="hold" onclick="setS('open','hold')">удержание</button>
    </div>
    <label>Задержка <b id="v-ms"></b></label>
    <input type="range" id="s-ms" min="0" max="900" step="20" oninput="setS('ms',+this.value)">
    <label>Изгиб связи <b id="v-cur"></b></label>
    <input type="range" id="s-cur" min="0" max="100" oninput="setS('curve',+this.value)">
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const wrap = $('#wrap'), cv = $('#cv'), svg = $('#links'), logBox = $('#log');

/* ═══ МОДЕЛЬ ═══
   Плоский список узлов с СОБСТВЕННЫМИ координатами и отдельный список
   связей. Никаких уровней и никакой вложенности: уровень — это просто то,
   докуда дотянулись стрелки, и вычисляется он из связей, а не хранится.

   Так холст показывает ВСЮ цепочку разом, а не кусок вокруг выбранного, и
   ничто никуда не «перекидывает»: что построил, то и видно. */
const DEF = {
  nodes:[
    {id:1,t:'item',ic:'◆',n:'Мозги',s:'корень',x:80,y:300},
    {id:2,t:'item',ic:'⏻',n:'Включено',s:'мозги работают',x:330,y:170},
    {id:3,t:'item',ic:'▤',n:'Локальные',s:'на твоём железе',x:330,y:250},
    {id:4,t:'item',ic:'☁',n:'Онлайн платные',s:'по ключу',x:330,y:330},
    {id:5,t:'item',ic:'◇',n:'Онлайн бесплатные',s:'без денег',x:330,y:410},
    {id:6,t:'item',ic:'≋',n:'Диффузионные',s:'из шума',x:330,y:490},
    {id:7,t:'item',ic:'◍',n:'google/gemma-4-e4b',s:'llama.cpp',x:640,y:210},
    {id:8,t:'item',ic:'◍',n:'gemma4:12b',s:'ollama',x:640,y:290},
    {id:9,t:'item',ic:'🏅',n:'Досье',s:'',x:960,y:170},
    {id:10,t:'item',ic:'⚡',n:'Скорость',s:'',x:960,y:250},
    {id:11,t:'item',ic:'🎚',n:'Сэмплинг',s:'',x:960,y:330},
  ],
  links:[{f:1,t:2},{f:1,t:3},{f:1,t:4},{f:1,t:5},{f:1,t:6},
         {f:3,t:7},{f:3,t:8},{f:7,t:9},{f:7,t:10},{f:7,t:11}],
  style:{open:'click',ms:260,curve:52},
  view:{x:0,y:0,k:1}
};
let D = load() || JSON.parse(JSON.stringify(DEF));
let sel = 1, mode = 'edit', selLink = -1;
let elById = {};

function load(){ try{ const j=JSON.parse(localStorage.anamorf_chain);
  return (j&&j.nodes&&j.links)?j:null; }catch(e){ return null; } }
function persist(){ try{ localStorage.anamorf_chain=JSON.stringify(D); }catch(e){}
  $('#out').value = JSON.stringify(D,null,1); }

const byId = i => D.nodes.find(n=>n.id===i);
const outOf = i => D.links.filter(l=>l.f===i).map(l=>byId(l.t)).filter(Boolean);
const inOf  = i => D.links.filter(l=>l.t===i).length;
const roots = () => D.nodes.filter(n=>inOf(n.id)===0);
const nextId = () => Math.max(0,...D.nodes.map(n=>n.id))+1;

/* ═══ ОТМЕНА ═══ */
let hist=[], future=[];
function snap(){ hist.push(JSON.stringify(D)); if(hist.length>80) hist.shift(); future.length=0; }
function undo(){ if(!hist.length) return; future.push(JSON.stringify(D));
  D=JSON.parse(hist.pop()); if(!byId(sel)) sel=D.nodes[0]?D.nodes[0].id:0; all(); }
function redo(){ if(!future.length) return; hist.push(JSON.stringify(D));
  D=JSON.parse(future.pop()); all(); }
addEventListener('keydown',ev=>{
  const t=ev.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
  const z=/^[zZяЯ]$/.test(ev.key);
  if((ev.ctrlKey||ev.metaKey)&&z){ ev.preventDefault(); ev.shiftKey?redo():undo(); }
  if(ev.key==='Delete'||ev.key==='Backspace'){ ev.preventDefault();
    if(selLink>=0){ snap(); D.links.splice(selLink,1); selLink=-1; all(); } else delNode(); }
});

/* ═══ ЭЛЕМЕНТЫ ═══ */
function addNode(t){
  snap();
  const s = byId(sel);
  const n = {id:nextId(), t, ic:t==='item'?'◍':'', n:t==='dot'?'точка':'новый пункт', s:'',
             x:(s?s.x+270:200), y:(s?s.y+90:200)};
  D.nodes.push(n);
  /* Новый элемент СРАЗУ связан с тем, что было выбрано: цепочка строится
     тем же движением, каким добавляется звено. Не нужен — связь снимается
     одним кликом по ней. */
  if (s) D.links.push({f:s.id, t:n.id});
  sel = n.id; all();
}
function delNode(){
  if(!byId(sel)) return;
  snap();
  D.links = D.links.filter(l=>l.f!==sel && l.t!==sel);
  D.nodes = D.nodes.filter(n=>n.id!==sel);
  sel = D.nodes.length?D.nodes[0].id:0; all();
}
function reset(){ snap(); D=JSON.parse(JSON.stringify(DEF)); sel=1; all(); }
function setF(k,v){ const n=byId(sel); if(!n) return; snap(); n[k]=v; all(); }
function setS(k,v){ snap(); D.style[k]=v; all(); }

/* ═══ РАСКЛАДКА ПО СЛОЯМ ═══
   Кнопка «разложить»: слой = длина пути от корня. Считается из связей, не
   хранится нигде — потому и не может разойтись с тем, что нарисовано. */
function tidy(){
  snap();
  const depth={}; const q=roots().map(n=>({n,d:0}));
  const seen=new Set();
  while(q.length){
    const {n,d}=q.shift();
    if(seen.has(n.id)&&depth[n.id]>=d) continue;
    seen.add(n.id); depth[n.id]=Math.max(depth[n.id]||0,d);
    outOf(n.id).forEach(c=>q.push({n:c,d:d+1}));
  }
  const cols={};
  D.nodes.forEach(n=>{ const d=depth[n.id]||0; (cols[d]=cols[d]||[]).push(n); });
  Object.keys(cols).forEach(d=>{
    cols[d].forEach((n,i)=>{ n.x = 80 + d*300; n.y = 140 + i*84; });
  });
  all(); fit();
}
function fit(){
  if(!D.nodes.length) return;
  const xs=D.nodes.map(n=>n.x), ys=D.nodes.map(n=>n.y);
  const w=Math.max(...xs)-Math.min(...xs)+420, h=Math.max(...ys)-Math.min(...ys)+200;
  const k=Math.min(1.2, Math.min((wrap.clientWidth-40)/w,(wrap.clientHeight-110)/h));
  D.view.k=k; D.view.x=30-Math.min(...xs)*k; D.view.y=64-Math.min(...ys)*k;
  applyView(); persist();
}
function applyView(){
  cv.style.transform='translate('+D.view.x+'px,'+D.view.y+'px) scale('+D.view.k+')';
}

/* ═══ РИСОВАНИЕ ═══ */
function all(){ tree(); fields(); sliders(); persist(); draw(); }
function draw(){
  [...cv.querySelectorAll('.node')].forEach(e=>e.remove());
  elById={};
  D.nodes.forEach(n=>{
    const el=document.createElement('div');
    el.className='node '+n.t+(n.id===sel?' sel':'');
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    el.innerHTML = n.t==='item'
      ? '<div class="card"><span class="ic">'+(n.ic||'◍')+'</span>'
        +'<span class="tx">'+n.n+'</span>'
        +(n.s?'<span class="sub">'+n.s+'</span>':'')+'</div><div class="plug"></div>'
      : '<div class="card"></div>'+(n.n?'<span class="lb">'+n.n+'</span>':'')
        +'<div class="plug"></div>';
    cv.appendChild(el); elById[n.id]=el;
    dragNode(el,n);
    plug(el.querySelector('.plug'),n);
    el.querySelector('.card').addEventListener('click',ev=>{
      ev.stopPropagation();
      if(mode==='sim'){ step(n); return; }
      sel=n.id; selLink=-1; all();
    });
    if(mode==='sim'){
      const c=el.querySelector('.card'), S=D.style;
      if(S.open==='hover'){ let t=0;
        c.onpointerenter=()=>{t=setTimeout(()=>step(n),S.ms);};
        c.onpointerleave=()=>clearTimeout(t); }
      if(S.open==='hold'){ let t=0;
        c.onpointerdown=()=>{t=setTimeout(()=>step(n),S.ms);};
        c.onpointerup=()=>clearTimeout(t);
        c.onpointerleave=()=>clearTimeout(t); }
    }
  });
  wires();
}
function port(id,side){
  const n=byId(id); if(!n) return {x:0,y:0};
  const el=elById[id];
  const w=el?el.offsetWidth:120, h=el?el.offsetHeight:44;
  return side==='out' ? {x:n.x+w+4, y:n.y+h/2} : {x:n.x-6, y:n.y+h/2};
}
function wires(){
  svg.innerHTML='';
  svg.setAttribute('width', 6000); svg.setAttribute('height', 4000);
  D.links.forEach((l,i)=>{
    const a=port(l.f,'out'), b=port(l.t,'in');
    const c=D.style.curve;
    const d='M '+a.x+' '+a.y+' C '+(a.x+c)+' '+a.y+' '+(b.x-c)+' '+b.y+' '+b.x+' '+b.y;
    const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d); hit.setAttribute('class','hit');
    hit.onclick=e=>{ e.stopPropagation(); selLink=i; sel=0; all(); };
    hit.ondblclick=e=>{ e.stopPropagation(); snap(); D.links.splice(i,1); all(); };
    svg.appendChild(hit);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); if(i===selLink) p.setAttribute('class','hot');
    svg.appendChild(p);
  });
}

/* ═══ СВЯЗЬ МЫШЬЮ ═══ */
let linking=null;
function plug(el,n){
  if(!el) return;
  el.onpointerdown=ev=>{
    if(mode!=='edit') return;
    ev.preventDefault(); ev.stopPropagation();
    linking={from:n.id};
    const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');
    tmp.setAttribute('class','hot'); svg.appendChild(tmp);
    const mv=e=>{
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)/D.view.k, y=(e.clientY-r.top)/D.view.k;
      const a=port(n.id,'out'), c=D.style.curve;
      tmp.setAttribute('d','M '+a.x+' '+a.y+' C '+(a.x+c)+' '+a.y+' '+(x-c)+' '+y+' '+x+' '+y);
      document.querySelectorAll('.node').forEach(q=>q.classList.remove('magnet'));
      const u=nodeUnder(e.clientX,e.clientY); if(u&&u!==elById[n.id]) u.classList.add('magnet');
    };
    const up=e=>{
      removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
      tmp.remove();
      document.querySelectorAll('.node').forEach(q=>q.classList.remove('magnet'));
      const u=nodeUnder(e.clientX,e.clientY);
      if(u && u._id && u._id!==n.id){
        snap();
        if(!D.links.some(l=>l.f===n.id&&l.t===u._id)) D.links.push({f:n.id,t:u._id});
        all();
      }
      linking=null;
    };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
  };
}
function nodeUnder(cx,cy){
  for(const e of document.elementsFromPoint(cx,cy)){
    const c=e.closest&&e.closest('.node'); if(c) return c;
  }
  return null;
}

/* ═══ ТАСКАНИЕ ═══ */
function dragNode(el,n){
  el._id=n.id;
  const card=el.querySelector('.card');
  card.onpointerdown=ev=>{
    if(mode!=='edit') return;
    ev.preventDefault(); ev.stopPropagation();
    sel=n.id; selLink=-1; tree(); fields(); snap();
    const x0=ev.clientX, y0=ev.clientY, nx=n.x, ny=n.y;
    const mv=e=>{
      n.x=Math.round(nx+(e.clientX-x0)/D.view.k);
      n.y=Math.round(ny+(e.clientY-y0)/D.view.k);
      el.style.left=n.x+'px'; el.style.top=n.y+'px';
      wires();
    };
    const up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up);
                   persist(); draw(); };
    addEventListener('pointermove',mv); addEventListener('pointerup',up);
  };
}
/* панорама и зум холста */
let pan=null;
wrap.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.node')||ev.target.closest('#top')||ev.target.closest('path')) return;
  pan={x:ev.clientX,y:ev.clientY,vx:D.view.x,vy:D.view.y};
  selLink=-1; sel=0; tree(); fields(); draw();
});
addEventListener('pointermove',ev=>{
  if(!pan) return;
  D.view.x=pan.vx+(ev.clientX-pan.x); D.view.y=pan.vy+(ev.clientY-pan.y); applyView();
});
addEventListener('pointerup',()=>{ if(pan){ pan=null; persist(); } });
wrap.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=wrap.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  /* Колесо инвертировано: от себя — отдалить, к себе — приблизить.
     Так это работает во всех редакторах сцен, и рука уже знает. */
  const k0=D.view.k, k=Math.max(.25,Math.min(2.2,k0*(ev.deltaY>0?1.11:.9)));
  D.view.x=mx-(mx-D.view.x)*(k/k0); D.view.y=my-(my-D.view.y)*(k/k0); D.view.k=k;
  applyView(); persist();
},{passive:false});

/* ═══ СПИСОК И ПОЛЯ ═══ */
function tree(){
  const box=$('#tree'); box.innerHTML='';
  D.nodes.forEach(n=>{
    const el=document.createElement('div');
    el.className='nd'+(n.id===sel?' sel':'');
    el.innerHTML='<span>'+(n.t==='dot'?'●':(n.ic||'◍'))+'</span>'
      +'<span class="nm">'+n.n+'</span><span class="tp">'+outOf(n.id).length+'→</span>';
    el.onclick=()=>{ sel=n.id; selLink=-1; all(); };
    box.appendChild(el);
  });
}
function fields(){
  const n=byId(sel);
  $('#f-n').value=n?n.n:''; $('#f-s').value=n?(n.s||''):''; $('#f-ic').value=n?(n.ic||''):'';
  const info=$('#linkinfo');
  if(selLink>=0){ const l=D.links[selLink];
    info.innerHTML='связь: <b style="color:var(--ink)">'+(byId(l.f)||{}).n+'</b> → <b style="color:var(--ink)">'
      +(byId(l.t)||{}).n+'</b><br>Delete — убрать';
  } else if(n){
    info.innerHTML='ведёт к: <b style="color:var(--ink)">'
      +(outOf(n.id).map(x=>x.n).join(', ')||'—')+'</b>';
  } else info.innerHTML='';
}
function sliders(){
  const S=D.style;
  $('#s-ms').value=S.ms; $('#v-ms').textContent=S.ms+' мс';
  $('#s-cur').value=S.curve; $('#v-cur').textContent=S.curve;
  document.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('on',b.dataset.o===S.open));
}

/* ═══ СИМУЛЯЦИЯ ═══ */
function setMode(m){
  mode=m; document.body.className=m;
  $('#b-edit').classList.toggle('on',m==='edit');
  $('#b-sim').classList.toggle('on',m==='sim');
  $('#tip').textContent = m==='edit'
    ? 'тяни от кружка справа к другому элементу — появится связь · холст таскается, колесо приближает · Delete убирает'
    : 'симуляция: жми по цепочке и смотри, что за чем открывается';
  logBox.innerHTML=''; draw();
}
function step(n){
  const next=outOf(n.id);
  say(next.length ? '<b>'+n.n+'</b> → '+next.map(x=>x.n).join(', ')
                  : '<b>'+n.n+'</b> — конец цепочки');
  document.querySelectorAll('.node').forEach(q=>q.classList.remove('sel'));
  next.forEach(x=>{ const e=elById[x.id]; if(e) e.classList.add('sel'); });
}
function say(t){ const d=document.createElement('div'); d.innerHTML=t;
  logBox.insertBefore(d,logBox.firstChild);
  while(logBox.children.length>10) logBox.lastChild.remove(); }

function copyOut(){ $('#out').select(); document.execCommand('copy'); }
function pasteIn(){
  try{ const j=JSON.parse($('#out').value); if(!j.nodes||!j.links) throw new Error('нет узлов или связей');
    snap(); D=j; sel=D.nodes[0].id; all(); applyView();
  }catch(e){ alert('не разобрал: '+e.message); }
}
applyView(); setMode('edit'); all();
</script></body></html>
