<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANAMORF · конструктор селектора</title>
<style>
:root{--bg:#0a0a0c;--pan:#141418;--ln:rgba(255,255,255,.09);
  --ink:#ecedf1;--dim:rgba(236,237,241,.42);--acc:#fff;
  --ease:cubic-bezier(.2,.85,.25,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:400 13px/1.45 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:280px 1fr 260px;height:100%}
.pan{background:var(--pan);border-right:1px solid var(--ln);overflow:auto;padding:12px}
.pan:last-child{border-right:0;border-left:1px solid var(--ln)}
h3{margin:0 0 8px;font:500 10.5px/1 inherit;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
.row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
button{background:#22222a;color:var(--ink);border:1px solid var(--ln);
  border-radius:8px;padding:5px 9px;font:400 12px/1 inherit;cursor:pointer}
button:hover{background:#2e2e38;border-color:rgba(255,255,255,.3)}
button.on{background:#5a5a68;border-color:rgba(255,255,255,.5)}
input[type=text]{background:#0f0f13;color:var(--ink);border:1px solid var(--ln);
  border-radius:7px;padding:5px 8px;font:400 12px/1 inherit;width:100%}
input[type=range]{width:100%;accent-color:#dcdce4}
label{display:block;font:400 11px/1.5 inherit;color:var(--dim);margin-top:9px}
label b{color:var(--ink);font-weight:500;float:right}

/* дерево */
#tree{margin-top:4px}
.nd{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:7px;
  cursor:pointer;border:1px solid transparent}
.nd:hover{background:#1d1d23}
.nd.sel{background:#2c2c36;border-color:rgba(255,255,255,.28)}
.nd .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd .tp{font:400 9.5px/1 inherit;color:var(--dim);letter-spacing:.1em;
  text-transform:uppercase}
.nd .mini{padding:2px 5px;font-size:11px;border-radius:6px}

/* сцена */
#scene{position:relative;overflow:hidden;background:
  radial-gradient(circle at 50% 45%,#101014,#08080a 70%)}
#hintbar{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;
  align-items:center;justify-content:center;gap:8px;font:300 12px/1 inherit;
  color:var(--dim);border-top:1px solid var(--ln);background:rgba(10,10,12,.7)}
#anchor{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;
  border-radius:50%;background:#fff;cursor:grab;z-index:200;
  box-shadow:0 0 0 5px rgba(255,255,255,.09),0 0 24px 6px rgba(255,255,255,.3)}
#anchor.drag{cursor:grabbing}
.cap{position:absolute;height:var(--h,44px);transform-origin:50% 50%;
  will-change:transform,filter}
.cap .body{display:flex;align-items:center;gap:10px;white-space:nowrap;
  height:var(--h,44px);padding:0 18px 0 15px;border-radius:999px;cursor:pointer;
  background:linear-gradient(168deg,#3d3d47,#26262e);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 16px 30px -14px #000,0 2px 4px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(255,255,255,.08)}
.cap.cur .body{background:linear-gradient(168deg,#61616e,#37373f);
  border-color:rgba(255,255,255,.55);
  box-shadow:0 26px 50px -20px #000,inset 0 1px 0 rgba(255,255,255,.16)}
.cap .ic{font-size:14px;flex:none}
.cap .tx{font:400 14px/1 inherit}
.cap.cur .tx{color:#fff}
.cap .sub{font:400 11px/1 inherit;color:var(--dim)}
.dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:rgba(255,255,255,.4);cursor:pointer;transition:transform .2s var(--ease)}
.dot.pick{width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff}
.dot:hover{transform:scale(1.8)}
.dot b{position:absolute;top:15px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font:400 9.5px/1 inherit;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);pointer-events:none}
#out{width:100%;height:130px;margin-top:8px;background:#0f0f13;color:var(--dim);
  border:1px solid var(--ln);border-radius:8px;padding:7px;font:400 10px/1.4
  ui-monospace,monospace;resize:none}
</style></head><body>
<div id="app">

  <!-- ═════ СТРУКТУРА ═════ -->
  <div class="pan">
    <h3>Структура</h3>
    <div class="row">
      <button onclick="addNode(false)">+ рядом</button>
      <button onclick="addNode(true)">+ внутрь</button>
      <button onclick="delNode()">удалить</button>
    </div>
    <div class="row">
      <button onclick="move(-1)">↑</button>
      <button onclick="move(1)">↓</button>
      <button onclick="reset()" style="margin-left:auto">сброс</button>
    </div>
    <div id="tree"></div>

    <h3 style="margin-top:16px">Пункт</h3>
    <label>Имя</label>
    <input type="text" id="f-name" oninput="setF('n',this.value)">
    <label>Подпись</label>
    <input type="text" id="f-sub" oninput="setF('s',this.value)">
    <label>Значок</label>
    <input type="text" id="f-ic" oninput="setF('ic',this.value)">

    <h3 style="margin-top:16px">Готовый JSON</h3>
    <div class="row"><button onclick="copyOut()">скопировать</button>
      <button onclick="pasteIn()">вставить</button></div>
    <textarea id="out" spellcheck="false"></textarea>
  </div>

  <!-- ═════ СЦЕНА ═════ -->
  <div id="scene">
    <div id="anchor"></div>
    <div id="hintbar"><span>точку можно таскать · колесо листает · клик по строке — внутрь · правая кнопка — назад</span></div>
  </div>

  <!-- ═════ МЕХАНИКА ═════ -->
  <div class="pan">
    <h3>Раскладка</h3>
    <label>Зазор от точки <b id="v-gap"></b></label>
    <input type="range" id="s-gap" min="0" max="160" oninput="setS('gap',+this.value)">
    <label>Шаг строки <b id="v-row"></b></label>
    <input type="range" id="s-row" min="30" max="90" oninput="setS('row',+this.value)">
    <label>Высота строки <b id="v-h"></b></label>
    <input type="range" id="s-h" min="30" max="70" oninput="setS('h',+this.value)">
    <label>Видно строк в каждую сторону <b id="v-span"></b></label>
    <input type="range" id="s-span" min="1" max="6" oninput="setS('span',+this.value)">

    <h3 style="margin-top:14px">Глубина</h3>
    <label>Уход назад <b id="v-z"></b></label>
    <input type="range" id="s-z" min="0" max="200" oninput="setS('z',+this.value)">
    <label>Поворот <b id="v-rot"></b></label>
    <input type="range" id="s-rot" min="0" max="30" oninput="setS('rot',+this.value)">
    <label>Затемнение дальних <b id="v-dim"></b></label>
    <input type="range" id="s-dim" min="0" max="40" oninput="setS('dim',+this.value)">
    <label>Перспектива <b id="v-per"></b></label>
    <input type="range" id="s-per" min="300" max="2400" step="50" oninput="setS('per',+this.value)">

    <h3 style="margin-top:14px">Механика</h3>
    <label>Чем открывается уровень</label>
    <div class="row">
      <button data-o="click" onclick="setS('open','click')">клик</button>
      <button data-o="hover" onclick="setS('open','hover')">наведение</button>
      <button data-o="hold"  onclick="setS('open','hold')">удержание</button>
    </div>
    <label>Задержка / удержание <b id="v-ms"></b></label>
    <input type="range" id="s-ms" min="0" max="900" step="20" oninput="setS('ms',+this.value)">
    <label>Сторона</label>
    <div class="row">
      <button data-sd="1"  onclick="setS('side',1)">вправо</button>
      <button data-sd="-1" onclick="setS('side',-1)">влево</button>
      <button data-sd="0"  onclick="setS('side',0)">сама</button>
    </div>
    <label>Точки-намёк на глубину</label>
    <div class="row">
      <button data-hn="1" onclick="setS('hint',1)">показывать</button>
      <button data-hn="0" onclick="setS('hint',0)">нет</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const scene = $('#scene'), anchor = $('#anchor');

/* ═══ МОДЕЛЬ ═══
   Плоский список узлов с ссылкой на родителя. Плоский, а не дерево из
   вложенных объектов, ровно по одной причине: так порядок и перенос
   правятся одной строкой, а дерево пришлось бы пересобирать целиком на
   каждое движение мышкой. */
const DEF = {
  nodes:[
    {id:1, p:0, ic:'⏻', n:'Включено',          s:'мозги работают'},
    {id:2, p:0, ic:'▤', n:'Локальные',         s:'на твоём железе'},
    {id:3, p:0, ic:'☁', n:'Онлайн платные',    s:'по ключу и за деньги'},
    {id:4, p:0, ic:'◇', n:'Онлайн бесплатные', s:'по ключу, без денег'},
    {id:5, p:0, ic:'≋', n:'Диффузионные',      s:'ответ из шума'},
    {id:6, p:2, ic:'◍', n:'google/gemma-4-e4b', s:'llama.cpp · 5.8 ГБ'},
    {id:7, p:2, ic:'◍', n:'gemma4:12b',         s:'ollama · 8.1 ГБ'},
    {id:8, p:2, ic:'◍', n:'qwen3.5-9b',         s:'свой воркер · 19 ГБ'},
    {id:9, p:6, ic:'🏅', n:'Досье',       s:'надёжность и цена'},
    {id:10,p:6, ic:'⚡', n:'Скорость',    s:'кэш, контекст'},
    {id:11,p:6, ic:'🎚', n:'Сэмплинг',    s:'как она говорит'},
    {id:12,p:6, ic:'💭', n:'Размышления', s:'вслух или сразу'},
  ],
  style:{gap:34, row:44, h:44, span:2, z:78, rot:11, dim:19, per:900,
         open:'click', ms:260, side:0, hint:1},
  anchor:{x:0.34, y:0.5}
};
let D = load() || JSON.parse(JSON.stringify(DEF));
let sel = 1;                       // выбранный в дереве
let stack = [];                    // открытые уровни на сцене
let els = [], dots = [], hints = [];

function load(){ try{ return JSON.parse(localStorage.anamorf_builder); }catch(e){ return null; } }
function save(){ try{ localStorage.anamorf_builder = JSON.stringify(D); }catch(e){}
                 $('#out').value = JSON.stringify(D, null, 1); }

const kids = p => D.nodes.filter(n => n.p === p);
const byId = i => D.nodes.find(n => n.id === i);
const nextId = () => Math.max(0, ...D.nodes.map(n => n.id)) + 1;

/* ═══ ДЕРЕВО ═══ */
function tree(){
  const box = $('#tree'); box.innerHTML = '';
  (function walk(p, d){
    kids(p).forEach(n => {
      const el = document.createElement('div');
      el.className = 'nd' + (n.id === sel ? ' sel' : '');
      el.style.marginLeft = (d*13)+'px';
      el.innerHTML = '<span>'+(n.ic||'◍')+'</span><span class="nm">'+n.n+'</span>'
        + (kids(n.id).length ? '<span class="tp">'+kids(n.id).length+'</span>' : '');
      el.onclick = () => { sel = n.id; tree(); fields(); openTo(n.id); };
      box.appendChild(el);
      walk(n.id, d+1);
    });
  })(0, 0);
}
function fields(){
  const n = byId(sel); if (!n) return;
  $('#f-name').value = n.n; $('#f-sub').value = n.s || ''; $('#f-ic').value = n.ic || '';
}
function setF(k, v){ const n = byId(sel); if (!n) return; n[k] = v; tree(); save(); draw(); }

function addNode(inside){
  const cur = byId(sel);
  const p = inside ? sel : (cur ? cur.p : 0);
  const n = {id:nextId(), p, ic:'◍', n:'новый пункт', s:''};
  D.nodes.push(n); sel = n.id; tree(); fields(); save(); openTo(n.id);
}
function delNode(){
  const kill = new Set([sel]);
  let grew = true;
  while (grew){ grew = false;
    D.nodes.forEach(n => { if (kill.has(n.p) && !kill.has(n.id)){ kill.add(n.id); grew = true; } }); }
  D.nodes = D.nodes.filter(n => !kill.has(n.id));
  sel = D.nodes.length ? D.nodes[0].id : 0;
  tree(); fields(); save(); build();
}
function move(d){
  const i = D.nodes.findIndex(n => n.id === sel); if (i < 0) return;
  const sib = D.nodes.filter(n => n.p === D.nodes[i].p);
  const k = sib.indexOf(D.nodes[i]); const t = sib[k+d]; if (!t) return;
  const j = D.nodes.indexOf(t);
  [D.nodes[i], D.nodes[j]] = [D.nodes[j], D.nodes[i]];
  tree(); save(); build();
}
function reset(){ D = JSON.parse(JSON.stringify(DEF)); sel = 1; tree(); fields(); sliders(); save(); build(); }

/* ═══ ПОЛЗУНКИ ═══ */
function setS(k, v){ D.style[k] = v; sliders(); save(); build(); }
function sliders(){
  const S = D.style;
  const put = (id, val, txt) => { const e = $(id); if (e) e.value = val;
    const t = $(id.replace('#s-','#v-')); if (t) t.textContent = txt; };
  put('#s-gap', S.gap, S.gap+' px'); put('#s-row', S.row, S.row+' px');
  put('#s-h', S.h, S.h+' px');       put('#s-span', S.span, S.span);
  put('#s-z', S.z, S.z+' px');       put('#s-rot', S.rot, S.rot+'°');
  put('#s-dim', S.dim, (S.dim/100).toFixed(2)); put('#s-per', S.per, S.per+' px');
  put('#s-ms', S.ms, S.ms+' мс');
  document.querySelectorAll('[data-o]').forEach(b => b.classList.toggle('on', b.dataset.o === S.open));
  document.querySelectorAll('[data-sd]').forEach(b => b.classList.toggle('on', +b.dataset.sd === S.side));
  document.querySelectorAll('[data-hn]').forEach(b => b.classList.toggle('on', +b.dataset.hn === S.hint));
}

/* ═══ СЦЕНА ═══ */
const W = () => scene.clientWidth, H = () => scene.clientHeight - 38;
function ax(){ return D.anchor.x * W(); }
function ay(){ return D.anchor.y * H(); }

function build(){
  stack = [{p:0, cur:0, x:ax(), y:ay()}];
  draw();
}
function openTo(id){                       // раскрыть путь до узла из дерева
  const path = []; let n = byId(id);
  while (n){ path.unshift(n); n = byId(n.p); }
  stack = [{p:0, cur:0, x:ax(), y:ay()}];
  path.forEach((node, i) => {
    const lvl = stack[stack.length-1];
    const k = kids(lvl.p);
    lvl.cur = Math.max(0, k.findIndex(x => x.id === node.id));
    if (i < path.length-1) stack.push({p:node.id, cur:0, x:0, y:0});
  });
  draw();
}

function sideOf(lvl, w){
  const S = D.style;
  if (S.side !== 0) return S.side;
  return (lvl.x + S.gap + w + 30 < W()) ? 1 : -1;
}

function draw(){
  els.forEach(e => e.remove()); els = [];
  dots.forEach(e => e.remove()); dots = [];
  hints.forEach(e => e.remove()); hints = [];
  const S = D.style;
  scene.style.perspective = S.per + 'px';
  anchor.style.left = ax()+'px'; anchor.style.top = ay()+'px';

  stack.forEach((lvl, li) => {
    if (li === 0){ lvl.x = ax(); lvl.y = ay(); }
    scene.style.perspectiveOrigin = lvl.x+'px '+lvl.y+'px';
    const k = kids(lvl.p);
    if (!k.length) return;
    lvl.cur = Math.min(lvl.cur, k.length-1);
    const last = li === stack.length-1;
    let wMax = 240;

    k.forEach((it, i) => {
      let off = i - lvl.cur;
      const n = k.length;
      if (off >  n/2) off -= n;
      if (off < -n/2) off += n;
      if (Math.abs(off) > S.span) return;
      const el = document.createElement('div');
      el.className = 'cap' + (off === 0 ? ' cur' : '');
      el.style.setProperty('--h', S.h+'px');
      el.innerHTML = '<div class="body"><span class="ic">'+(it.ic||'◍')+'</span>'
        + '<span class="tx">'+it.n+'</span>'
        + (it.s ? '<span class="sub">'+it.s+'</span>' : '') + '</div>';
      scene.appendChild(el);
      (last ? els : dots).push(el);
      el._it = it; el._lvl = lvl; el._off = off;
      if (!last){ el.style.display = 'none'; return; }
      wire(el, it, lvl, i);
    });

    // ширина выбранной — от неё пляшет всё остальное
    const cur = (last ? els : []).find(e => e.classList.contains('cur'));
    if (cur) wMax = cur.querySelector('.body').offsetWidth;
    lvl.w = wMax;
    const sg = sideOf(lvl, wMax);
    lvl.sg = sg;

    (last ? els : []).forEach(el => {
      const off = el._off, kk = Math.abs(off);
      el.style.left = (lvl.x + (sg>0 ? S.gap : -S.gap))+'px';
      el.style.top  = (lvl.y + off*S.row)+'px';
      el.style.transform = 'translateY(-50%) '+(sg<0?'translateX(-100%) ':'')
        + 'translateZ('+(-kk*S.z)+'px) rotateX('+(off*-S.rot)+'deg)';
      el.style.filter = 'brightness('+(1 - Math.min(.7, kk*S.dim/100)).toFixed(2)+')';
      el.style.zIndex = 100 - kk;
    });

    // не последний уровень — точками на своих местах
    if (!last){
      k.forEach((it, i) => {
        let off = i - lvl.cur; const n = k.length;
        if (off >  n/2) off -= n;
        if (off < -n/2) off += n;
        if (Math.abs(off) > S.span) return;
        const d = document.createElement('div');
        d.className = 'dot' + (off === 0 ? ' pick' : '');
        d.style.left = (lvl.x + sg*(S.gap + lvl.w + 6))+'px';
        d.style.top  = (lvl.y + off*S.row)+'px';
        if (off === 0) d.innerHTML = '<b>'+it.n+'</b>';
        d.onclick = () => { stack.length = li+1; lvl.cur = i; draw(); };
        scene.appendChild(d); dots.push(d);
      });
      // следующий уровень стоит вплотную за дальним краем
      const nx = stack[li+1];
      if (nx){ nx.x = lvl.x + sg*(S.gap + lvl.w + 6); nx.y = lvl.y; }
    } else if (S.hint){
      const it = k[lvl.cur];
      if (it && kids(it.id).length){
        [-1,0,1].forEach(q => {
          const d = document.createElement('div');
          d.className = 'dot' + (q===0?' pick':'');
          d.style.left = (lvl.x + sg*(S.gap + lvl.w + 16 + Math.abs(q)*6))+'px';
          d.style.top  = (lvl.y + q*12)+'px';
          d.onclick = () => dive(lvl, it);
          if (S.open === 'hover'){
            let t=0; d.onpointerenter=()=>{t=setTimeout(()=>dive(lvl,it),S.ms);};
            d.onpointerleave=()=>clearTimeout(t);
          }
          scene.appendChild(d); hints.push(d);
        });
      }
    }
  });
  $('#out').value = JSON.stringify(D, null, 1);
}

function wire(el, it, lvl, i){
  const S = D.style;
  const k = kids(lvl.p);
  const go = () => { lvl.cur = k.indexOf(it); draw(); if (kids(it.id).length) dive(lvl, it); };
  if (S.open === 'hold'){
    let t = 0;
    el.onpointerdown = ev => { ev.preventDefault(); lvl.cur = k.indexOf(it); draw();
      t = setTimeout(() => { if (kids(it.id).length) dive(lvl, it); }, S.ms); };
    el.onpointerup = () => clearTimeout(t);
    el.onpointerleave = () => clearTimeout(t);
  } else if (S.open === 'hover'){
    let t = 0;
    el.onclick = () => { lvl.cur = k.indexOf(it); draw(); };
    el.onpointerenter = () => { t = setTimeout(go, S.ms); };
    el.onpointerleave = () => clearTimeout(t);
  } else {
    el.onclick = () => { if (lvl.cur === k.indexOf(it)) go();
                         else { lvl.cur = k.indexOf(it); draw(); } };
  }
}
function dive(lvl, it){
  const li = stack.indexOf(lvl);
  stack.length = li+1;
  stack.push({p:it.id, cur:0, x:0, y:0});
  sel = it.id; tree(); fields(); draw();
}

/* ═══ ЖЕСТЫ ═══ */
let drag = false;
anchor.addEventListener('pointerdown', ev => { drag = true; anchor.classList.add('drag');
  anchor.setPointerCapture(ev.pointerId); });
addEventListener('pointermove', ev => {
  if (!drag) return;
  const r = scene.getBoundingClientRect();
  D.anchor.x = Math.max(.03, Math.min(.97, (ev.clientX - r.left)/W()));
  D.anchor.y = Math.max(.05, Math.min(.95, (ev.clientY - r.top)/H()));
  draw();
});
addEventListener('pointerup', () => { if (drag){ drag = false;
  anchor.classList.remove('drag'); save(); } });
scene.addEventListener('wheel', ev => {
  if (!stack.length) return;
  ev.preventDefault();
  const lvl = stack[stack.length-1], n = kids(lvl.p).length;
  if (!n) return;
  lvl.cur = (lvl.cur + (ev.deltaY > 0 ? -1 : 1) + n) % n;
  draw();
}, {passive:false});
scene.addEventListener('contextmenu', ev => { ev.preventDefault();
  if (stack.length > 1){ stack.pop(); draw(); } });
