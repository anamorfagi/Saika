  <!-- зеркальные пометки, как в тетрадях Леонардо -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#6a4630" opacity="0.75">
    <text transform="translate(724 140) scale(-1 1)" font-size="19">studio di donna</text>
    <text transform="translate(724 168) scale(-1 1)" font-size="15">la proportione del volto</text>
    <text transform="translate(724 192) scale(-1 1)" font-size="15">ochio chinato</text>
    <text transform="translate(700 900) scale(-1 1)" font-size="14">capelli come l'acqua</text>
    <text transform="translate(240 910) scale(-1 1)" font-size="14">moto de' capelli</text>
  </g>

  <text x="400" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="7" fill="#7a5a3a" opacity="0.45">STVDIO DI TESTA DI DONNA</text>

  <rect width="800" height="1000" fill="url(#vig)"/>
  <rect x="16" y="16" width="768" height="968" fill="none" stroke="#6a4a2a" stroke-width="2" opacity="0.45"/>
  <rect x="26" y="26" width="748" height="948" fill="none" stroke="#6a4a2a" stroke-width="1" opacity="0.3"/>
</svg>
