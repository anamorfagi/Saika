<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#e9dab9"/>
      <stop offset="55%" stop-color="#dfcfa8"/>
      <stop offset="100%" stop-color="#c6af80"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#3a2a18" stop-opacity="0"/>
      <stop offset="78%" stop-color="#3a2a18" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3a2a18" stop-opacity="0.30"/>
    </radialGradient>
    <radialGradient id="stain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a6a3a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8a6a3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.05 0"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#paper)"/>
  <rect width="800" height="1000" filter="url(#noise)" opacity="0.55"/>
  <ellipse cx="140" cy="860" rx="190" ry="120" fill="url(#stain)"/>
  <ellipse cx="680" cy="180" rx="150" ry="110" fill="url(#stain)"/>
  <ellipse cx="620" cy="720" rx="120" ry="90" fill="url(#stain)"/>

  <!-- пропорциональный этюд (как на листах Леонардо) -->
