<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANAMORF · радиальный селектор — проба</title>
<style>
:root{
  --bg:#08080a; --ink:#ecedf1; --dim:rgba(236,237,241,.34);
  --ease:cubic-bezier(.2,.85,.25,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.4 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none}

/* Сцена смотрит через перспективу: барабан обязан УХОДИТЬ, а не просто
   мельчать. Без точки схода дальние капсулы читаются как «другие
   кнопки», с ней — как та же лента, повёрнутая от тебя. */
#stage{position:absolute;inset:0;overflow:hidden;perspective:1100px;
  perspective-origin:50% 50%}

/* сектор — просто подсветка области, в которую нажали */
#sect{position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .4s var(--ease);
  background:radial-gradient(circle at var(--px) var(--py),
    rgba(255,255,255,.045),transparent 46%)}
body.open #sect{opacity:1}

#ring{position:absolute;left:50%;top:50%;width:190px;height:190px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 30%,#fff,#e2e5ea 62%,#c8ccd4);
  box-shadow:0 26px 60px -26px #000, inset 0 2px 3px #fff,
             inset 0 -12px 24px -12px rgba(20,24,32,.3);
  display:grid;place-items:center;text-align:center;
  transition:transform .55s var(--ease),filter .55s var(--ease)}
#ring b{display:block;color:#0b0b0d;font:200 15px/1 inherit;letter-spacing:.26em;
  text-indent:.26em}
#ring i{display:block;margin-top:6px;color:rgba(11,11,13,.42);
  font:500 8px/1 inherit;letter-spacing:.28em;font-style:normal}
body.open #ring{transform:translate(-50%,-50%) scale(.72);filter:brightness(.5)}

/* ── ТОЧКА УРОВНЯ ──
   Первая точка ставится там, куда легла рука. Дальше каждый уровень
   оставляет свою — и все они видны сразу, так что глубину видно, не
   вспоминая: три кружка на дороге значит три уровня пройдено. */

/* ── КАПСУЛА ── */
/* СПИСОК, А НЕ ВЕЕР.
   Веер пробовали — владелец посмотрел и сказал: не то. Капсулы теперь
   стоят столбиком, как строки, и это честнее: список и есть список, а
   раскладывать его лучами значило заставлять глаз бежать по дуге там,
   где он привык бежать сверху вниз.

   Глубина осталась и делает главную работу. Крайние капсулы отвёрнуты
   от зрителя и отодвинуты назад — это не «другие кнопки», это та же
   лента, уходящая в барабан. Ближняя строка стоит ровно и светлее всех,
   и именно она выбрана. Прозрачности нет нигде: дальние ТЕМНЕЕ, а не
   прозрачнее, — сквозь прозрачную видно фон, и текст на ней тонет. */
.cap{position:absolute;left:0;top:0;height:44px;
  transform-origin:50% 50%;will-change:transform,filter;
  transform-style:preserve-3d}
.cap .body{display:flex;align-items:center;gap:11px;white-space:nowrap;
  height:44px;padding:0 20px 0 16px;border-radius:999px;cursor:pointer;
  background:linear-gradient(168deg,#3d3d47,#26262e);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 16px 30px -14px rgba(0,0,0,.95), 0 2px 4px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(255,255,255,.08)}
/* Список слева от точки сдвигается целиком, но ПОРЯДОК внутри строки не
   трогаем. Разворот содержимого ставил подпись перед именем — «зрение,
   инструменты, длина  Возможности», — и строка начинала читаться с
   конца. Зеркалить надо раскладку, а не язык. */
.cap .ic{font-size:15px;line-height:1;flex:none}
.cap .tx{font:400 14.5px/1 inherit;letter-spacing:.005em}
.cap .sub{font:400 11px/1 inherit;color:var(--dim)}
.cap .rt{font:500 10px/1 inherit;color:var(--dim);letter-spacing:.08em}
/* Выбранная — светлее и с обводкой. Внимание сохраняется: одна ярче,
   значит остальные обязаны быть темнее. */
.cap.cur .body{background:linear-gradient(168deg,#61616e,#37373f);
  border-color:rgba(255,255,255,.55);
  box-shadow:0 26px 50px -20px #000, 0 3px 6px rgba(0,0,0,.75),
             inset 0 1px 0 rgba(255,255,255,.16)}
.cap.cur .tx{color:#fff}
.cap.cur .rt{color:rgba(255,255,255,.75)}

/* ── ТОЧКИ ПРОЙДЕННОГО УРОВНЯ ──
   Ушёл вглубь — ВЕСЬ уровень сворачивается в точки, каждая капсула в свою,
   на своём месте. Получается след из точек: сколько развилок прошёл, столько
   и веерков точек на экране, и видно, где ты сворачивал. Возврат — наведись
   на точку: не только на ту, что выбирал, а на любую из того уровня, и
   уровень раскроется заново уже на ней.

   Пунктирных нитей между уровнями нет. Они были попыткой объяснить связь,
   которой и так не требуется объяснений: новый веер растёт ИЗ точки, а
   значит уже сказал всё, что нить могла бы сказать. */
.dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.34);
  box-shadow:0 0 0 3px rgba(255,255,255,.05);
  transition:transform .32s var(--spring), background .22s var(--ease),
             box-shadow .22s var(--ease)}
.dot.pick{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;
  background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.10),
                             0 0 22px 5px rgba(255,255,255,.28)}
.dot:hover{transform:scale(1.9);background:#fff;
  box-shadow:0 0 0 6px rgba(255,255,255,.10)}
.dot b{position:absolute;top:18px;left:50%;transform:translateX(-50%) scale(.8);
  transform-origin:top center;white-space:nowrap;
  font:400 10px/1 inherit;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(236,237,241,0);pointer-events:none;transition:color .22s var(--ease)}
.dot:hover b,.dot.pick b{color:rgba(236,237,241,.42)}
.dot:hover b{color:rgba(236,237,241,.92)}

/* строка снизу */
#hint{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;
  align-items:center;justify-content:center;gap:10px;
  font:300 12.5px/1 inherit;color:var(--dim);letter-spacing:.02em;
  border-top:1px solid rgba(255,255,255,.05)}
#hint b{font-weight:400;letter-spacing:.18em;color:rgba(236,237,241,.72)}
#crumb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;
  align-items:center;justify-content:center;gap:14px;
  font:400 10.5px/1 inherit;letter-spacing:.2em;color:rgba(236,237,241,.26);
  text-transform:uppercase}
#crumb span.on{color:rgba(236,237,241,.8)}
</style></head><body>

<div id="stage">
  <div id="sect"></div>
  <div id="ring"><div><b>ANAMORF</b><i>МОЗГИ</i></div></div>
</div>
<div id="crumb"></div>
<div id="hint"><span>нажми в любом месте — веер вырастет оттуда</span></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage');
const NS = 'http://www.w3.org/2000/svg';

/* ═══════════════ ДАННЫЕ (понарошку, но по форме настоящие) ═══════════════ */
const MODELS = {
  local:[
    {n:'google/gemma-4-e4b', r:9.1, s:'llama.cpp · 5.8 ГБ'},
    {n:'gemma4:12b',         r:8.4, s:'ollama · 8.1 ГБ'},
    {n:'qwen3.5-9b-abliterated', r:8.0, s:'свой воркер · 19 ГБ'},
    {n:'mistral-small-2603', r:7.2, s:'ollama · 14 ГБ'},
    {n:'phi-5-mini',         r:6.1, s:'llama.cpp · 2.4 ГБ'},
  ],
  paid:[
    {n:'openai/gpt-4.1',     r:9.6, s:'$2.00 / 1М'},
    {n:'kimi-k3',            r:9.2, s:'$0.60 / 1М'},
    {n:'GigaChat-2-Pro',     r:8.8, s:'₽ по пакету'},
    {n:'openai/gpt-4.1-mini',r:8.3, s:'$0.40 / 1М'},
    {n:'mistral-medium-3-5', r:7.9, s:'€0.40 / 1М'},
  ],
  free:[
    {n:'@cf/qwen/qwen3-30b', r:8.1, s:'Cloudflare · бесплатно'},
    {n:'GigaChat',           r:7.4, s:'Сбер · бесплатный тир'},
    {n:'@cf/meta/llama-3.3-70b', r:7.1, s:'Cloudflare · бесплатно'},
    {n:'mistral-small (free)', r:6.6, s:'1 млрд ток/мес'},
  ],
  diff:[
    {n:'LLaDA-8B',           r:6.8, s:'DreamPC · 15 ГБ'},
    {n:'Dream-7B-Instruct',  r:6.2, s:'DreamPC · 13 ГБ'},
  ],
};
/* ТРЕТИЙ УРОВЕНЬ — всё, что относится к ОДНОЙ модели и больше ни к чему.
   Сэмплинг и размышления живут здесь, а не в органе: и то и другое —
   свойство конкретной модели, а не мозгов вообще. У gemma свой сэмплинг,
   у gpt-4.1 свой, и общий на двоих был бы неправдой. */
const DEEP = [
  {ic:'🏅', n:'Досье',        s:'надёжность и цена'},
  {ic:'⚡', n:'Скорость',     s:'кэш, контекст, температура'},
  {ic:'🎚', n:'Сэмплинг',     s:'как она говорит'},
  {ic:'💭', n:'Размышления',  s:'думать вслух или отвечать сразу'},
  {ic:'👁', n:'Возможности',  s:'зрение, инструменты, длина'},
  {ic:'🎓', n:'Обучение',     s:'дообучить на характере'},
];
/* Первый уровень органа «Мозги» */
const L1 = [
  {ic:'⏻',  n:'Включено',   s:'мозги работают', kind:'toggle', on:true},
  {ic:'▤',  n:'Локальные',  s:'на твоём железе', kind:'list', set:'local'},
  {ic:'☁',  n:'Онлайн платные', s:'по ключу и за деньги', kind:'list', set:'paid'},
  {ic:'◇',  n:'Онлайн бесплатные', s:'по ключу, без денег', kind:'list', set:'free'},
  {ic:'≋',  n:'Диффузионные', s:'ответ проявляется из шума', kind:'list', set:'diff'},
];

/* ═══════════════ СОСТОЯНИЕ ═══════════════
   У КАЖДОГО УРОВНЯ СВОЯ ТОЧКА. Первая — там, куда легла рука. Каждая
   следующая отступает от предыдущей по лучу выбранной карты, так что
   точки выстраиваются в цепочку и показывают пройденную дорогу.
   Пройденные уровни свёрнуты в кружки и живы: навёл — вернулся. */
/* Веер РОВНЫЙ: маленький угловой шаг и большой радиус. Круче — и карты
   встают лесенкой, у которой каждая следующая читается хуже предыдущей.
   Наклон нужен ровно настолько, чтобы было видно, что карт много. */
/* РАДИУС МАЛЕНЬКИЙ. Карты начинаются почти от самой точки — как карты в
   руке, которые сходятся у большого пальца и расходятся дальними углами.
   Раньше радиус был сто пятьдесят, и между точкой и первой картой зияла
   пустая ладонь; пока там лежал пунктир, дыру было чем оправдать, а без
   него осталась просто дыра.

   Разносит карты не радиус, а ДЛИНА: поворот на семь градусов уводит
   дальний конец на четыре десятка пикселей, и веер раскрывается сам
   собой, не расталкивая начало. */
/* ROW — шаг строки, GAP — зазор от точки уровня до списка. Зазор
   маленький намеренно: владелец просил вплотную, и он прав — пустая
   полоса между точкой и списком ничего не сообщает, а место ест. */
const ROW = 46, GAP = 16, SPAN = 3;
const DEEP_Z = 78, DEEP_ROT = 11;   // насколько дальние уходят в барабан

let stack = [];        // [{items, cur, title, x, y, dir, ic}]
let els = [], nodes = [], busy = false;

const rad = d => d*Math.PI/180;
const W = () => stage.clientWidth, H = () => stage.clientHeight;
const top_ = () => stack[stack.length-1];


/* ═══════════════ С КАКОЙ СТОРОНЫ ═══════════════
   Список вертикальный, деваться ему по вертикали некуда — значит вопрос
   только один: вправо от точки или влево. Вправо, пока справа есть место.

   Тут раньше жила целая тригонометрия поиска направления по всему кругу.
   Она честно работала и была не нужна: у списка два положения, а не
   триста шестьдесят. */
function side(x, y, w){
  return (x + GAP + w + 24 < W()) ? 1 : -1;
}

/* ═══════════════ ОТКРЫТЬ / ЗАКРЫТЬ ═══════════════ */
function open(x, y){
  document.body.classList.add('open');
  stage.style.setProperty('--px', x+'px');
  stage.style.setProperty('--py', y+'px');
  stack = [{items:L1, cur:1, title:'МОЗГИ', ic:'◆', x, y, side:1}];
  render(true);
}
function close(){
  document.body.classList.remove('open');
  els.forEach(e => e.remove()); els = [];
  nodes.forEach(e => e.remove()); nodes = [];
  stack = []; crumb(); hint('нажми в любом месте — веер вырастет оттуда');
}

/* ═══════════════ РАСКЛАДКА КАРТ ═══════════════ */
function offOf(i, lvl){
  const n = lvl.items.length;
  let off = i - lvl.cur;
  if (off >  n/2) off -= n;
  if (off < -n/2) off += n;
  return off;
}
function place(el, off, lvl, grow){
  const k = Math.abs(off);
  const sg = lvl.side || 1;
  el.classList.toggle('right', sg < 0);
  /* Строка тем дальше, чем дальше от выбранной: уходит назад по Z и
     отворачивается по X. Ближняя стоит ровно — она и есть выбор. */
  const z = grow ? -260 : -k*DEEP_Z;
  const rx = grow ? -26 : off*-DEEP_ROT;
  const y = lvl.y + off*ROW;
  const x = lvl.x + sg*GAP;
  el.style.transform =
    'translate('+x+'px,'+y+'px) translateY(-50%) '+
    (sg < 0 ? 'translateX(-100%) ' : '') +
    'translateZ('+z+'px) rotateX('+rx+'deg)';
  // дальние ТЕМНЕЕ, а не прозрачнее
  el.style.filter = 'brightness('+(1 - Math.min(.62, k*.19)).toFixed(2)+')';
  el.style.opacity = (k > SPAN || grow) ? 0 : 1;
  el.style.zIndex = 100 - k;
  el.classList.toggle('cur', off === 0);
  el.style.pointerEvents = k > SPAN ? 'none' : 'auto';
}

/* Точка капсулы — её БЛИЖНИЙ конец, тот, которым она крепилась к уровню.
   Он один и тот же и для обычного веера, и для зеркального, поэтому
   считается одинаково: точка уровня плюс радиус по лучу карты. */
/* Точка капсулы — её ближний край. Свёрнутый уровень оставляет столбик
   таких точек: форма списка сохраняется, и видно, на какой строке ты
   сворачивал. */
function capPoint(lvl, off){
  return {x: lvl.x + (lvl.side || 1)*GAP*0.5, y: lvl.y + off*ROW};
}

function render(grow){
  els.forEach(e => e.remove()); els = [];
  const lvl = top_();
  if (lvl.side === undefined) lvl.side = 1;
  lvl.items.forEach((it, i) => {
    const off = offOf(i, lvl);
    if (Math.abs(off) > SPAN + 1) return;
    const el = document.createElement('div');
    el.className = 'cap';
    el.dataset.i = i;
    el.innerHTML = '<div class="body">' +
      '<span class="ic">'+(it.ic || '◍')+'</span>' +
      '<span class="tx">'+it.n+'</span>' +
      (it.s ? '<span class="sub">'+it.s+'</span>' : '') +
      (it.r ? '<span class="rt">'+it.r.toFixed(1)+'</span>' : '') + '</div>';
    stage.appendChild(el); els.push(el);
    if (grow){
      el.style.transition = 'none';
      place(el, off, lvl, true);          // рождается из глубины барабана
      requestAnimationFrame(() => {
        el.style.transition = 'transform .46s var(--spring), '
                            + 'opacity .3s var(--ease), filter .3s var(--ease)';
        setTimeout(() => place(el, off, lvl), Math.abs(off)*38);
      });
    } else {
      el.style.transition = 'transform .38s var(--spring), '
                          + 'opacity .26s var(--ease), filter .26s var(--ease)';
      place(el, off, lvl);
    }
    el.addEventListener('click', ev => { ev.stopPropagation(); pick(i); });
  });
  /* Сторону и ширину знаем только после отрисовки: ширина капсулы
     зависит от текста, а угадывать её значит промахиваться. */
  requestAnimationFrame(() => {
    const cur = els.find(e => e.classList.contains('cur'));
    lvl.w = cur ? cur.querySelector('.body').offsetWidth : 260;
    const sg = side(lvl.x, lvl.y, lvl.w);
    if (sg !== lvl.side){ lvl.side = sg; els.forEach(e =>
      place(e, offOf(+e.dataset.i, lvl), lvl)); paintNodes(); }
  });
  paintNodes(); crumb(); say();
}
function repos(){
  const lvl = top_();
  els.forEach(el => place(el, offOf(+el.dataset.i, lvl), lvl));
  say();
}

/* ═══════════════ КРУЖКИ ПРОЙДЕННЫХ УРОВНЕЙ ═══════════════ */
function paintNodes(){
  nodes.forEach(e => e.remove()); nodes = [];
  stack.forEach((lvl, li) => {
    if (li === stack.length - 1) return;          // текущий раскрыт
    lvl.items.forEach((it, ii) => {
      const off = offOf(ii, lvl);
      if (Math.abs(off) > SPAN) return;
      const p = capPoint(lvl, off);
      const el = document.createElement('div');
      el.className = 'dot' + (off === 0 ? ' pick' : '');
      el.style.left = p.x+'px'; el.style.top = p.y+'px';
      el.innerHTML = '<b>'+it.n+'</b>';
      el.title = it.n;
      /* Возврат по наведению с остановкой: рука по дороге к картам
         проходит над точками, и мгновенный возврат отбрасывал бы назад
         ровно тогда, когда человек тянется вперёд. */
      let t = 0;
      el.addEventListener('pointerenter', () => {
        t = setTimeout(() => { lvl.cur = ii; popTo(li); }, 380);
      });
      el.addEventListener('pointerleave', () => clearTimeout(t));
      el.addEventListener('click', ev => {
        ev.stopPropagation(); clearTimeout(t); lvl.cur = ii; popTo(li);
      });
      stage.appendChild(el); nodes.push(el);
    });
  });
}

/* ═══════════════ ВГЛУБЬ И ОБРАТНО ═══════════════ */
function dive(next){
  if (busy) return; busy = true;
  const lvl = top_();
  /* Карты СХЛОПЫВАЮТСЯ В СВОЮ ТОЧКУ, и точка остаётся стоять кружком.
     Следующий уровень отступает по лучу выбранной карты — так цепочка
     точек показывает дорогу, а не наваливается сама на себя. */
  /* Уровень уходит В ГЛУБИНУ БАРАБАНА и гаснет — каждая строка на своём
     месте, не сваливаясь в общую кучу. Поэтому от уровня остаётся
     столбик точек, повторяющий его форму: видно, на какой строке
     сворачивал. */
  els.forEach(el => {
    const off = offOf(+el.dataset.i, lvl);
    el.style.transition = 'transform .3s var(--ease), opacity .26s var(--ease)';
    place(el, off, lvl, true);
  });
  /* Новый уровень начинается ровно там, где была выбранная капсула, —
     в её ближнем конце. Никаких отступов и никаких нитей: капсула
     свернулась в точку, и из этой самой точки пошёл следующий веер. */
  /* Следующий уровень встаёт ВПЛОТНУЮ за выбранной строкой — сразу за её
     дальним краем. Никаких отступов «на всякий случай»: уровни идут один
     за другим лентой, и пустота между ними ничего не сообщала бы. */
  const sg = lvl.side || 1;
  const w = lvl.w || 260;
  next.x = Math.max(20, Math.min(W()-20, lvl.x + sg*(GAP + w + GAP)));
  next.y = Math.max(60, Math.min(H()-80, lvl.y));
  next.side = sg;
  setTimeout(() => { stack.push(next); render(true); busy = false; }, 300);
}
function popTo(i){
  if (busy || i >= stack.length - 1) return;
  busy = true;
  const cur = top_();
  els.forEach(el => {
    el.style.transition = 'transform .26s var(--ease), opacity .2s var(--ease)';
    place(el, offOf(+el.dataset.i, cur), cur, true);
  });
  setTimeout(() => { stack.length = i + 1; render(true); busy = false; }, 240);
}
function back(){
  if (busy) return;
  if (stack.length <= 1){ close(); return; }
  popTo(stack.length - 2);
}

function pick(i){
  const lvl = top_();
  if (i !== lvl.cur){ lvl.cur = i; repos(); paintNodes(); return; }
  const it = lvl.items[i];
  if (it.kind === 'toggle'){
    it.on = !it.on; it.s = it.on ? 'мозги работают' : 'выключено';
    render(false); return;
  }
  if (it.kind === 'list'){
    const arr = MODELS[it.set].slice().sort((a,b) => b.r - a.r)
                  .map(m => ({...m, kind:'model', ic:'◍'}));
    dive({items:arr, cur:0, title:it.n, ic:it.ic});
    return;
  }
  if (it.kind === 'model'){
    dive({items:DEEP.map(d => ({...d, kind:'leaf'})), cur:0, title:it.n, ic:'◍'});
    return;
  }
  if (it.kind === 'leaf') hint('<b>'+it.n.toUpperCase()+'</b> — тут открылась бы панель');
}

function crumb(){
  $('#crumb').innerHTML = stack.map((l,i) =>
    '<span'+(i===stack.length-1?' class="on"':'')+'>'+l.title+'</span>').join(' › ');
}
function say(){
  const lvl = top_(); if (!lvl) return;
  const it = lvl.items[lvl.cur] || {};
  hint('<b>'+(it.n||'').toUpperCase()+'</b> — колесо листает · клик по центру идёт глубже'
       + (stack.length > 1 ? ' · наведи на кружок — вернёшься' : ''));
}
function hint(h){ $('#hint').innerHTML = '<span>'+h+'</span>'; }

/* ═══════════════ ЖЕСТЫ ═══════════════ */
stage.addEventListener('pointerdown', ev => {
  if (ev.button === 2) return;
  if (ev.target.closest('.cap') || ev.target.closest('.dot')) return;
  if (document.body.classList.contains('open')){ close(); return; }
  open(ev.clientX, ev.clientY);
});
addEventListener('contextmenu', ev => { ev.preventDefault(); if (stack.length) back(); });
addEventListener('keydown', ev => {
  if (ev.key === 'Escape') back();
  if (!stack.length) return;
  const lvl = top_(), n = lvl.items.length;
  if (ev.key === 'ArrowUp')   { lvl.cur = (lvl.cur - 1 + n) % n; repos(); }
  if (ev.key === 'ArrowDown') { lvl.cur = (lvl.cur + 1) % n; repos(); }
  if (ev.key === 'Enter')     pick(lvl.cur);
});
addEventListener('wheel', ev => {
  if (!stack.length) return;
  ev.preventDefault();
  const lvl = top_(), n = lvl.items.length;
  // вниз колесом — вверх по списку: рука крутит переднюю грань барабана
  lvl.cur = (lvl.cur + (ev.deltaY > 0 ? -1 : 1) + n) % n;
  repos();
}, {passive:false});
addEventListener('resize', () => { if (stack.length) render(false); });
</script></body></html>
